name: Release Binaries

# New forks must enable Actions before dispatching a branch-based validation run.
# Builds self-contained, ready-to-run release archives of the TensorSharp apps
# (TensorSharp.Server.Host, TensorSharp.Cli and TensorAgent Desktop) and
# attaches them to a GitHub Release.
#
# Unlike `publish-nuget.yml` (which packs managed-only NuGet packages and skips
# the native build), this workflow builds the native libraries on each OS and
# bundles them into the published apps, so each archive is runnable without a
# .NET install or a separate native build:
#
#   - win-x64-cpu      GgmlOps.dll (CPU)                       -> .zip
#   - win-x64-cuda     GgmlOps.dll (+CUDA) + PTX + CUDA redist -> .zip
#   - linux-x64-cpu    libGgmlOps.so (CPU)                     -> .tar.gz
#   - linux-x64-cuda   libGgmlOps.so (+CUDA) + PTX + CUDA redist -> .tar.gz
#   - osx-arm64        libGgmlOps.dylib (Metal) + MLX dylibs   -> .tar.gz
#   - TensorAgent Desktop osx-arm64 (Metal/CPU)               -> .dmg/.pkg/.zip
#   - TensorAgent Desktop win-x64-cpu / win-x64-cuda          -> .msi/.zip
# TensorAgent macOS packages require Developer ID signing and notarization;
# Windows packages are unsigned. Desktop packages
# bundle .NET/native runtimes, but models and optional Python/Node are separate.
# Windows requires Evergreen WebView2. See docs/tensoragent_desktop.md.
#   - linux-arm64-cuda13-GB10  SM121a GGML + PTX + CUDA 13 redist -> .tar.gz
#
# The x64 CUDA archives bundle the CUDA 12.x runtime libraries (cudart / cublas /
# cublasLt) so they run against any NVIDIA driver new enough for the toolkit;
# they still require an NVIDIA GPU + driver at run time. The CPU archives run
# anywhere (the GGML CPU backend); their pure-C# `--backend cuda` has no PTX and
# falls back to CPU — use a `-cuda` archive (or build from source) for GPU.
# GB10 uses the pinned CUDA 13 Docker builder on native hosted ARM64, without
# a GPU. The artifacts target checks clean-runtime dependencies and startup,
# not model inference. No self-hosted Spark runner is scheduled here.
#
# Trigger: push a version tag like `v2.8.6` (the tag, with the leading `v`
# stripped, becomes the version and a published Release is created). Or run
# `workflow_dispatch` with a `version` input to produce a draft Release.
# Set `gb10_only` on a manual run to test GB10 artifacts without creating a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 2.8.6). Required when not run from a tag."
        required: false
        default: ""
      gb10_only:
        description: "Build and validate only GB10 artifacts; do not create a GitHub Release."
        required: false
        type: boolean
        default: false
      cuda_arch:
        description: "CMake CUDA architectures for ggml CUDA 12 builds (semicolon-separated; GB10 is pinned at SM121a)."
        required: false
        default: "75-real;86-real;89-real;90-real;90-virtual"
      draft:
        description: "Create the GitHub Release as a draft (manual runs only)."
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub Release as a pre-release."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release build — a half-uploaded release is worse
  # than a queue.
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.gb10_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64-cpu
            os: windows-latest
            rid: win-x64
            cuda: false
          - name: win-x64-cuda
            os: windows-latest
            rid: win-x64
            cuda: true
          - name: linux-x64-cpu
            os: ubuntu-latest
            rid: linux-x64
            cuda: false
          - name: linux-x64-cuda
            os: ubuntu-latest
            rid: linux-x64
            cuda: true
          - name: osx-arm64
            os: macos-26
            rid: osx-arm64
            cuda: false
    runs-on: ${{ matrix.os }}
    env:
      # Resolve upstream once per runner, then reuse that unchanged checkout.
      TENSORSHARP_GGML_NO_UPDATE: "1"
      # Pin the native macOS deployment floor, rather than the runner's OS.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    # The CUDA ggml build (multiple SASS targets + PTX) and the macOS MLX build
    # (builds mlx-c from source) are minutes-long; give them headroom.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # ggml is not a submodule; the native build scripts fetch it.
          submodules: false

      - name: Set up TensorAgent Developer ID signing and notarization
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          TENSORAGENT_MACOS_APPLICATION_P12_BASE64: ${{ secrets.TENSORAGENT_MACOS_APPLICATION_P12_BASE64 }}
          TENSORAGENT_MACOS_APPLICATION_P12_PASSWORD: ${{ secrets.TENSORAGENT_MACOS_APPLICATION_P12_PASSWORD }}
          TENSORAGENT_MACOS_INSTALLER_P12_BASE64: ${{ secrets.TENSORAGENT_MACOS_INSTALLER_P12_BASE64 }}
          TENSORAGENT_MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.TENSORAGENT_MACOS_INSTALLER_P12_PASSWORD }}
          TENSORAGENT_MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.TENSORAGENT_MACOS_PROVISION_PROFILE_BASE64 }}
          TENSORAGENT_MACOS_NOTARY_APPLE_ID: ${{ secrets.TENSORAGENT_MACOS_NOTARY_APPLE_ID }}
          TENSORAGENT_MACOS_NOTARY_APP_PASSWORD: ${{ secrets.TENSORAGENT_MACOS_NOTARY_APP_PASSWORD }}
          TENSORAGENT_MACOS_TEAM_ID: ${{ secrets.TENSORAGENT_MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # Public releases must never fall back to ad-hoc signing. Check secrets
          # before installing workloads or compiling native dependencies.
          for credential in TENSORAGENT_MACOS_APPLICATION_P12_BASE64 \
                            TENSORAGENT_MACOS_APPLICATION_P12_PASSWORD \
                            TENSORAGENT_MACOS_INSTALLER_P12_BASE64 \
                            TENSORAGENT_MACOS_INSTALLER_P12_PASSWORD \
                            TENSORAGENT_MACOS_PROVISION_PROFILE_BASE64 \
                            TENSORAGENT_MACOS_NOTARY_APPLE_ID \
                            TENSORAGENT_MACOS_NOTARY_APP_PASSWORD \
                            TENSORAGENT_MACOS_TEAM_ID; do
            if [ -z "${!credential}" ]; then
              echo "::error::Required macOS release secret is missing: $credential" >&2
              exit 1
            fi
          done
          umask 077
          signing_dir="$RUNNER_TEMP/tensoragent-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$signing_dir"
          keychain="$signing_dir/release.keychain-db"
          # Register cleanup paths before performing any import or network work.
          {
            echo "TENSORAGENT_SIGNING_DIR=$signing_dir"
            echo "TENSORAGENT_SIGNING_KEYCHAIN=$keychain"
            echo "TENSORAGENT_NOTARY_PROFILE=tensoragent-notary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
          export TENSORAGENT_SIGNING_DIR="$signing_dir"
          security list-keychains -d user > "$signing_dir/keychains.before"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          import re

          directory = Path(os.environ["TENSORAGENT_SIGNING_DIR"])
          for name, secret in (
              ("application.p12", "TENSORAGENT_MACOS_APPLICATION_P12_BASE64"),
              ("installer.p12", "TENSORAGENT_MACOS_INSTALLER_P12_BASE64"),
              ("provisioning.mobileprovision", "TENSORAGENT_MACOS_PROVISION_PROFILE_BASE64"),
          ):
              try:
                  data = base64.b64decode(re.sub(r"\s", "", os.environ[secret]), validate=True)
              except ValueError:
                  raise SystemExit(f"Invalid base64 in macOS release secret: {secret}")
              if not data:
                  raise SystemExit(f"Empty macOS release credential: {secret}")
              (directory / name).write_bytes(data)
          PY
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/application.p12" -k "$keychain" \
            -P "$TENSORAGENT_MACOS_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$signing_dir/installer.p12" -k "$keychain" \
            -P "$TENSORAGENT_MACOS_INSTALLER_P12_PASSWORD" -T /usr/bin/productbuild \
            -T /usr/bin/productsign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          python3 - "$keychain" <<'PY'
          import os
          from pathlib import Path
          import shlex
          import subprocess
          import sys

          original = shlex.split((Path(os.environ["TENSORAGENT_SIGNING_DIR"]) / "keychains.before").read_text())
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", sys.argv[1], *original], check=True)
          PY
          security find-identity -v -p codesigning "$keychain" > "$signing_dir/application-identities.txt"
          security find-identity -v -p basic "$keychain" > "$signing_dir/installer-identities.txt"
          security cms -D -i "$signing_dir/provisioning.mobileprovision" > "$signing_dir/profile.plist"
          python3 - <<'PY'
          from datetime import datetime, timezone
          import fnmatch
          import os
          from pathlib import Path
          import plistlib
          import re
          import subprocess

          directory = Path(os.environ["TENSORAGENT_SIGNING_DIR"])
          team = os.environ["TENSORAGENT_MACOS_TEAM_ID"]
          if not re.fullmatch(r"[A-Z0-9]{10}", team):
              raise SystemExit("TENSORAGENT_MACOS_TEAM_ID must be a ten-character Apple team ID")
          identities = {}
          for kind, filename in (("Application", "application-identities.txt"), ("Installer", "installer-identities.txt")):
              names = re.findall(r'^\s*\d+\)\s+[A-Fa-f0-9]{40}\s+"([^"]+)"',
                                 (directory / filename).read_text(), re.MULTILINE)
              matches = [name for name in names if name.startswith(f"Developer ID {kind}: ") and name.endswith(f"({team})")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one valid Developer ID {kind} identity for the configured team")
              identities[kind] = matches[0]
          profile = plistlib.loads((directory / "profile.plist").read_bytes())
          uuid = profile.get("UUID", "")
          if not re.fullmatch(r"[A-Fa-f0-9-]{36}", uuid):
              raise SystemExit("Developer ID provisioning profile has no valid UUID")
          if team not in profile.get("TeamIdentifier", []):
              raise SystemExit("Developer ID provisioning profile belongs to another team")
          expiry = profile.get("ExpirationDate")
          if not isinstance(expiry, datetime) or expiry.replace(tzinfo=timezone.utc) <= datetime.now(timezone.utc):
              raise SystemExit("Developer ID provisioning profile has expired")
          entitlements = profile.get("Entitlements", {})
          identifier = entitlements.get("application-identifier", entitlements.get("com.apple.application-identifier", ""))
          if not fnmatch.fnmatchcase(f"{team}.ai.tensorsharp.tensoragent", identifier):
              raise SystemExit("Developer ID provisioning profile does not authorize TensorAgent's bundle ID")
          if "OSX" not in profile.get("Platform", []) or profile.get("ProvisionedDevices") or entitlements.get("get-task-allow"):
              raise SystemExit("A Mac Catalyst Developer ID distribution provisioning profile is required")
          certificate = subprocess.check_output(["security", "find-certificate", "-c", identities["Application"], "-p",
                                                 str(directory / "release.keychain-db")])
          der = subprocess.check_output(["openssl", "x509", "-outform", "DER"], input=certificate)
          if der not in profile.get("DeveloperCertificates", []):
              raise SystemExit("Developer ID profile does not include the imported application certificate")
          # Xcode 16+ and older .NET SDKs search different profile directories.
          destinations = [Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles" / f"{uuid}.provisionprofile",
                          Path.home() / "Library/MobileDevice/Provisioning Profiles" / f"{uuid}.provisionprofile"]
          if any(path.exists() for path in destinations):
              raise SystemExit("Refusing to overwrite an existing provisioning profile on the runner")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"TENSORAGENT_APPLICATION_IDENTITY={identities['Application']}\n")
              output.write(f"TENSORAGENT_INSTALLER_IDENTITY={identities['Installer']}\n")
              output.write(f"TENSORAGENT_PROVISION_UUID={uuid}\n")
              output.write(f"TENSORAGENT_PROVISION_PATH={destinations[0]}\n")
              output.write(f"TENSORAGENT_LEGACY_PROVISION_PATH={destinations[1]}\n")
          data = (directory / "provisioning.mobileprovision").read_bytes()
          for path in destinations:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          PY
          xcrun notarytool store-credentials "tensoragent-notary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --keychain "$keychain" --apple-id "$TENSORAGENT_MACOS_NOTARY_APPLE_ID" \
            --team-id "$TENSORAGENT_MACOS_TEAM_ID" --password "$TENSORAGENT_MACOS_NOTARY_APP_PASSWORD"
          # Keep raw secrets and decoded profile data out of diagnostic artifacts.
          rm -f "$signing_dir/application.p12" "$signing_dir/installer.p12" \
            "$signing_dir/provisioning.mobileprovision" "$signing_dir/profile.plist"

      - uses: actions/setup-dotnet@v4
        with:
          # Pin the desktop SDK/workload/Xcode combination together.
          dotnet-version: "10.0.302"

      - name: Install CUDA toolkit
        if: ${{ matrix.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.6.3"
          # network installer; full toolkit so the ggml CUDA backend links
          # cuBLAS and the runtime libs are present to bundle.
          method: "network"
          # On Linux, install only cuda-toolkit-12-6: the default `cuda`
          # metapackage also pulls in the NVIDIA driver + DKMS packages, whose
          # kernel-module build fails on GitHub runners — and a build machine
          # doesn't need the driver. On Windows keep the full default install.
          sub-packages: ${{ runner.os == 'Linux' && '["toolkit"]' || '[]' }}

      - name: Set up MSVC environment (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          # Pin the v143 (VS2022) toolset. windows-latest now ships Visual
          # Studio 2026, whose default v145 (MSVC 14.5x) toolset is rejected by
          # CUDA 12.6 nvcc as a host compiler; 14.44 is the newest toolset CUDA
          # 12.6 accepts and is installed on the image alongside VS2026. This
          # also sets VCToolsInstallDir, which the TensorSharp.Backends.Cuda
          # PTX compile uses to point nvcc at the right cl.exe.
          toolset: "14.44"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python eng/resolve-release-version.py

      - name: Validate desktop packaging contracts
        shell: bash
        run: python -m unittest discover -s eng/tests -p 'test_tensoragent_*packaging.py'

      - name: Install desktop MAUI workload
        if: ${{ runner.os == 'Windows' || runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            dotnet workload install maui-windows --version 10.0.303.1
          else
            export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
            # Restore evaluates both Apple TFMs even for a Catalyst-only publish.
            dotnet workload install maui-maccatalyst maui-ios --version 10.0.303.1
            xcodebuild -version
          fi

      - name: Fetch unchanged upstream ggml
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File eng/fetch-ggml.ps1
          else
            bash eng/fetch-ggml.sh
          fi
          git -C ExternalProjects/ggml rev-parse HEAD
          test -z "$(git -C ExternalProjects/ggml status --porcelain)"

      - name: Publish apps
        shell: bash
        env:
          # Read by both MSBuild (TensorSharp.Backends.GGML.csproj) and the
          # native build scripts. The first `dotnet publish` triggers the native
          # GGML build (and, when nvcc is present, the CUDA PTX compile); the
          # second is incremental.
          TENSORSHARP_GGML_NATIVE_ENABLE_CUDA: ${{ matrix.cuda && 'ON' || 'OFF' }}
          TENSORSHARP_GGML_NATIVE_CUDA_ARCHITECTURES: ${{ matrix.cuda && (github.event.inputs.cuda_arch || '75-real;86-real;89-real;90-real;90-virtual') || '' }}
          # Keep the ggml-vulkan backend out of the release archives (the
          # Windows runners have vulkan-1.dll, so the build script would
          # otherwise auto-enable it): a Vulkan-linked GgmlOps.dll hard-imports
          # vulkan-1.dll, which machines without GPU drivers (bare servers/VMs)
          # don't have — the whole native library would then fail to load. The
          # archives are documented as CPU / CPU+CUDA builds.
          TENSORSHARP_GGML_NATIVE_ENABLE_VULKAN: "OFF"
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Build the GGML native library with Ninja + the vcvars environment
            # from the MSVC setup step. The VS2026-only image has no VS2022
            # instance for CMake's "Visual Studio 17 2022" generator, and a VS
            # generator CUDA build would additionally need CUDA's MSBuild
            # integration for VS2026, which CUDA 12.6 predates. Ninja drives
            # cl.exe/nvcc directly and needs neither.
            export CMAKE_GENERATOR=Ninja
          fi
          # "<archive dir>:<project>". The server's entry point lives in
          # TensorSharp.Server.Host (TensorSharp.Server itself is the library it
          # builds on and has no Main), but the archive keeps the `server` name
          # the download links and the docs already use.
          for entry in "server:TensorSharp.Server.Host" "cli:TensorSharp.Cli"; do
            lc="${entry%%:*}"
            proj="${entry#*:}"
            dotnet publish "$proj/$proj.csproj" \
              -c Release \
              -r "${{ matrix.rid }}" \
              --self-contained true \
              -p:Version="$V" \
              -o "publish/$lc"
          done

      - name: Publish TensorAgent Desktop
        if: ${{ runner.os == 'Windows' || runner.os == 'macOS' }}
        shell: bash
        env:
          V: ${{ steps.ver.outputs.version }}
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
          APP_BUILD: ${{ github.run_number }}
          TENSORSHARP_GGML_NATIVE_ENABLE_CUDA: ${{ matrix.cuda && 'ON' || 'OFF' }}
          TENSORSHARP_GGML_NATIVE_CUDA_ARCHITECTURES: ${{ matrix.cuda && (inputs.cuda_arch || '75-real;86-real;89-real;90-real;90-virtual') || '' }}
          TENSORSHARP_GGML_NATIVE_ENABLE_VULKAN: "OFF"
          TENSORSHARP_MLX_NATIVE_SKIP: "true"
        run: |
          set -euo pipefail
          project="TensorAgent/src/TensorAgent.Maui/TensorAgent.Maui.csproj"
          if [ "$RUNNER_OS" = Windows ]; then
            export CMAKE_GENERATOR=Ninja
            dotnet publish "$project" -c Release -f net10.0-windows10.0.19041.0 \
              -r win-x64 --self-contained true -m:1 -p:Version="$V" \
              -p:ApplicationDisplayVersion="$APP_VERSION" -p:ApplicationVersion="$APP_BUILD" \
              -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true \
              -p:PublishSingleFile=false -o publish/desktop
          else
            dotnet publish "$project" -c Release -f net10.0-maccatalyst \
              -r maccatalyst-arm64 --self-contained true -m:1 -p:Version="$V" \
              -p:ApplicationDisplayVersion="$APP_VERSION" -p:ApplicationVersion="$APP_BUILD" \
              -p:TensorSharpAppleTargets=true -p:CreatePackage=false -p:EnableCodeSigning=true \
              -p:CodesignKey="$TENSORAGENT_APPLICATION_IDENTITY" \
              -p:CodesignKeychain="$TENSORAGENT_SIGNING_KEYCHAIN" \
              -p:CodesignProvision="$TENSORAGENT_PROVISION_UUID" \
              -p:CodesignEntitlements=Platforms/MacCatalyst/Entitlements.plist \
              -p:UseHardenedRuntime=true
          fi

      - name: Stage GGML native library
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows)
              lib=""
              for c in TensorSharp.GGML.Native/build-windows/Release/GgmlOps.dll \
                       TensorSharp.GGML.Native/build-windows/GgmlOps.dll; do
                [ -f "$c" ] && lib="$c" && break
              done
              ;;
            Linux) lib="TensorSharp.GGML.Native/build/libGgmlOps.so" ;;
            macOS) lib="TensorSharp.GGML.Native/build/libGgmlOps.dylib" ;;
          esac
          if [ -z "${lib:-}" ] || [ ! -f "$lib" ]; then
            echo "::error::GGML native library not found (looked for the ${{ runner.os }} build output)." >&2
            exit 1
          fi
          echo "Bundling GGML native library: $lib"
          cp "$lib" publish/server/
          cp "$lib" publish/cli/
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$lib" publish/desktop/
          fi

      - name: Stage MLX native libraries
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          # mlx.metallib holds MLX's precompiled Metal kernels. It is large
          # (~150 MB) but not optional: mlx locates it via dladdr on its own
          # code, so it has to ship next to libmlx.dylib. Its only fallback is a
          # METAL_PATH baked in at compile time pointing into the CI build tree,
          # which does not exist on an end user's machine -- without it the MLX
          # backend loads and then throws "Failed to load the default metallib"
          # on first use.
          for f in libmlxc.dylib libmlx.dylib libjaccl.dylib mlx.metallib; do
            src="TensorSharp.Backends.MLX/Native/dist/$f"
            [ -f "$src" ] || src="TensorSharp.Backends.MLX/Native/dist/lib/$f"
            if [ -f "$src" ]; then
              cp "$src" publish/server/
              cp "$src" publish/cli/
            else
              echo "::warning::MLX library $f not found; skipping."
            fi
          done

      - name: Stage CUDA PTX kernels
        # The pure-C# `--backend cuda` loads PTX from a cuda_kernels/ subfolder
        # next to the app. nvcc (present only for CUDA builds) compiles it during
        # publish; copy it in explicitly so a propagation miss can't silently
        # downgrade the backend to its CPU fallback.
        if: ${{ matrix.cuda }}
        shell: bash
        run: |
          set -euo pipefail
          # nvcc writes the PTX to the intermediate directory (never into the
          # committed native/ptx baseline, which is the no-nvcc fallback and
          # targets one specific GPU arch; this build's PTX targets the portable
          # fallback arch so it JIT-compiles on any release GPU).
          ptxdir="TensorSharp.Backends.Cuda/obj/cuda_ptx/ptx"
          if [ ! -f "$ptxdir/tensorsharp_kernels.ptx" ]; then
            echo "::error::CUDA PTX kernel not found at $ptxdir/tensorsharp_kernels.ptx (was nvcc available during publish?)." >&2
            exit 1
          fi
          for app in server cli; do
            mkdir -p "publish/$app/cuda_kernels"
            cp "$ptxdir"/*.ptx "publish/$app/cuda_kernels/"
          done
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p publish/desktop/cuda_kernels
            cp "$ptxdir"/*.ptx publish/desktop/cuda_kernels/
          fi

      - name: Stage CUDA runtime (Linux)
        if: ${{ matrix.cuda && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          for f in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
            src="$CUDA_PATH/lib64/$f"
            if [ -f "$src" ]; then
              cp -L "$src" publish/server/
              cp -L "$src" publish/cli/
            else
              echo "::warning::CUDA runtime library $f not found at $src; archive will require a system CUDA install."
            fi
          done

      - name: Stage CUDA runtime (Windows)
        if: ${{ matrix.cuda && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($dll in @("cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll")) {
            $src = Join-Path $env:CUDA_PATH "bin\$dll"
            if (Test-Path $src) {
              Copy-Item $src publish/server/
              Copy-Item $src publish/cli/
              Copy-Item $src publish/desktop/
            } else {
              Write-Host "::warning::CUDA runtime library $dll not found at $src; archive will require a system CUDA install."
            }
          }

      - name: Stage Windows desktop Visual C++ runtime and licenses
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The MAUI Content items publish webui/ and skills/ directly into
          # publish/desktop, where the packager validates them. Do not copy from
          # bin/: MSVC's Platform=x64 environment changes it to bin/x64/.
          # vcvars may select a newer v14 redist alongside the pinned compiler.
          # Bundle a complete release CRT family; never mix folders.
          $crtRoot = Join-Path $env:VCToolsRedistDir "x64"
          $candidates = @(Get-ChildItem $crtRoot -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name -Descending)
          $preferred = @($candidates | Where-Object Name -eq "Microsoft.VC143.CRT")
          $crt = $null
          foreach ($candidate in @($preferred + $candidates)) {
            $complete = $true
            foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
              if (-not (Test-Path (Join-Path $candidate.FullName $dll))) { $complete = $false }
            }
            if (-not $complete) { continue }
            $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $candidate.FullName "vcruntime140.dll"))
            if ($info.FileMajorPart -eq 14 -and $info.FileMinorPart -ge 44) {
              $crt = $candidate.FullName
              Write-Host "Bundling Visual C++ runtime $($info.FileVersion) from $crt"
              break
            }
          }
          if (-not $crt) { throw "Complete Visual C++ v14 x64 redistributable >= 14.44 not found: $crtRoot" }
          Copy-Item "$crt/*.dll" publish/desktop/
          Copy-Item LICENSE publish/desktop/LICENSE.txt
          Copy-Item ExternalProjects/ggml/LICENSE publish/desktop/GGML-LICENSE.txt

      - name: Package TensorAgent Desktop (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Identities, notary profile and keychain come from the mandatory setup
          # step via GITHUB_ENV. The packager rejects unnotarized release output.
          : "${TENSORAGENT_APPLICATION_IDENTITY:?Developer ID setup did not complete}"
          : "${TENSORAGENT_INSTALLER_IDENTITY:?Developer ID setup did not complete}"
          : "${TENSORAGENT_NOTARY_PROFILE:?Notarization setup did not complete}"
          : "${TENSORAGENT_SIGNING_KEYCHAIN:?Developer ID setup did not complete}"
          bash eng/package-tensoragent-macos.sh \
            TensorAgent/src/TensorAgent.Maui/bin/Release/net10.0-maccatalyst/maccatalyst-arm64/TensorAgent.app \
            "$V" artifacts

      - name: Package TensorAgent Desktop (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.version }}
          VARIANT: ${{ matrix.name }}
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install wix --version 6.0.2 --tool-path artifacts/tools/wix
          if ($LASTEXITCODE -ne 0) { throw "WiX tool installation failed." }
          ./eng/package-tensoragent-windows.ps1 -PublishDirectory publish/desktop -Version $env:V -Variant $env:VARIANT -OutputDirectory artifacts -WixPath artifacts/tools/wix/wix.exe

      - name: Record desktop build coverage
        if: ${{ runner.os == 'Windows' || runner.os == 'macOS' }}
        shell: bash
        env:
          V: ${{ steps.ver.outputs.version }}
          VARIANT: ${{ matrix.name }}
        run: |
          set -euo pipefail
          test -z "$(git -C ExternalProjects/ggml status --porcelain)"
          {
            echo "TensorAgent Desktop $V ($VARIANT)"
            echo "TensorSharp revision: $GITHUB_SHA"
            echo "Unmodified upstream ggml: $(git -C ExternalProjects/ggml rev-parse HEAD)"
            echo "Coverage: packaging contract tests, publish, required payload checks, archive/checksum verification."
            if [ "$RUNNER_OS" = macOS ]; then
              echo "Verified Developer ID signatures and timestamps, hardened runtime/JIT entitlement, ARM64 architecture, macOS 14 deployment floor, DMG and PKG structure."
              echo "Apple notarization accepted; stapled tickets validated for app, DMG and PKG; Gatekeeper assessed app and release containers."
              echo "Signing: Developer ID Application (app/DMG), Developer ID Installer (PKG); notarized and stapled."
            else
              echo "Verified every ZIP/MSI payload hash after administrative extraction."
              echo "Signing: Windows unsigned."
            fi
            echo "Not covered: clean-machine installation, UI launch, model inference, GPU devices or benchmarks."
          } > "artifacts/tensoragent-desktop-$V-$VARIANT-BUILD.txt"

      - name: Archive (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          tar -C publish/server -czf "artifacts/tensorsharp-server-$V-${{ matrix.name }}.tar.gz" .
          tar -C publish/cli    -czf "artifacts/tensorsharp-cli-$V-${{ matrix.name }}.tar.gz" .

      - name: Archive (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.version }}
          SUFFIX: ${{ matrix.name }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/server/* -DestinationPath "artifacts/tensorsharp-server-$env:V-$env:SUFFIX.zip"
          Compress-Archive -Path publish/cli/*    -DestinationPath "artifacts/tensorsharp-cli-$env:V-$env:SUFFIX.zip"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            artifacts/tensorsharp-*
            artifacts/tensoragent-desktop-*
            artifacts/SHA256SUMS-tensoragent-desktop-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload macOS notarization diagnostics
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          # Deliberately does not match release-*; the publish job only downloads
          # release artifacts, so generated evidence is never a release asset.
          name: notarization-${{ matrix.name }}-${{ github.run_attempt }}
          path: artifacts/notarization/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary macOS signing credentials
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup_status=0
          if [ -n "${TENSORAGENT_PROVISION_PATH:-}" ]; then
            rm -f "$TENSORAGENT_PROVISION_PATH" || cleanup_status=1
          fi
          if [ -n "${TENSORAGENT_LEGACY_PROVISION_PATH:-}" ]; then
            rm -f "$TENSORAGENT_LEGACY_PROVISION_PATH" || cleanup_status=1
          fi
          if [ -n "${TENSORAGENT_SIGNING_DIR:-}" ]; then
            if [ -f "$TENSORAGENT_SIGNING_DIR/keychains.before" ]; then
              python3 - <<'PY' || cleanup_status=1
          import os
          from pathlib import Path
          import shlex
          import subprocess

          original = shlex.split((Path(os.environ["TENSORAGENT_SIGNING_DIR"]) / "keychains.before").read_text())
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", *original], check=True)
          PY
            fi
            if [ -f "${TENSORAGENT_SIGNING_KEYCHAIN:-}" ]; then
              security delete-keychain "$TENSORAGENT_SIGNING_KEYCHAIN" || cleanup_status=1
            fi
            rm -rf "$TENSORAGENT_SIGNING_DIR" || cleanup_status=1
          fi
          exit "$cleanup_status"

  build-gb10:
    name: Build linux-arm64-cuda13-GB10
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    # The native 4-CPU cold release measured ~11.5 minutes. Allow ample margin for
    # hosted variance, archive verification and upload.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Resolve GB10 release version
        id: ver
        shell: bash
        env:
          V: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$V" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Supply a valid release version or push a version tag." >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Check native ARM64 builder and resource budget
        shell: bash
        run: |
          set -euo pipefail
          uname -sm
          free -h
          docker version
          docker buildx version
          docker_platform="$(docker info --format '{{.OSType}}/{{.Architecture}}')"
          if [[ "$(uname -sm)" != "Linux aarch64" || ! "$docker_platform" =~ ^linux/(aarch64|arm64)$ ]]; then
            echo "::error::GB10 requires a native Linux ARM64 Docker daemon; x64/QEMU is unsupported." >&2
            exit 1
          fi
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          sudo df -h "$docker_root" "$GITHUB_WORKSPACE"
          docker system df
          docker_free="$(sudo df -B1 --output=avail "$docker_root" | tail -n 1)"
          export_free="$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1)"
          # Fresh docker-container release passed a hard 10 GiB build-store cap:
          # peak 8,970,973,184 bytes plus 1,313,840,034 bytes of external exports.
          # The 12 GiB combined budget also leaves room for BuildKit engine overhead.
          docker_required=$((10 * 1024 * 1024 * 1024))
          export_required=$((2 * 1024 * 1024 * 1024))
          if [[ "$(sudo stat -c %d "$docker_root")" == "$(stat -c %d "$GITHUB_WORKSPACE")" ]]; then
            docker_required=$((12 * 1024 * 1024 * 1024))
            export_required="$docker_required"
          fi
          if (( docker_free < docker_required || export_free < export_required )); then
            echo "::error::GB10 requires at least 10 GiB free Docker storage and 2 GiB free export space, or 12 GiB free when they share a filesystem. The measured fresh release passed a hard 10 GiB build-store cap with ~1.3 GB external exports; the combined budget includes BuildKit engine headroom. No host cleanup or runner fallback is performed." >&2
            exit 1
          fi

      - name: Set up isolated GB10 builder
        id: gb10-builder
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: memory=8g

      - name: Build and validate GB10 release archives (no GPU)
        timeout-minutes: 90
        shell: bash
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build --builder "${{ steps.gb10-builder.outputs.name }}" \
            --progress=plain --platform linux/arm64 \
            -f eng/Dockerfile.gb10 \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg RELEASE_VERSION="$V" \
            --build-arg GGML_BUILD_JOBS=2 \
            --target artifacts --output type=local,dest=artifacts/gb10 .

      - name: Verify and name GB10 release assets
        shell: bash
        working-directory: artifacts/gb10
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for app in cli server; do
            test -s "tensorsharp-$app-$V-linux-arm64-cuda13-GB10.tar.gz"
          done
          test -s GB10-VALIDATION.txt
          sha256sum --check --strict SHA256SUMS
          # download-artifact merges all release-* artifacts into one directory.
          mv SHA256SUMS "tensorsharp-$V-linux-arm64-cuda13-GB10-SHA256SUMS"
          mv GB10-VALIDATION.txt "tensorsharp-$V-linux-arm64-cuda13-GB10-VALIDATION.txt"

      - name: Upload GB10 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64-cuda13-GB10
          path: artifacts/gb10/*
          if-no-files-found: error
          # The tarballs are already compressed; avoid a second compression pass
          # and retain this large handoff only long enough to publish the release.
          compression-level: 0
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.gb10_only }}
    needs: [build, build-gb10]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        id: ver
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python eng/resolve-release-version.py

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify downloaded GB10 archives
        shell: bash
        working-directory: dist
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum --check --strict "tensorsharp-$V-linux-arm64-cuda13-GB10-SHA256SUMS"

      - name: Verify all TensorAgent Desktop release assets
        shell: bash
        working-directory: dist
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for variant in osx-arm64 win-x64-cpu win-x64-cuda; do
            stem="tensoragent-desktop-$V-$variant"
            test -s "$stem.zip"
            test -s "$stem-BUILD.txt"
            if [ "$variant" = osx-arm64 ]; then
              test -s "$stem.dmg"
              test -s "$stem.pkg"
            else
              test -s "$stem.msi"
            fi
            sha256sum --check --strict "SHA256SUMS-$stem.txt"
          done

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TensorSharp ${{ steps.ver.outputs.version }}
          # Tag pushes publish immediately; manual runs default to a draft.
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          generate_release_notes: true
          body: |
            ## TensorAgent Desktop
            Download `tensoragent-desktop-${{ steps.ver.outputs.version }}-osx-arm64.dmg` (Apple Silicon Mac, macOS 14+) or the `win-x64-cpu.msi` / `win-x64-cuda.msi` variant below (Windows x64). Mac PKG/ZIP and Windows ZIP alternatives are also included.

            [Download, installation, setup and first-chat guide](https://tensorsharp.ai/tensoragent.html) · [Guide at this release tag](https://github.com/${{ github.repository }}/blob/${{ steps.ver.outputs.tag }}/docs/tensoragent_desktop.md)

            Models are downloaded in the app. Windows requires WebView2; CUDA also requires an NVIDIA driver. Packages include .NET/native runtimes; Python/Node.js for skills are optional separate installs. TensorAgent macOS packages are Developer ID signed, Apple-notarized and stapled; Windows packages are unsigned. See the guide for installation and SHA-256 verification. BUILD files record dependency revision and actual validation coverage; clean-machine installation, UI launch, model inference and device benchmarks are not exercised by this packaging workflow.
          fail_on_unmatched_files: true
          files: dist/**/*
