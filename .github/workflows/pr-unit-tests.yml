name: PR Unit Tests

# New forks must enable Actions before these workflows can be dispatched.
# Deterministic correctness signal for every PR on stock GitHub-hosted x64
# and ARM64 runners: builds the test project (including the CPU-only native
# GGML library, which TensorSharp.Backends.GGML builds automatically) and runs
# the environment-independent test lane — no GPU, no model downloads, no
# secrets. Lane taxonomy: InferenceWeb.Tests/TestAssemblyConfig.cs and
# DEVELOPMENT.md "Test lanes". The engine-comparison benchmark workflow
# (test-matrix.yml) on the self-hosted CUDA runner is unaffected.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never auto-enable GPU backends based on tools in a hosted runner image.
  TENSORSHARP_GGML_NATIVE_ENABLE_CUDA: "OFF"
  TENSORSHARP_GGML_NATIVE_ENABLE_VULKAN: "OFF"
  TENSORSHARP_CUDNN: "OFF"
  TS_TEST_GGML_BACKEND: "cpu"
  DOTNET_NOLOGO: "true"

jobs:
  packages:
    name: Managed package verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test package verification guards
        shell: pwsh
        run: ./eng/tests/verify-packages-tests.ps1
      - name: Pack and verify the complete public package graph
        shell: pwsh
        run: ./eng/verify-packages.ps1 -PackageVersion 0.0.0-ci -SkipNativeBuild
      - name: Verify Microsoft.Extensions.AI HTTP example (mock only, no model)
        run: |
          dotnet restore examples/dotnet-local-chat --locked-mode --configfile examples/dotnet-local-chat/NuGet.Config
          dotnet build examples/dotnet-local-chat -c Release --no-restore
          python3 eng/tests/dotnet-local-chat.py
          python3 eng/tests/dotnet-local-chat-e2e.py --self-test
      - name: Verify TensorSharp native IChatClient contracts (managed only, no GPU/model)
        run: |
          dotnet build eng/tests/NativeChatCompletion -c Release -p:TensorSharpSkipGgmlNative=true -p:TensorSharpSkipMlxNative=true
          dotnet run --project eng/tests/NativeChatCompletion -c Release --no-build -- examples/tensorsharp-native-chat/bin/Release/net10.0/TensorSharp.NativeChat.dll

  unit-tests:
    name: CPU correctness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check GB10 container gates and source context (no GPU)
        run: |
          mkdir -p .gb10-container-check
          TMPDIR="$PWD/.gb10-container-check" python3 eng/tests/gb10-container.py
          rmdir .gb10-container-check

      - name: Check the CUDA redist installer (local fixtures, no download)
        run: python3 -m unittest eng/tests/test_install_cuda_redist.py

      - name: Check build-linux.sh CUDA build-tree reuse (fake toolchain, no download)
        run: python3 -m unittest eng/tests/test_build_linux_cuda_tree.py

      # The DeepSeek V4.1 GGUF metadata, truncation, per-stage oracle and trace-sink tools on synthetic
      # inputs (no model, no GPU). They need numpy and gguf-py; the one test that needs torch skips.
      - name: Check the DeepSeek V4.1 GGUF, truncation and per-stage oracle tools (synthetic inputs, no GPU)
        run: |
          python3 -m venv "$RUNNER_TEMP/dsv41-py"
          "$RUNNER_TEMP/dsv41-py/bin/python" -m pip install --quiet numpy==1.26.4 gguf==0.17.1
          "$RUNNER_TEMP/dsv41-py/bin/python" -m unittest eng/tests/test_dsv41_gguf.py eng/tests/test_dsv41_truncate.py \
            eng/tests/test_dsv41_stage_oracle.py eng/tests/test_dsv41_trace_sink.py

      - name: Run environment-independent tests
        run: >
          dotnet test InferenceWeb.Tests/InferenceWeb.Tests.csproj
          --filter "Category!=Bench&Requires!=Cuda&Requires!=Mlx&Requires!=Models"
