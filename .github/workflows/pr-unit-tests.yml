name: PR Unit Tests

# New forks must enable Actions before these workflows can be dispatched.
# Deterministic correctness signal for every PR on stock GitHub-hosted x64
# and ARM64 runners: builds the test project (including the CPU-only native
# GGML library, which TensorSharp.Backends.GGML builds automatically) and runs
# the environment-independent test lane — no GPU, no model downloads, no
# secrets. Lane taxonomy: InferenceWeb.Tests/TestAssemblyConfig.cs and
# DEVELOPMENT.md "Test lanes". The engine-comparison benchmark workflow
# (test-matrix.yml) on the self-hosted CUDA runner is unaffected.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never auto-enable GPU backends based on tools in a hosted runner image.
  TENSORSHARP_GGML_NATIVE_ENABLE_CUDA: "OFF"
  TENSORSHARP_GGML_NATIVE_ENABLE_VULKAN: "OFF"
  TENSORSHARP_CUDNN: "OFF"
  TS_TEST_GGML_BACKEND: "cpu"
  DOTNET_NOLOGO: "true"

jobs:
  unit-tests:
    name: CPU correctness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check GB10 container gates and source context (no GPU)
        run: |
          mkdir -p .gb10-container-check
          TMPDIR="$PWD/.gb10-container-check" python3 eng/tests/gb10-container.py
          rmdir .gb10-container-check

      - name: Run environment-independent tests
        run: >
          dotnet test InferenceWeb.Tests/InferenceWeb.Tests.csproj
          --filter "Category!=Bench&Requires!=Cuda&Requires!=Mlx&Requires!=Models"

      - name: Run unified memory state and real-file pressure tests
        run: >
          dotnet run --project eng/tests/unified-memory/UnifiedMemory.Tests.csproj
          -c Release -- --json artifacts/unified-memory/results.json
