name: PR Unit Tests

# New forks must enable Actions before these workflows can be dispatched.
# Deterministic correctness signal for every PR on stock GitHub-hosted x64
# and ARM64 runners: builds the test project (including the CPU-only native
# GGML library, which TensorSharp.Backends.GGML builds automatically) and runs
# the environment-independent test lane — no GPU, no model downloads, no
# secrets. The x64 job pins the AVX2 baseline so its result does not depend
# on which runner CPU GitHub assigns (see the unit-tests job). Lane taxonomy:
# InferenceWeb.Tests/TestAssemblyConfig.cs and DEVELOPMENT.md "Test lanes". The engine-comparison benchmark workflow
# (test-matrix.yml) on the self-hosted CUDA runner is unaffected.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never auto-enable GPU backends based on tools in a hosted runner image.
  TENSORSHARP_GGML_NATIVE_ENABLE_CUDA: "OFF"
  TENSORSHARP_GGML_NATIVE_ENABLE_VULKAN: "OFF"
  TENSORSHARP_CUDNN: "OFF"
  TS_TEST_GGML_BACKEND: "cpu"
  DOTNET_NOLOGO: "true"

jobs:
  packages:
    name: Managed package verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test package verification guards
        shell: pwsh
        run: ./eng/tests/verify-packages-tests.ps1
      - name: Pack and verify the complete public package graph
        shell: pwsh
        run: ./eng/verify-packages.ps1 -PackageVersion 0.0.0-ci -SkipNativeBuild
      - name: Verify Microsoft.Extensions.AI HTTP example (mock only, no model)
        run: |
          dotnet restore examples/dotnet-local-chat --locked-mode --configfile examples/dotnet-local-chat/NuGet.Config
          dotnet build examples/dotnet-local-chat -c Release --no-restore
          python3 eng/tests/dotnet-local-chat.py
          python3 eng/tests/dotnet-local-chat-e2e.py --self-test
      - name: Verify TensorSharp native IChatClient contracts (managed only, no GPU/model)
        run: |
          dotnet build eng/tests/NativeChatCompletion -c Release -p:TensorSharpSkipGgmlNative=true -p:TensorSharpSkipMlxNative=true
          dotnet run --project eng/tests/NativeChatCompletion -c Release --no-build -- examples/tensorsharp-native-chat/bin/Release/net10.0/TensorSharp.NativeChat.dll

  moe-probe-contracts:
    name: MoE probe contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the fixed-history probe without native builds or models
        # Force the supported committed-PTX fallback even if a hosted image
        # happens to include nvcc. This job only checks managed contracts.
        run: >
          dotnet build eng/ResetLogitProbe/ResetLogitProbe.csproj -c Release
          -p:TensorSharpSkipGgmlNative=true -p:TensorSharpSkipMlxNative=true
          -p:TensorSharpSkipCpuNative=true -p:CudaNvcc=nvcc-disabled-for-moe-probe-contracts
      - name: Verify strict full-logit evidence guards with synthetic files
        run: dotnet run --project eng/ResetLogitProbe/tests/ResetLogitProbe.Validation.Tests.csproj -c Release
      - name: Verify owned Windows process cleanup with fault injection
        if: runner.os == 'Windows'
        run: python -m unittest discover -s eng/ResetLogitProbe/tests -p test_local_moe_chat_cleanup.py -v

  unit-tests:
    name: CPU correctness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # The environment-independent test step runs the suite serially (its test time adds up to its
    # wall time): about 13 minutes on an M5 Pro, and 2-2.5x that on these runners, so 30 minutes
    # cancelled main's runs from 636fdb9f on. 60 leaves room for the suite to grow.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A step's row count picks the CPU kernels that round it, and which kernels a host has depends on its ISA
      # (DEVELOPMENT.md, "Rounding by row count"). GitHub hands this job x64 runners with and without AVX-512, so a test
      # held to what one of them gave passed or failed by the runner drawn. Every x64 run takes the AVX2 path instead:
      # the managed kernels and the JIT without AVX-512, ggml configured for upstream's x86-64-v3 baseline
      # (-DGGML_NATIVE=OFF; no ggml source changes), which later builds reuse from the CMake cache. Reproduce locally
      # with eng/cpu-lane-isa.sh --ggml-baseline avx2.
      - name: Pin x64 runs to the AVX2 baseline (managed kernels, JIT, ggml)
        if: runner.arch == 'X64'
        run: |
          echo "TS_CPU_DISABLE_AVX512=1" >> "$GITHUB_ENV"
          echo "DOTNET_EnableAVX512=0" >> "$GITHUB_ENV"
          bash TensorSharp.GGML.Native/build-linux.sh -DGGML_NATIVE=OFF
          grep -E '^GGML_(NATIVE|AVX2|AVX512):' TensorSharp.GGML.Native/build/CMakeCache.txt

      - name: Record the runner's CPU
        run: |
          grep -m1 -E '^(model name|CPU part)' /proc/cpuinfo || true
          echo "cores: $(nproc); flags: $(grep -o -w -E 'avx512f|avx2|fma|asimd|asimddp|i8mm|sve' /proc/cpuinfo | sort -u | tr '\n' ' ')"

      - name: Check GB10 container gates and source context (no GPU)
        run: |
          mkdir -p .gb10-container-check
          TMPDIR="$PWD/.gb10-container-check" python3 eng/tests/gb10-container.py
          rmdir .gb10-container-check

      - name: Check the CUDA redist installer (local fixtures, no download)
        run: python3 -m unittest eng/tests/test_install_cuda_redist.py

      - name: Check build-linux.sh CUDA build-tree reuse (fake toolchain, no download)
        run: python3 -m unittest eng/tests/test_build_linux_cuda_tree.py

      # The DeepSeek V4.1 GGUF metadata, truncation, per-stage oracle and trace-sink tools on synthetic
      # inputs (no model, no GPU). They need numpy and gguf-py; the one test that needs torch skips.
      - name: Check the DeepSeek V4.1 GGUF, truncation and per-stage oracle tools (synthetic inputs, no GPU)
        run: |
          python3 -m venv "$RUNNER_TEMP/dsv41-py"
          "$RUNNER_TEMP/dsv41-py/bin/python" -m pip install --quiet numpy==1.26.4 gguf==0.17.1
          "$RUNNER_TEMP/dsv41-py/bin/python" -m unittest eng/tests/test_dsv41_gguf.py eng/tests/test_dsv41_truncate.py \
            eng/tests/test_dsv41_stage_oracle.py eng/tests/test_dsv41_trace_sink.py

      - name: Run environment-independent tests
        run: >
          dotnet test InferenceWeb.Tests/InferenceWeb.Tests.csproj
          --filter "Category!=Bench&Requires!=Cuda&Requires!=Mlx&Requires!=Models"

      # Reuse the CPU-only build made by the managed test project above. Build
      # only these standalone regressions; no GPU backend or model is loaded.
      - name: Build focused MoE routing and graph-plan regressions
        run: |
          cmake -S TensorSharp.GGML.Native -B TensorSharp.GGML.Native/build \
            -DCMAKE_BUILD_TYPE=Release -DTENSORSHARP_GGML_NATIVE_BUILD_TESTS=ON \
            -DTENSORSHARP_GGML_NATIVE_ENABLE_CUDA=OFF \
            -DTENSORSHARP_GGML_NATIVE_ENABLE_VULKAN=OFF \
            -DTENSORSHARP_GGML_NATIVE_ENABLE_METAL=OFF
          cmake --build TensorSharp.GGML.Native/build --config Release --parallel 2 \
            --target GgmlOpsOrderedMoeRoutingTest GgmlOpsGraphAllocCurrentPlanTest
      - name: Run focused native CPU regressions
        run: >
          ctest --test-dir TensorSharp.GGML.Native/build -C Release
          -R '^(ordered-moe-routing-cpu|current-graph-plan-cpu)$'
          --output-on-failure --no-tests=error
