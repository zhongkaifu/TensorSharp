<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TensorSharp Chat</title>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #252525;
  --border: #333;
  --text: #e8e8e8;
  --text2: #999;
  --accent: #6c8cff;
  --accent-hover: #8da6ff;
  --user-bg: #1e2a42;
  --assist-bg: #1a1a1a;
  --danger: #e55;
  --success: #5b5;
  --radius: 12px;
  --layout-gutter: clamp(12px, 2vw, 20px);
  --chat-shell-max-width: min(1180px, calc(100vw - 32px));
  --user-avatar-size: 40px;
  --assistant-avatar-size: 72px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

header h1 {
  font-size: 18px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Colorful animated "TensorSharp" wordmark, used in place of the old banner image. */
.big-wordmark {
  font-weight: 800;
  letter-spacing: -0.02em;
  white-space: nowrap;
  background: linear-gradient(100deg, #6c8cff 0%, #b06cff 28%, #ff6cab 52%, #ff8c6c 74%, #ffd76c 100%);
  background-size: 220% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  animation: brandShimmer 7s linear infinite;
}

@keyframes brandShimmer {
  to { background-position: 220% center; }
}

@media (prefers-reduced-motion: reduce) {
  .big-wordmark,
  .brand-site-link { animation: none; }
}

/* Wordmark links to tensorsharp.ai without disturbing the gradient text. */
a.brand-home {
  text-decoration: none;
  display: inline-flex;
}

.brand-site-link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
  padding: 9px 20px;
  border-radius: 999px;
  color: #fff;
  text-decoration: none;
  white-space: nowrap;
  background: linear-gradient(100deg, #6c8cff 0%, #b06cff 45%, #ff6cab 100%);
  background-size: 200% auto;
  box-shadow: 0 4px 16px rgba(108, 140, 255, 0.38);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  animation: brandShimmer 7s linear infinite;
}

.brand-site-link:hover {
  transform: translateY(-1px) scale(1.04);
  box-shadow: 0 6px 24px rgba(176, 108, 255, 0.55);
  color: #fff;
}

.brand-site-link .link-arrow {
  font-size: 13px;
  opacity: 0.9;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: flex-end;
  margin-left: auto;
}

.status-badge {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--surface2);
  color: var(--text2);
}

.status-badge.loaded {
  background: #1a3a1a;
  color: var(--success);
}

#queue-badge.queue-active {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

#queue-badge.queue-active.processing-only {
  background: #1a3a1a;
  color: var(--success);
}

#queue-badge.queue-active.has-waiting {
  background: #3a2a1a;
  color: #fa5;
}

.queue-badge-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
  animation: pulseDot 1.2s ease-in-out infinite;
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(0.7); }
}

button {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
}

button:hover { background: #333; border-color: #444; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

button.primary:hover { background: var(--accent-hover); }

.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

#model-panel {
  padding: 16px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: none;
}

#model-panel.visible { display: block; }

.model-panel-inner {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

#model-panel select, #model-panel input {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
}

#model-panel select { min-width: 280px; }

#chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px var(--layout-gutter);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.message {
  display: flex;
  gap: 12px;
  max-width: var(--chat-shell-max-width);
  width: 100%;
  margin: 0 auto;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user { flex-direction: row-reverse; }

.avatar {
  width: var(--user-avatar-size);
  height: var(--user-avatar-size);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 2px;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

.message.user .avatar {
  background: var(--accent);
  color: #fff;
  font-weight: 600;
}

.message.assistant .avatar {
  width: var(--assistant-avatar-size);
  height: var(--assistant-avatar-size);
  margin-top: 0;
  padding: 6px;
  border-radius: 20px;
  background: radial-gradient(circle at top, #2a3353 0%, #151515 72%);
  border: 1px solid rgba(140, 166, 255, 0.22);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
}

.message.assistant .avatar img {
  object-position: center;
  transform-origin: center;
  transform: scale(1);
  filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.34)) contrast(1.08) saturate(1.06);
}

.message.assistant .bubble {
  max-width: calc(100% - var(--assistant-avatar-size) - 18px);
}

.bubble {
  padding: 12px 16px;
  border-radius: var(--radius);
  line-height: 1.6;
  font-size: 14px;
  max-width: 85%;
  white-space: pre-wrap;
  word-break: break-word;
}

.message.user .bubble {
  background: var(--user-bg);
  border: 1px solid #2a3a5a;
}

.message.assistant .bubble {
  background: var(--assist-bg);
  border: 1px solid var(--border);
}

.bubble .media-preview {
  margin-bottom: 8px;
}

.bubble .media-preview img,
.bubble .media-preview video {
  max-width: 300px;
  max-height: 200px;
  border-radius: 8px;
  display: block;
}

.bubble .media-preview .audio-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  color: var(--text2);
}

.queue-indicator {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: #1e2a42;
  border: 1px solid #2a3a5a;
  border-radius: 8px;
  font-size: 13px;
  color: var(--accent);
  margin-bottom: 8px;
  animation: fadeIn 0.3s ease;
}

.queue-indicator .queue-spinner {
  width: 14px;
  height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.typing-indicator {
  display: inline-flex;
  gap: 4px;
  padding: 4px 0;
}

.typing-indicator span {
  width: 6px;
  height: 6px;
  background: var(--text2);
  border-radius: 50%;
  animation: blink 1.2s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 60%, 100% { opacity: 0.3; }
  30% { opacity: 1; }
}

.model-label {
  font-size: 10px;
  color: var(--accent);
  opacity: 0.7;
  margin-bottom: 4px;
}

.stats {
  font-size: 11px;
  color: var(--text2);
  margin-top: 6px;
}

#input-area {
  padding: 16px var(--layout-gutter);
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.input-row {
  display: flex;
  gap: 10px;
  max-width: var(--chat-shell-max-width);
  margin: 0 auto;
  align-items: flex-end;
}

.input-wrapper {
  flex: 1;
  position: relative;
}

#message-input {
  width: 100%;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 12px 16px;
  padding-right: 100px;
  border-radius: var(--radius);
  font-size: 14px;
  font-family: inherit;
  resize: none;
  min-height: 48px;
  max-height: 200px;
  line-height: 1.5;
  outline: none;
  transition: border-color 0.15s;
}

#message-input:focus { border-color: var(--accent); }

#message-input::placeholder { color: var(--text2); }

.input-actions {
  position: absolute;
  right: 8px;
  bottom: 8px;
  display: flex;
  gap: 4px;
}

.input-actions button {
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 16px;
  border: none;
  background: transparent;
  color: var(--text2);
}

.input-actions button:hover {
  background: var(--surface);
  color: var(--text);
}

.input-actions button.send-btn {
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  padding: 6px 14px;
}

.input-actions button.send-btn:hover { background: var(--accent-hover); }

.input-actions button.stop-btn {
  background: var(--danger);
  color: #fff;
  font-size: 14px;
  padding: 6px 14px;
  animation: pulseStop 1.5s ease-in-out infinite;
}

.input-actions button.stop-btn:hover { background: #f66; }

@keyframes pulseStop {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

#file-input { display: none; }

.model-switcher {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: var(--chat-shell-max-width);
  margin: 0 auto 6px auto;
  font-size: 12px;
  color: var(--text2);
  flex-wrap: wrap;
}

.model-readout {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.model-readout-label {
  white-space: nowrap;
}

.model-value {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface2);
  font-size: 12px;
  color: var(--text);
  max-width: min(420px, 100%);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.model-value.empty {
  color: var(--text2);
}

.settings-hint {
  margin-top: 10px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
}

.reasoning-toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: 8px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  user-select: none;
}

.reasoning-toggle input[type="checkbox"] { display: none; }

.reasoning-toggle .toggle-track {
  width: 32px;
  height: 18px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 9px;
  position: relative;
  transition: background 0.2s, border-color 0.2s;
}

.reasoning-toggle .toggle-track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  background: var(--text2);
  border-radius: 50%;
  transition: transform 0.2s, background 0.2s;
}

.reasoning-toggle input:checked + .toggle-track {
  background: #1e3a5a;
  border-color: var(--accent);
}

.reasoning-toggle input:checked + .toggle-track::after {
  transform: translateX(14px);
  background: var(--accent);
}

.thinking-block {
  background: #1a1a2a;
  border: 1px solid #2a2a4a;
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
}

.thinking-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
}

.thinking-header:hover { background: #222238; }

.thinking-header .arrow {
  font-size: 10px;
  transition: transform 0.2s;
}

.thinking-header .arrow.expanded { transform: rotate(90deg); }

.thinking-content {
  padding: 8px 12px 10px;
  font-size: 13px;
  color: #aaa;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  border-top: 1px solid #2a2a4a;
  display: none;
}

.thinking-content.visible { display: block; }

.attachments {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  max-width: var(--chat-shell-max-width);
  margin-left: auto;
  margin-right: auto;
  flex-wrap: wrap;
}

.attachment-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  color: var(--text2);
}

.attachment-chip img {
  width: 32px;
  height: 32px;
  border-radius: 4px;
  object-fit: cover;
}

.attachment-chip .remove {
  cursor: pointer;
  color: var(--danger);
  font-size: 14px;
  margin-left: 2px;
}

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text2);
  gap: 16px;
  text-align: center;
  padding: 40px;
}

.empty-state .big-wordmark {
  font-size: clamp(40px, 9vw, 76px);
  line-height: 1.05;
  padding: 0 8px;
  filter: drop-shadow(0 14px 28px rgba(108, 140, 255, 0.22));
}

.empty-state .big-wordmark.assistant-preview {
  font-size: clamp(34px, 7vw, 60px);
}

.empty-state p { font-size: 14px; max-width: 400px; line-height: 1.6; }

@media (max-width: 720px) {
  header {
    padding: 10px 14px;
  }

  header h1 {
    font-size: 16px;
    gap: 10px;
  }

  .brand-site-link {
    font-size: 14px;
    padding: 6px 14px;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
  }

  .message.assistant .avatar {
    width: 58px;
    height: 58px;
    border-radius: 18px;
    padding: 5px;
  }

  .message.assistant .bubble {
    max-width: calc(100% - 58px - 14px);
  }

  .empty-state {
    padding: 28px 20px;
  }

  .empty-state .big-wordmark {
    font-size: clamp(34px, 12vw, 56px);
  }
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  align-items: center;
  justify-content: center;
}

.modal-overlay.visible { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  min-width: 400px;
  max-width: 500px;
}

.modal h2 {
  font-size: 16px;
  margin-bottom: 16px;
}

.modal .field {
  margin-bottom: 12px;
}

.modal label {
  display: block;
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 4px;
}

.modal select, .modal input[type="text"] {
  width: 100%;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
}

.modal .actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.msg-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.15s;
}

.message:hover .msg-actions { opacity: 1; }

.msg-actions button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text2);
  padding: 2px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.msg-actions button:hover {
  background: var(--surface2);
  color: var(--text);
  border-color: #444;
}

.msg-actions button.danger:hover {
  color: var(--danger);
  border-color: var(--danger);
}

.edit-textarea {
  width: 100%;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--accent);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  min-height: 60px;
  max-height: 300px;
  line-height: 1.5;
  outline: none;
}

.edit-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 8px;
}

/* ---- Agent Skills -------------------------------------------------------
   The pill reuses .model-value; the manager reuses .modal-overlay/.modal and
   only widens them, and the selected-skill chips reuse .attachment-chip. */

.skills-pill {
  cursor: pointer;
  font-family: inherit;
  gap: 6px;
}

.skills-pill:hover { background: #333; border-color: #444; }

/* An empty chip strip must not reserve its margin above the composer. */
#skill-chips:empty { display: none; }

.modal.skills-modal {
  min-width: min(640px, 92vw);
  max-width: min(640px, 92vw);
  width: 640px;
  max-height: 84vh;
  display: flex;
  flex-direction: column;
}

.skills-hint {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
}

.skills-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.skills-toolbar label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  user-select: none;
}

.skills-toolbar input[type="checkbox"] {
  accent-color: var(--accent);
  cursor: pointer;
}

.skills-notice {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
  margin: 10px 0;
  word-break: break-word;
}

.skills-errors {
  border: 1px solid var(--border);
  background: var(--surface2);
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
  max-height: 130px;
  overflow-y: auto;
}

.skills-error-title {
  color: var(--danger);
  margin-bottom: 4px;
}

.skills-error-row { word-break: break-word; }

.skills-list {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface2);
  /* Owns the gap to whatever precedes it, since the toolbar, the notice and the
     error block are each hidden when they have nothing to say. */
  margin-top: 12px;
  max-height: 46vh;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.skill-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}

.skill-row:last-child { border-bottom: none; }
.skill-row:hover { background: #333; }

.skill-row input[type="checkbox"] {
  margin-top: 3px;
  accent-color: var(--accent);
  flex-shrink: 0;
  cursor: pointer;
}

.skill-row-body { flex: 1; min-width: 0; }

.skill-name {
  display: block;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  word-break: break-word;
}

.skill-origin {
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 1px 7px;
  margin-left: 6px;
  font-size: 10px;
  color: var(--text2);
  white-space: nowrap;
}

/* Descriptions are free text from SKILL.md, so clamp them and keep the full
   text in the row's title attribute. */
.skill-desc {
  margin-top: 3px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}

.skill-meta {
  margin-top: 4px;
  font-size: 11px;
  color: var(--text2);
}

.skill-warning {
  margin-top: 3px;
  font-size: 11px;
  color: var(--text2);
  word-break: break-word;
}

.skill-delete {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text2);
  padding: 2px 9px;
  border-radius: 6px;
  font-size: 12px;
}

.skill-delete:hover {
  background: transparent;
  color: var(--danger);
  border-color: var(--danger);
}

/* One transient activity panel for the operation that is running now. It is
   removed at completion; completed tool/skill details belong in server logs. */
.current-activity {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
}

.current-activity-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  color: var(--text2);
  font-size: 12px;
}

.current-activity-spinner {
  width: 12px;
  height: 12px;
  flex: 0 0 auto;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* A bounded tail of only the current code draft, edit, file operation, or
   process output. The node and its buffers disappear when that operation ends. */
.current-activity-detail {
  margin: 0 8px 7px;
  padding: 5px 8px;
  max-height: 5.6em;
  overflow-y: auto;
  border-left: 2px solid var(--accent);
  background: var(--surface2);
  border-radius: 4px;
  color: var(--text2);
  font-size: 0.78em;
  white-space: pre-wrap;
  word-break: break-word;
}

/* Files a shell command produced: visible download chips on the reply itself,
   so getting the file never depends on the model repeating the link in prose. */
.artifact-files {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.artifact-files a {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface2);
  color: var(--accent);
  font-size: 0.85em;
  text-decoration: none;
  word-break: break-all;
}
.artifact-files a:hover { border-color: var(--accent); }
.artifact-files .artifact-size { color: var(--text2); }

/* A download link the model wrote into its answer, made clickable at render. */
.bubble-text a.artifact-link { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>
    <a class="brand-site-link" href="https://tensorsharp.ai" target="_blank" rel="noopener" title="Visit TensorSharp.ai">&#x1F310; TensorSharp.ai <span class="link-arrow">&#x2197;</span></a>
  </h1>
  <div class="header-controls">
    <span id="queue-badge" class="status-badge" style="display:none" title="Live inference load: requests processing concurrently and waiting in the queue"></span>
    <span id="status-badge" class="status-badge">No model configured</span>
    <button id="btn-clear" title="New chat">&#x2795; New Chat</button>
  </div>
</header>

<div class="main-area">
  <div id="chat-container">
    <div class="empty-state" id="empty-state">
      <a class="brand-home" href="https://tensorsharp.ai" target="_blank" rel="noopener" title="Visit tensorsharp.ai"><div class="big-wordmark" aria-label="TensorSharp">TensorSharp</div></a>
      <p>Start TensorSharp.Server with <code>--model &lt;path.gguf&gt; --backend &lt;type&gt; [--mmproj &lt;path&gt;] [--max-tokens 20000]</code>, then refresh this page.</p>
    </div>
  </div>

  <div id="input-area">
    <div class="attachments" id="attachments"></div>
    <div class="attachments" id="skill-chips"></div>
    <div class="model-switcher" id="model-switcher">
      <label class="reasoning-toggle" title="Enable reasoning / chain-of-thought output">
        <input type="checkbox" id="reasoning-toggle" checked>
        <span class="toggle-track"></span>
        <span>Reasoning</span>
      </label>
      <button type="button" class="model-value skills-pill" id="skills-pill" style="display:none" onclick="openSkillsModal()" title="Agent Skills the model can use">&#x1F9E9; Skills</button>
    </div>
    <div class="input-row">
      <div class="input-wrapper">
        <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
        <div class="input-actions">
          <button onclick="document.getElementById('file-input').click()" title="Attach file">&#x1F4CE;</button>
          <button class="send-btn" id="btn-send" onclick="sendMessage()">&#x27A4;</button>
        </div>
      </div>
    </div>
    <input type="file" id="file-input" multiple accept="image/*,video/*,audio/*,.pdf,.heic,.heif,.txt,.csv,.json,.xml,.md,.log,.py,.js,.ts,.cs,.java,.cpp,.c,.h,.html,.css,.yaml,.yml,.toml,.ini,.cfg,.sh,.bat,.ps1,.rb,.go,.rs,.swift,.kt,.sql,.r,.m,.tex,.rtf" onchange="handleFileSelect(event)">
  </div>
</div>

<input type="file" id="skill-zip-input" accept=".zip" style="display:none" onchange="handleSkillZipSelect(event)">

<div class="modal-overlay" id="skills-modal" onclick="onSkillsOverlayClick(event)">
  <div class="modal skills-modal">
    <h2>&#x1F9E9; Agent Skills</h2>
    <div class="skills-hint">Selected skills are described to the model up front; it then reads their bundled files on demand.</div>
    <div class="skills-toolbar" id="skills-toolbar" style="display:none">
      <button type="button" onclick="document.getElementById('skill-zip-input').click()">&#x2B06; Install .zip</button>
      <label title="Replace a skill of the same name if it is already installed"><input type="checkbox" id="skill-overwrite"> <span class="skills-hint">Overwrite existing</span></label>
    </div>
    <div class="skills-notice" id="skills-notice" style="display:none"></div>
    <div class="skills-errors" id="skills-errors" style="display:none"></div>
    <div class="skills-list" id="skills-list"></div>
    <div class="actions">
      <button type="button" onclick="closeSkillsModal()">Cancel</button>
      <button type="button" class="primary" onclick="applySkillsModal()">Apply</button>
    </div>
  </div>
</div>

<script>
const chatContainer = document.getElementById('chat-container');
const messageInput = document.getElementById('message-input');
const statusBadge = document.getElementById('status-badge');
const attachmentsDiv = document.getElementById('attachments');
const autoScrollThreshold = 32;

let chatHistory = [];
let pendingAttachments = [];
let isGenerating = false;
let currentAbortController = null;
let currentLoadedModel = null;
let currentArchitecture = null;
// What the loaded model does with attached pictures, straight from /api/models.
// Null for a non-video model. The same three images are three REFERENCES on
// MiniMax-H3 Ref2VA and a refused request on FL2VA, so this decides the shape of a
// video request rather than merely labelling it.
let currentVideoCaps = null;
// Architectures whose /api/models 'architecture' id means "this model generates video".
// The id comes from GGUF metadata, so it is matched rather than renamed.
const VIDEO_ARCHITECTURES = new Set(['wan', 'wan2.1', 'wan2.2', 'minimax-h3']);
// Agent Skills capability block from /api/models, or null on a server that has no
// skills support at all. Every read is guarded, so an older server degrades to
// "no Skills control" rather than to a broken page.
let currentSkillsCaps = null;
// Skill names sent with the next chat request.
let selectedSkills = [];
// Last /api/skills payload. The modal's inline handlers address rows by index into
// skillsRoster, so no attacker-controlled name is ever spliced into an attribute.
let skillsRoster = [];
let skillsErrors = [];
let skillsInstallable = false;
// Draft selection while the manager is open: Apply commits it, Cancel drops it.
let pendingSkillSelection = null;
let needsCacheReset = false;
let shouldAutoScroll = true;
let serverDefaultMaxTokens = 20000;
// Each chat has a dedicated session on the server. The session owns its KV cache;
// starting a new chat disposes the server-side session so its KV state is freed.
const DEFAULT_SESSION_ID = '__default__';
let currentSessionId = null;
const editOriginalHtml = new Map();

function isChatNearBottom() {
  return chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight <= autoScrollThreshold;
}

function updateAutoScrollState() {
  shouldAutoScroll = isChatNearBottom();
}

function scrollChatToBottom(force = false) {
  if (force || shouldAutoScroll) {
    chatContainer.scrollTop = chatContainer.scrollHeight;
    shouldAutoScroll = true;
  }
}

chatContainer.addEventListener('scroll', updateAutoScrollState);

messageInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

messageInput.addEventListener('input', () => {
  messageInput.style.height = 'auto';
  messageInput.style.height = Math.min(messageInput.scrollHeight, 200) + 'px';
});

document.getElementById('btn-clear').onclick = clearChat;

function renderEmptyState() {
  if (chatHistory.length > 0) {
    return;
  }

  if (!currentLoadedModel) {
    chatContainer.innerHTML = `
      <div class="empty-state" id="empty-state">
        <a class="brand-home" href="https://tensorsharp.ai" target="_blank" rel="noopener" title="Visit tensorsharp.ai"><div class="big-wordmark" aria-label="TensorSharp">TensorSharp</div></a>
        <p>Start TensorSharp.Server with <code>--model &lt;path.gguf&gt; --backend &lt;type&gt; [--mmproj &lt;path&gt;] [--max-tokens 20000]</code>, then refresh this page.</p>
      </div>`;
    return;
  }

  chatContainer.innerHTML = `
    <div class="empty-state">
      <a class="brand-home" href="https://tensorsharp.ai" target="_blank" rel="noopener" title="Visit tensorsharp.ai"><div class="big-wordmark assistant-preview" aria-label="TensorSharp">TensorSharp</div></a>
      <p>Start a conversation with the configured model. You can attach images, videos, audio, and text files for multimodal inference.</p>
    </div>`;
}

function legacyStatusBadge(data) {
  currentLoadedModel = data.loaded || null;
  currentArchitecture = data.architecture || null;
  currentVideoCaps = data.video || null;

  if (!currentLoadedModel) {
    statusBadge.textContent = 'No model configured';
    statusBadge.classList.remove('loaded');
    return;
  }

  let statusText = currentLoadedModel + ' (' + (data.architecture || '?') + ')';
  if (data.loadedBackend) {
    statusText += ' · ' + data.loadedBackend;
  }
  if (data.loadedMmProj) {
    statusText += ' + ' + data.loadedMmProj;
  }

  statusBadge.textContent = statusText;
  statusBadge.classList.add('loaded');
}

function updateStatusBadge(data) {
  currentLoadedModel = data.loaded || null;
  currentArchitecture = data.architecture || null;
  currentVideoCaps = data.video || null;

  if (!currentLoadedModel) {
    statusBadge.textContent = 'No model configured';
    statusBadge.classList.remove('loaded');
    return;
  }

  let statusText = currentLoadedModel + ' (' + (data.architecture || '?') + ')';
  if (data.loadedBackend) {
    statusText += ' | ' + data.loadedBackend;
  }
  if (data.loadedMmProj) {
    statusText += ' + ' + data.loadedMmProj;
  }

  statusBadge.textContent = statusText;
  statusBadge.classList.add('loaded');
}

async function fetchServerState() {
  try {
    const res = await fetch('/api/models');
    const data = await res.json();
    serverDefaultMaxTokens = data.defaultMaxTokens || 20000;
    updateStatusBadge(data);
    // Nullable on purpose: a server without the feature omits the block entirely.
    currentSkillsCaps = (data && typeof data.skills === 'object' && data.skills) ? data.skills : null;
    updateSkillsControl();
    renderEmptyState();
    await createSession();
    return data;
  } catch (e) {
    console.error('Failed to fetch server state:', e);
    return null;
  }
}

window.addEventListener('beforeunload', () => {
  if (currentSessionId && currentSessionId !== DEFAULT_SESSION_ID) {
    const id = currentSessionId;
    currentSessionId = null;
    try {
      fetch('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE', keepalive: true });
    } catch {}
  }
});

async function createSession() {
  try {
    const res = await fetch('/api/sessions', { method: 'POST' });
    const data = await res.json();
    if (data && data.sessionId) {
      currentSessionId = data.sessionId;
    }
  } catch (e) {
    console.error('Failed to create chat session:', e);
    currentSessionId = null;
  }
}

async function disposeCurrentSession() {
  if (!currentSessionId) return;
  const id = currentSessionId;
  currentSessionId = null;
  if (id === DEFAULT_SESSION_ID) return;
  try {
    await fetch('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE' });
  } catch (e) {
    console.warn('Failed to dispose chat session:', e);
  }
}

async function clearChat() {
  chatHistory = [];
  pendingAttachments = [];
  attachmentsDiv.innerHTML = '';
  chatContainer.innerHTML = '';
  needsCacheReset = false;
  shouldAutoScroll = true;
  await disposeCurrentSession();
  await createSession();
  renderEmptyState();
}

async function handleFileSelect(event) {
  const files = Array.from(event.target.files);
  if (files.length === 0) return;
  event.target.value = '';
  // Upload sequentially so pendingAttachments keeps the user's selection order
  // (the order defines "Picture 1", "Picture 2", ... for multi-image edits).
  for (const file of files) {
    await uploadOneFile(file);
  }
}

async function uploadOneFile(file) {
  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.ok) {
      pendingAttachments.push(data);
      renderAttachments();
      if (data.warning) {
        alert(data.warning);
      } else if (data.renderedAsImages && data.frameUrls) {
        // A complete scanned / image-only PDF was recovered as page images.
        // The attachment chip keeps the page count visible.
      }
    } else {
      alert('Upload failed: ' + data.error);
    }
  } catch (e) {
    alert('Upload error: ' + e.message);
  }
}

function renderAttachments() {
  attachmentsDiv.innerHTML = '';
  let imageNum = 0;
  const totalImages = pendingAttachments.filter(a => a.mediaType === 'image').length;
  pendingAttachments.forEach((att, idx) => {
    const chip = document.createElement('div');
    chip.className = 'attachment-chip';
    let icon = '&#x1F4C4;';
    let label = att.fileName;
    if (att.mediaType === 'image') {
      icon = '&#x1F5BC;';
      // With several images attached, show the "Picture N" order the edit prompt can reference.
      imageNum++;
      if (totalImages > 1) label = `${imageNum}⃣ ${att.fileName}`;
    }
    else if (att.mediaType === 'video') icon = '&#x1F3AC;';
    else if (att.mediaType === 'audio') icon = '&#x1F3B5;';
    else if (att.mediaType === 'text') icon = '&#x1F4DD;';
    else if (att.mediaType === 'pdf') {
      icon = '&#x1F4C4;';
      if (att.renderedAsImages && Number.isInteger(att.extractedPageCount) && Number.isInteger(att.pageCount)) {
        label = `${att.fileName} (${att.extractedPageCount}/${att.pageCount} pages)`;
      }
    }
    chip.innerHTML = `${icon} ${label} <span class="remove" onclick="removeAttachment(${idx})">&times;</span>`;
    attachmentsDiv.appendChild(chip);
  });
}

function removeAttachment(idx) {
  pendingAttachments.splice(idx, 1);
  renderAttachments();
}

// ---- Agent Skills --------------------------------------------------------
// Every string below (skill name, description, file path, warning, load error)
// comes from SKILL.md frontmatter or from a filename inside an uploaded ZIP, so
// it is attacker-controlled: these renderers build nodes and assign textContent
// instead of interpolating into innerHTML.

function skillNameOf(sk) {
  if (!sk) return '';
  if (typeof sk.name === 'string' && sk.name) return sk.name;
  if (typeof sk.id === 'string' && sk.id) return sk.id;
  return '';
}

function formatSkillBytes(n) {
  if (typeof n !== 'number' || !isFinite(n) || n < 0) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

// Both error shapes the server can produce: {"error":"..."} outside /v1, and
// {"error":{"message":"..."}} under it.
function skillsRequestError(res, data) {
  if (data && typeof data.error === 'string' && data.error) return data.error;
  if (data && data.error && typeof data.error.message === 'string' && data.error.message) return data.error.message;
  return 'HTTP ' + (res ? res.status : '?');
}

function updateSkillsControl() {
  const pill = document.getElementById('skills-pill');
  if (!pill) return;
  const enabled = !!(currentSkillsCaps && currentSkillsCaps.enabled);
  if (!enabled) {
    pill.style.display = 'none';
    if (selectedSkills.length > 0) {
      // The server no longer offers skills, so a stale selection would keep
      // changing the system prompt for a feature that is gone.
      selectedSkills = [];
      needsCacheReset = true;
      renderSkillChips();
    }
    return;
  }
  pill.style.display = '';
  pill.textContent = selectedSkills.length > 0
    ? '\u{1F9E9} Skills: ' + selectedSkills.length
    : '\u{1F9E9} Skills';
  const count = typeof currentSkillsCaps.count === 'number' ? currentSkillsCaps.count : null;
  pill.title = count === null
    ? 'Agent Skills the model can use'
    : count + (count === 1 ? ' skill' : ' skills') + ' available to the model';
}

function renderSkillChips() {
  const host = document.getElementById('skill-chips');
  if (!host) return;
  host.innerHTML = '';
  selectedSkills.forEach((name, idx) => {
    const chip = document.createElement('div');
    chip.className = 'attachment-chip';
    const label = document.createElement('span');
    label.textContent = '\u{1F9E9} ' + name;
    chip.appendChild(label);
    const remove = document.createElement('span');
    remove.className = 'remove';
    remove.textContent = '×';
    remove.title = 'Remove this skill';
    remove.setAttribute('onclick', 'removeSelectedSkill(' + idx + ')');
    chip.appendChild(remove);
    host.appendChild(chip);
  });
}

function setSelectedSkills(names) {
  const unique = [];
  (Array.isArray(names) ? names : []).forEach(n => {
    const name = String(n == null ? '' : n);
    if (name && unique.indexOf(name) === -1) unique.push(name);
  });
  const changed = unique.length !== selectedSkills.length
    || unique.some((n, i) => n !== selectedSkills[i]);
  selectedSkills = unique;
  if (changed) {
    // The selection is rendered into the leading system message, so changing it
    // changes the prompt prefix: the same invalidation class as an edit or a
    // revert. Without this the server would silently reuse a mismatched KV cache.
    needsCacheReset = true;
  }
  renderSkillChips();
  updateSkillsControl();
}

function removeSelectedSkill(idx) {
  const next = selectedSkills.slice();
  next.splice(idx, 1);
  setSelectedSkills(next);
}

function openSkillsModal() {
  pendingSkillSelection = selectedSkills.slice();
  const overlay = document.getElementById('skills-modal');
  if (overlay) overlay.classList.add('visible');
  setSkillsNotice('');
  loadSkillsRoster();
}

function closeSkillsModal() {
  const overlay = document.getElementById('skills-modal');
  if (overlay) overlay.classList.remove('visible');
  pendingSkillSelection = null;
}

function onSkillsOverlayClick(event) {
  // Backdrop only: a click inside the dialog bubbles up here too.
  if (event && event.target && event.target.id === 'skills-modal') closeSkillsModal();
}

function applySkillsModal() {
  setSelectedSkills(Array.isArray(pendingSkillSelection) ? pendingSkillSelection : selectedSkills);
  closeSkillsModal();
}

function setSkillsNotice(text) {
  const el = document.getElementById('skills-notice');
  if (!el) return;
  el.textContent = text || '';
  el.style.display = text ? '' : 'none';
}

function toggleSkillSelection(idx, checked) {
  const name = skillNameOf(skillsRoster[idx]);
  if (!name) return;
  if (!Array.isArray(pendingSkillSelection)) pendingSkillSelection = selectedSkills.slice();
  const at = pendingSkillSelection.indexOf(name);
  if (checked && at === -1) pendingSkillSelection.push(name);
  else if (!checked && at !== -1) pendingSkillSelection.splice(at, 1);
}

function setSkillsListMessage(text) {
  const listEl = document.getElementById('skills-list');
  if (!listEl) return;
  listEl.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'skill-row';
  const body = document.createElement('div');
  body.className = 'skill-row-body';
  const msg = document.createElement('div');
  msg.className = 'skill-desc';
  msg.textContent = text;
  body.appendChild(msg);
  row.appendChild(body);
  listEl.appendChild(row);
}

async function loadSkillsRoster() {
  setSkillsListMessage('Loading skills…');
  try {
    const res = await fetch('/api/skills');
    let data = null;
    try { data = await res.json(); } catch {}
    if (!res.ok) {
      skillsRoster = [];
      skillsErrors = [];
      skillsInstallable = false;
      setSkillsNotice('Could not load skills: ' + skillsRequestError(res, data));
    } else {
      skillsRoster = (data && Array.isArray(data.skills)) ? data.skills : [];
      skillsErrors = (data && Array.isArray(data.errors)) ? data.errors : [];
      skillsInstallable = !!(data && data.installable);
      if (data && data.enabled === false) setSkillsNotice('Skills are disabled on this server.');
    }
  } catch (e) {
    skillsRoster = [];
    skillsErrors = [];
    skillsInstallable = false;
    setSkillsNotice('Could not load skills: ' + (e && e.message ? e.message : e));
  }
  renderSkillsModal();
}

function renderSkillsModal() {
  const toolbar = document.getElementById('skills-toolbar');
  if (toolbar) toolbar.style.display = skillsInstallable ? '' : 'none';
  renderSkillsErrors();

  const listEl = document.getElementById('skills-list');
  if (!listEl) return;
  if (skillsRoster.length === 0) {
    setSkillsListMessage(skillsInstallable
      ? 'No skills found. Install a .zip package to add one.'
      : 'No skills found. Start the server with --skills-dir <path>.');
    return;
  }

  const selected = Array.isArray(pendingSkillSelection) ? pendingSkillSelection : selectedSkills;
  listEl.innerHTML = '';
  skillsRoster.forEach((sk, idx) => listEl.appendChild(buildSkillRow(sk, idx, selected)));
}

function buildSkillRow(sk, idx, selected) {
  const name = skillNameOf(sk);
  const row = document.createElement('div');
  row.className = 'skill-row';

  const checkId = 'skill-check-' + idx;
  const check = document.createElement('input');
  check.type = 'checkbox';
  check.id = checkId;
  check.checked = !!name && selected.indexOf(name) !== -1;
  check.disabled = !name;
  check.setAttribute('onchange', 'toggleSkillSelection(' + idx + ', this.checked)');
  row.appendChild(check);

  const body = document.createElement('div');
  body.className = 'skill-row-body';

  const label = document.createElement('label');
  label.className = 'skill-name';
  label.htmlFor = checkId;
  label.textContent = name || '(unnamed skill)';
  const origin = typeof (sk && sk.origin) === 'string' ? sk.origin : '';
  if (origin) {
    const badge = document.createElement('span');
    badge.className = 'skill-origin';
    badge.textContent = origin;
    label.appendChild(badge);
  }
  body.appendChild(label);

  const description = (sk && typeof sk.description === 'string') ? sk.description : '';
  if (description) {
    const desc = document.createElement('div');
    desc.className = 'skill-desc';
    desc.textContent = description;
    desc.title = description;   // clamped to two lines, so keep the full text here
    body.appendChild(desc);
  }

  const metaParts = [];
  const fileCount = (sk && Array.isArray(sk.files)) ? sk.files.length : 0;
  metaParts.push(fileCount + (fileCount === 1 ? ' file' : ' files'));
  const size = formatSkillBytes(sk && sk.bytes);
  if (size) metaParts.push(size);
  if (sk && typeof sk.compatibility === 'string' && sk.compatibility) metaParts.push(sk.compatibility);
  if (sk && typeof sk.license === 'string' && sk.license) metaParts.push(sk.license);
  const meta = document.createElement('div');
  meta.className = 'skill-meta';
  meta.textContent = metaParts.join(' · ');
  body.appendChild(meta);

  const warnings = (sk && Array.isArray(sk.warnings)) ? sk.warnings : [];
  warnings.forEach(w => {
    const warn = document.createElement('div');
    warn.className = 'skill-warning';
    warn.textContent = '⚠ ' + String(w == null ? '' : w);
    body.appendChild(warn);
  });

  row.appendChild(body);

  if (origin === 'installed' && name) {
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'skill-delete';
    del.textContent = '×';
    del.title = 'Delete this installed skill';
    del.setAttribute('onclick', 'deleteSkill(' + idx + ')');
    row.appendChild(del);
  }

  return row;
}

function renderSkillsErrors() {
  const box = document.getElementById('skills-errors');
  if (!box) return;
  box.innerHTML = '';
  if (skillsErrors.length === 0) {
    box.style.display = 'none';
    return;
  }
  const title = document.createElement('div');
  title.className = 'skills-error-title';
  title.textContent = skillsErrors.length + (skillsErrors.length === 1
    ? ' skill failed to load'
    : ' skills failed to load');
  box.appendChild(title);
  skillsErrors.forEach(err => {
    const line = document.createElement('div');
    line.className = 'skills-error-row';
    const path = String((err && err.path) || '');
    const message = String((err && err.message) || '');
    line.textContent = path ? path + ': ' + message : message;
    box.appendChild(line);
  });
  box.style.display = '';
}

function handleSkillZipSelect(event) {
  const input = event && event.target;
  if (!input) return;
  const files = Array.from(input.files || []);
  input.value = '';
  if (files.length > 0) uploadSkillZip(files[0]);
}

async function uploadSkillZip(file) {
  setSkillsNotice('Installing ' + file.name + '…');
  const formData = new FormData();
  formData.append('file', file);
  const overwrite = document.getElementById('skill-overwrite');
  if (overwrite && overwrite.checked) formData.append('overwrite', 'true');

  try {
    const res = await fetch('/api/skills', { method: 'POST', body: formData });
    let data = null;
    try { data = await res.json(); } catch {}
    if (!res.ok) setSkillsNotice('Install failed: ' + skillsRequestError(res, data));
    else setSkillsNotice('Installed ' + (skillNameOf(data) || file.name) + '.');
  } catch (e) {
    setSkillsNotice('Install failed: ' + (e && e.message ? e.message : e));
  }
  await loadSkillsRoster();
}

async function deleteSkill(idx) {
  const name = skillNameOf(skillsRoster[idx]);
  if (!name) return;
  if (!confirm('Delete the installed skill "' + name + '"? Its files are removed from the server.')) return;

  try {
    const res = await fetch('/api/skills/' + encodeURIComponent(name), { method: 'DELETE' });
    let data = null;
    try { data = await res.json(); } catch {}
    if (!res.ok) {
      setSkillsNotice('Delete failed: ' + skillsRequestError(res, data));
    } else {
      setSkillsNotice('Deleted ' + name + '.');
      if (Array.isArray(pendingSkillSelection)) {
        pendingSkillSelection = pendingSkillSelection.filter(n => n !== name);
      }
      if (selectedSkills.indexOf(name) !== -1) {
        setSelectedSkills(selectedSkills.filter(n => n !== name));
      }
    }
  } catch (e) {
    setSkillsNotice('Delete failed: ' + (e && e.message ? e.message : e));
  }
  await loadSkillsRoster();
}

// The WebUX intentionally has no completed-operation transcript. It owns one
// replace-in-place panel for the operation running now, then removes the panel
// on `finished`, `done`, cancellation, failure, or a closed stream. Debugging
// remains a server-log concern.
function ensureCurrentActivity(assistDiv) {
  let block = assistDiv.querySelector('.current-activity');
  if (block) return block;

  const bubbleText = assistDiv.querySelector('.bubble-text');
  const bubble = assistDiv.querySelector('.bubble');
  if (!bubbleText && !bubble) return null;

  block = document.createElement('div');
  block.className = 'current-activity';

  const header = document.createElement('div');
  header.className = 'current-activity-header';
  const spinner = document.createElement('span');
  spinner.className = 'current-activity-spinner';
  const status = document.createElement('span');
  status.className = 'current-activity-status';
  header.appendChild(spinner);
  header.appendChild(status);

  const detail = document.createElement('pre');
  detail.className = 'current-activity-detail';
  block.appendChild(header);
  block.appendChild(detail);

  // Before the reply text, i.e. after any reasoning block already sitting there.
  if (bubbleText && bubbleText.parentNode) bubbleText.parentNode.insertBefore(block, bubbleText);
  else bubble.appendChild(block);
  return block;
}

function clearCurrentActivity(assistDiv) {
  const block = assistDiv && assistDiv.querySelector('.current-activity');
  if (block) block.remove();
}

function activityLabel(tool, phase) {
  const writing = phase === 'writing';
  switch (tool) {
    case 'shell':       return writing ? 'Generating code…' : 'Running code…';
    case 'apply_patch': return writing ? 'Generating patch…' : 'Applying patch…';
    case 'read_file':   return writing ? 'Preparing file read…' : 'Reading file…';
    case 'edit_file':   return writing ? 'Preparing file edit…' : 'Editing file…';
    case 'write_file':  return writing ? 'Generating file…' : 'Writing file…';
    case 'skills_list': return writing ? 'Preparing skill lookup…' : 'Checking skills…';
    case 'skills_read': return writing ? 'Preparing skill read…' : 'Reading skill file…';
    case 'skills_run':  return writing ? 'Preparing skill run…' : 'Running skill…';
    default: {
      const name = tool ? String(tool).replace(/_/g, ' ') : 'operation';
      return (writing ? 'Preparing ' : 'Running ') + name + '…';
    }
  }
}

// Make a tool-call draft readable: Gemma frames string arguments with <|"|>,
// and a JSON-shaped body (Qwen) carries the program with escaped newlines.
// Display-only cleanup — nothing here is ever parsed or sent back.
function cleanToolDraft(raw) {
  let text = raw.replace(/<\|"\|>/g, '"');
  if (text.trimStart().startsWith('{'))
    text = text.replace(/\\n/g, '\n').replace(/\\t/g, '\t').replace(/\\"/g, '"');
  return text;
}

// Live progress while the model writes a tool call and while the host runs it.
// Only a bounded tail for the CURRENT phase is retained. Moving from generation
// to execution replaces the draft with current runtime output; finishing removes
// all activity UI instead of turning it into a historical trace.
function updateToolProgress(assistDiv, data) {
  const phase = String(data.tool_progress || '');
  if (phase === 'finished') {
    clearCurrentActivity(assistDiv);
    return;
  }
  if (phase !== 'writing' && phase !== 'running') return;

  const block = ensureCurrentActivity(assistDiv);
  if (!block) return;
  const status = block.querySelector('.current-activity-status');
  const detail = block.querySelector('.current-activity-detail');
  const incomingTool = data.tool ? String(data.tool) : '';
  const tool = incomingTool || block._tool || '';
  const changedTool = !!(incomingTool && block._tool && incomingTool !== block._tool);
  const changedPhase = block._phase !== phase;

  if (changedTool || changedPhase) {
    block._rawDraft = '';
    block._runOutput = '';
    detail.textContent = '';
  }
  block._phase = phase;
  block._tool = tool;

  if (phase === 'writing') {
    // This short-lived buffer exists only to turn escaped JSON/code deltas into
    // a readable tail. Bound it, and discard it at the next phase transition.
    block._rawDraft = ((block._rawDraft || '') + (data.text ? String(data.text) : '')).slice(-8000);
    const cleaned = cleanToolDraft(block._rawDraft);

    // Follow the last few lines being generated, like a small tail -f.
    let tail = cleaned.slice(-400);
    const firstBreak = tail.indexOf('\n');
    if (firstBreak > 0 && firstBreak < tail.length - 1) tail = tail.slice(firstBreak + 1);
    detail.textContent = tail;
    detail.style.display = tail ? '' : 'none';
    detail.scrollTop = detail.scrollHeight;
    if (status) {
      const size = formatArtifactBytes(block._rawDraft.length);
      status.textContent = activityLabel(tool, phase) + (size ? ' ' + size : '');
    }
  } else {
    const secs = Math.round(Number(data.seconds) || 0);
    const what = data.detail ? String(data.detail) : (tool || 'operation');
    if (status) status.textContent = activityLabel(tool, phase) + (secs > 0 ? ' ' + secs + 's' : '');

    // Show only the current operation's short stdout/stderr tail. Long-lived
    // diagnostic history is intentionally not kept in the browser.
    if (data.text) {
      block._runOutput = ((block._runOutput || '') + String(data.text)).slice(-4000);
    }
    const outTail = (block._runOutput || '').split('\n').slice(-6).join('\n').trimEnd();
    detail.textContent = '⏵ ' + what
      + (outTail ? '\n' + outTail : '');
    detail.style.display = '';
    detail.scrollTop = detail.scrollHeight;
  }
}

// Only this server's own artifact routes become hrefs; anything else in a frame
// or in model prose stays inert text.
const ARTIFACT_URL_PREFIX = '/api/code/artifacts/';

function formatArtifactBytes(bytes) {
  if (typeof bytes !== 'number' || !isFinite(bytes) || bytes < 0) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// Download chips for the files a shell command produced. Deliberately fed by the
// skill_step SSE frame, not by the model's answer: the file must be reachable
// even when the model forgets (or garbles) the link.
function appendArtifactFiles(assistDiv, files) {
  const bubble = assistDiv.querySelector('.bubble');
  if (!bubble) return;
  let box = assistDiv.querySelector('.artifact-files');
  if (!box) {
    box = document.createElement('div');
    box.className = 'artifact-files';
    bubble.appendChild(box);
  }
  files.forEach(f => {
    const url = String((f && f.url) || '');
    if (!url.startsWith(ARTIFACT_URL_PREFIX)) return;
    if (box.querySelector(`a[href="${CSS.escape(url)}"]`)) return;   // one chip per file
    const a = document.createElement('a');
    a.href = url;
    a.setAttribute('download', '');
    a.textContent = '⭳ ' + String((f && f.name) || url.split('/').pop());
    const size = formatArtifactBytes(f && f.bytes);
    if (size) {
      const span = document.createElement('span');
      span.className = 'artifact-size';
      span.textContent = size;
      a.appendChild(span);
    }
    box.appendChild(a);
  });
}

// Turn the artifact links the model wrote into its answer into real anchors.
// Handles the markdown form "[name](/api/code/artifacts/...)" and a bare or
// backticked URL. Built with DOM nodes, never innerHTML: everything except the
// vetted href stays plain text.
function renderArtifactLinks(el, text) {
  const pattern = /\[([^\]\n]{1,200})\]\((\/api\/code\/artifacts\/[^\s)]+)\)|`?(\/api\/code\/artifacts\/[^\s`")\]]+)`?/g;
  let last = 0, match, found = false;
  const nodes = [];
  while ((match = pattern.exec(text)) !== null) {
    let url = match[2] || match[3];
    let consumed = match[0].length;
    if (match[3]) {
      // A bare URL at the end of a sentence drags its punctuation along; the
      // markdown form has explicit delimiters and needs no trimming.
      const trimmed = url.replace(/[.,;:!?]+$/, '');
      consumed -= (url.length - trimmed.length);
      url = trimmed;
    }
    if (!url || !url.startsWith(ARTIFACT_URL_PREFIX)) continue;
    found = true;
    if (match.index > last) nodes.push(document.createTextNode(text.slice(last, match.index)));
    const a = document.createElement('a');
    a.className = 'artifact-link';
    a.href = url;
    a.setAttribute('download', '');
    a.textContent = match[1] || url.split('/').pop();
    nodes.push(a);
    last = match.index + consumed;
  }
  if (!found) { el.textContent = text; return; }
  if (last < text.length) nodes.push(document.createTextNode(text.slice(last)));
  el.replaceChildren(...nodes);
}

async function sendMessage() {
  if (isGenerating) return;
  const text = messageInput.value.trim();
  if (!text && pendingAttachments.length === 0) return;
  if (!currentLoadedModel) {
    alert('No model is configured. Restart TensorSharp.Server with --model <path.gguf> --backend <type>.');
    return;
  }

  const userContent = text || describeAttachments();
  const msg = { role: 'user', content: userContent };

  const imagePaths = [];
  const stillImagePaths = [];
  const videoFilePaths = [];
  const audioPaths = [];
  const textFilePaths = [];
  const textFileNames = [];
  let isVideo = false;
  const textParts = [];
  const attachmentsCopy = [...pendingAttachments];

  attachmentsCopy.forEach(att => {
    if (att.mediaType === 'image') {
      imagePaths.push(att.file);
      stillImagePaths.push(att.file);
    } else if (att.mediaType === 'video') {
      isVideo = true;
      if (att.file) videoFilePaths.push(att.file);
      if (att.frames) att.frames.forEach(f => imagePaths.push(f));
    } else if (att.mediaType === 'audio') {
      audioPaths.push(att.file);
    } else if (att.mediaType === 'text' && att.textContent) {
      textParts.push(`[File: ${att.fileName}]\n${att.textContent}\n[End of file]`);
      // The display name rides along with the stored name (same order) so
      // the shell tool can stage the file under the name the model sees here.
      if (att.file) { textFilePaths.push(att.file); textFileNames.push(att.fileName || att.file); }
    } else if (att.mediaType === 'pdf') {
      if (att.textContent) {
        // Born-digital PDF: inline the extracted text.
        textParts.push(`[File: ${att.fileName}]\n${att.textContent}\n[End of file]`);
        if (att.file) { textFilePaths.push(att.file); textFileNames.push(att.fileName || att.file); }
      } else if (att.frames && att.frames.length) {
        // Scanned / image-only PDF: send its page images to the vision model.
        // Keep the original PDF file as document provenance too, so the server
        // never silently trims pages if the expanded vision prompt is too large.
        if (att.file) { textFilePaths.push(att.file); textFileNames.push(att.fileName || att.file); }
        att.frames.forEach(f => imagePaths.push(f));
      }
    }
  });

  if (textParts.length > 0) {
    const fileContext = textParts.join('\n\n');
    msg.content = fileContext + '\n\n' + msg.content;
  }

  if (imagePaths.length > 0) msg.imagePaths = imagePaths;
  if (stillImagePaths.length > 0) msg.stillImagePaths = stillImagePaths;
  if (videoFilePaths.length > 0) msg.videoFilePaths = videoFilePaths;
  if (audioPaths.length > 0) msg.audioPaths = audioPaths;
  if (textFilePaths.length > 0) msg.textFilePaths = textFilePaths;
  if (textFileNames.length > 0) msg.textFileNames = textFileNames;
  if (isVideo) msg.isVideo = true;

  chatHistory.push(msg);
  addUserBubble(userContent, attachmentsCopy, chatHistory.length - 1);
  messageInput.value = '';
  messageInput.style.height = 'auto';
  pendingAttachments = [];
  attachmentsDiv.innerHTML = '';

  const empt = chatContainer.querySelector('.empty-state');
  if (empt) empt.remove();

  await requestAssistantResponse();
}

async function runImageEdit(userMsg, bubbleText, statsDiv, queueDiv) {
  if (queueDiv) queueDiv.style.display = 'none';
  bubbleText.textContent = 'Starting edit… (preparing the diffusion pipeline)';
  statsDiv.textContent = 'Qwen-Image-Edit';
  const t0 = performance.now();

  // The image element is created lazily on the first frame, then refreshed in place as the
  // denoise progresses so the user sees the picture forming (rather than a frozen "generating…").
  let img = null;
  function ensureImg() {
    if (img) return img;
    bubbleText.innerHTML = '';
    img = document.createElement('img');
    img.alt = 'edited image (denoising…)';
    img.style.maxWidth = '512px';
    img.style.maxHeight = '512px';
    img.style.borderRadius = '8px';
    img.style.display = 'block';
    img.style.imageRendering = 'auto';
    bubbleText.appendChild(img);
    return img;
  }

  try {
    const res = await fetch('/api/image-edit/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imagePaths: userMsg.imagePaths, prompt: userMsg.content || '' }),
      signal: currentAbortController.signal
    });
    if (!res.ok) {
      let err = 'HTTP ' + res.status;
      try { const j = await res.json(); if (j && j.error) err = j.error; } catch {}
      bubbleText.textContent = 'Image edit failed: ' + err;
      statsDiv.textContent = 'Failed';
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch { continue; }

        if (data.imageEdit) {
          if (data.image) { ensureImg().src = data.image; }
          if (data.total > 0) statsDiv.textContent = `Denoising… step ${data.step}/${data.total}`;
          scrollChatToBottom();
        } else if (data.done) {
          if (data.error) {
            bubbleText.textContent = 'Image edit failed: ' + data.error;
            statsDiv.textContent = 'Failed';
          } else {
            ensureImg().src = data.url + '?t=' + Date.now();  // final full-resolution result
            img.alt = 'edited image';
            const dl = document.createElement('a');
            dl.href = data.url;
            dl.setAttribute('download', '');
            dl.textContent = '⬇ Download image';
            dl.style.cssText = 'display:inline-block;margin-top:8px;color:var(--accent);';
            bubbleText.appendChild(dl);
            statsDiv.textContent = `Edited ${data.width}×${data.height} · ${((performance.now() - t0) / 1000).toFixed(1)}s`;
          }
          scrollChatToBottom();
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') { if (!img) bubbleText.textContent = 'Image edit cancelled.'; statsDiv.textContent = 'Stopped by user'; }
    else { bubbleText.textContent = 'Image edit error: ' + e.message; statsDiv.textContent = 'Failed'; }
  }
}

// "1h 04m" / "7m 12s" / "43s"; '' when the value is missing or not yet known.
function fmtDuration(s) {
  if (typeof s !== 'number' || !(s > 0)) return '';
  if (s >= 3600) return `${Math.floor(s / 3600)}h ${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}m`;
  if (s >= 60) return `${Math.floor(s / 60)}m ${String(Math.floor(s % 60)).padStart(2, '0')}s`;
  return `${Math.round(s)}s`;
}

async function runVideoGenerate(userMsg, bubbleText, statsDiv, queueDiv) {
  if (queueDiv) queueDiv.style.display = 'none';
  bubbleText.textContent = 'Starting video generation… (this takes a few minutes)';
  // What attached media MEANS depends on the checkpoint, and only the server knows
  // which one is loaded. A reference model (MiniMax-H3 Ref2VA) takes stills, clips
  // and soundtracks as identity and appearance references for a brand-new scene and
  // accepts several at once; a keyframe model takes the first still as the opening
  // frame and, where it does first-and-last, a second as the closing one. Sending the
  // attachments down the wrong one of those is not a degraded clip, it is a refused
  // request, so the payload is shaped from /api/models rather than guessed here.
  // With no capability block (an older server, or a model that reports none) this
  // falls through to exactly the single-image request the UI has always sent.
  const caps = currentVideoCaps || {};
  // Stills only: imagePaths flattens an attached clip into its frames, and nine of
  // those are nine unrelated reference pictures rather than the one clip meant.
  const stills = userMsg.stillImagePaths || userMsg.imagePaths || [];
  const clips = userMsg.videoFilePaths || [];
  const sounds = userMsg.audioPaths || [];
  const payload = { prompt: userMsg.content || '' };
  let mode = 'Text-to-Video';
  let unused = 0;

  if (caps.supportsReferenceConditioning) {
    const cap = caps.maxReferenceImages > 0 ? caps.maxReferenceImages : stills.length;
    const refs = stills.slice(0, cap);
    unused = stills.length - refs.length;
    if (refs.length) payload.referenceImages = refs;
    if (clips.length) payload.referenceVideos = clips;
    if (sounds.length) payload.referenceAudios = sounds;
    const parts = [];
    if (refs.length) parts.push(refs.length + (refs.length === 1 ? ' image' : ' images'));
    if (clips.length) parts.push(clips.length + (clips.length === 1 ? ' clip' : ' clips'));
    if (sounds.length) parts.push(sounds.length + (sounds.length === 1 ? ' soundtrack' : ' soundtracks'));
    mode = parts.length ? 'Reference-to-Video \u00b7 ' + parts.join(' + ') : 'Text-to-Video';
  } else if (stills.length > 0) {
    payload.imagePath = stills[0];
    mode = 'Image-to-Video';
    if (stills.length > 1 && caps.supportsEndImageConditioning) {
      payload.endImage = stills[1];
      mode = 'First-and-last-frame';
    }
    unused = stills.length - (payload.endImage ? 2 : 1);
  }
  statsDiv.textContent = mode +
    (unused > 0 ? ' (' + unused + (unused === 1 ? ' image' : ' images') + ' not used)' : '');
  const t0 = performance.now();

  try {
    const res = await fetch('/api/video-generate/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: currentAbortController.signal
    });
    if (!res.ok) {
      let err = 'HTTP ' + res.status;
      try { const j = await res.json(); if (j && j.error) err = j.error; } catch {}
      bubbleText.textContent = 'Video generation failed: ' + err;
      statsDiv.textContent = 'Failed';
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch { continue; }

        if (data.videoGen) {
          // A single denoising pass at 720p/121 frames runs for minutes, so the
          // server also sends heartbeats carrying the phase and a running ETA.
          // Show those, otherwise the UI looks frozen between steps.
          const eta = fmtDuration(data.etaSeconds);
          const el = fmtDuration(data.elapsedSeconds);
          if (data.phase && data.phase !== 'denoise') {
            const label = data.phase === 'text-encode' ? 'Encoding prompt'
                        : data.phase === 'image-encode' ? 'Encoding the input image'
                        : data.phase === 'vae-decode' ? 'Decoding frames'
                        : data.phase === 'done' ? 'Finishing' : data.phase;
            statsDiv.textContent = `${label}… ${el}`;
            bubbleText.textContent = `${label}${data.detail ? ' (' + data.detail + ')' : ''}…`;
          } else if (data.total > 0) {
            statsDiv.textContent = `Denoising… step ${data.step}/${data.total}` + (eta ? ` · ${eta} left` : '');
            bubbleText.textContent = `Generating video… step ${data.step} of ${data.total}`
              + (data.detail ? ` — ${data.detail}` : '')
              + (eta ? ` · about ${eta} left` : '')
              + (el ? ` · ${el} elapsed` : '');
          }
        } else if (data.done) {
          if (data.error) {
            bubbleText.textContent = 'Video generation failed: ' + data.error;
            statsDiv.textContent = 'Failed';
          } else {
            bubbleText.innerHTML = '';
            const vid = document.createElement('video');
            vid.src = data.url;
            vid.controls = true;
            vid.autoplay = true;
            vid.loop = true;
            vid.muted = true;
            vid.playsInline = true;
            vid.style.maxWidth = '640px';
            vid.style.maxHeight = '480px';
            vid.style.borderRadius = '8px';
            vid.style.display = 'block';
            bubbleText.appendChild(vid);
            const dl = document.createElement('a');
            dl.href = data.url;
            dl.setAttribute('download', '');
            dl.textContent = '⬇ Download video';
            dl.style.cssText = 'display:inline-block;margin-top:8px;color:var(--accent);';
            bubbleText.appendChild(dl);
            statsDiv.textContent = `${data.width}×${data.height} · ${data.frames} frames @ ${data.fps} fps · seed ${data.seed} · ${((performance.now() - t0) / 1000).toFixed(1)}s`;
          }
          scrollChatToBottom();
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') { bubbleText.textContent = 'Video generation cancelled.'; statsDiv.textContent = 'Stopped by user'; }
    else { bubbleText.textContent = 'Video generation error: ' + e.message; statsDiv.textContent = 'Failed'; }
  }
}

async function requestAssistantResponse() {
  if (isGenerating) return;
  if (!currentLoadedModel) return;

  isGenerating = true;
  currentAbortController = new AbortController();
  setSendButtonState(true);

  const assistDiv = addAssistantBubble();
  const bubbleText = assistDiv.querySelector('.bubble-text');
  const statsDiv = assistDiv.querySelector('.stats');
  const queueDiv = assistDiv.querySelector('.queue-indicator');

  let fullText = '';
  let fullThinking = '';
  let wasAborted = false;
  // Names of tool calls the server handed back because nothing in process answered
  // them. This page has no tool implementations, so they are reported, never run.
  let forwardedToolCalls = [];

  try {
    if (!currentSessionId) {
      await createSession();
    }

    // Qwen-Image-Edit: an attached image + prompt produces a NEW image, not chat text.
    const _lastUser = chatHistory[chatHistory.length - 1];
    if (currentArchitecture === 'qwen_image' && _lastUser && _lastUser.imagePaths && _lastUser.imagePaths.length > 0) {
      await runImageEdit(_lastUser, bubbleText, statsDiv, queueDiv);
      return;
    }

    // Video generation: the prompt (plus an optional attached image as the first
    // frame) produces a video, not chat text. Every video architecture routes here.
    if (VIDEO_ARCHITECTURES.has(currentArchitecture) && _lastUser) {
      await runVideoGenerate(_lastUser, bubbleText, statsDiv, queueDiv);
      return;
    }

    const reasoningOn = document.getElementById('reasoning-toggle').checked;
    const chatPayload = { messages: chatHistory, maxTokens: serverDefaultMaxTokens, think: reasoningOn };
    if (currentSessionId) {
      chatPayload.sessionId = currentSessionId;
    }
    if (selectedSkills.length > 0) {
      chatPayload.skills = selectedSkills.slice();
    }
    if (needsCacheReset) {
      chatPayload.newChat = true;
      needsCacheReset = false;
    }

    let res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(chatPayload),
      signal: currentAbortController.signal
    });

    if (res.status === 404 && chatPayload.sessionId) {
      // Session vanished on the server (e.g. restart); recreate and retry once.
      currentSessionId = null;
      await createSession();
      if (currentSessionId) {
        chatPayload.sessionId = currentSessionId;
        chatPayload.newChat = true;
        res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(chatPayload),
          signal: currentAbortController.signal
        });
      }
    }

    if (!res.ok) {
      let detail = `HTTP ${res.status}`;
      try {
        const errorText = await res.text();
        if (errorText) {
          try {
            const errorBody = JSON.parse(errorText);
            detail = errorBody.error || errorBody.detail || errorBody.message || errorText;
          } catch {
            detail = errorText;
          }
        }
      } catch {}
      throw new Error(detail);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let queueCleared = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.queue_position !== undefined) {
            if (queueDiv) {
              queueDiv.style.display = 'inline-flex';
              queueDiv.textContent = '';
              const spinner = document.createElement('div');
              spinner.className = 'queue-spinner';
              queueDiv.appendChild(spinner);
              const txt = document.createElement('span');
              txt.textContent = data.queue_position === 1
                ? 'Next in queue (1 request ahead)'
                : `Position ${data.queue_position} in queue (${data.queue_position} requests ahead)`;
              queueDiv.appendChild(txt);
              scrollChatToBottom();
            }
            continue;
          }
          if (!queueCleared && queueDiv) {
            queueDiv.style.display = 'none';
            queueCleared = true;
          }
          if (data.thinking) {
            fullThinking += data.thinking;
            let thinkBlock = assistDiv.querySelector('.thinking-block');
            if (!thinkBlock) {
              thinkBlock = document.createElement('div');
              thinkBlock.className = 'thinking-block';
              const expanded = reasoningOn ? ' expanded' : '';
              const visible = reasoningOn ? ' visible' : '';
              const display = reasoningOn ? '' : ' style="display:none"';
              thinkBlock.innerHTML = `<div class="thinking-header" onclick="toggleThinking(this)"${display}><span class="arrow${expanded}">&#x25B6;</span> Reasoning</div><div class="thinking-content${visible}"></div>`;
              bubbleText.parentNode.insertBefore(thinkBlock, bubbleText);
            }
            const tc = thinkBlock.querySelector('.thinking-content');
            tc.textContent += data.thinking;
            if (reasoningOn) scrollChatToBottom();
          }
          if (data.skill_step) {
            // Completion metadata is intentionally not rendered as a history.
            // Keep only user-facing output files; call execution is logged
            // by the server and the matching `finished` event clears live activity.
            if (Array.isArray(data.files) && data.files.length) {
              appendArtifactFiles(assistDiv, data.files);
              scrollChatToBottom();
            }
          }
          if (data.tool_progress) {
            // Live "writing code… / running…" state for an in-process tool call.
            updateToolProgress(assistDiv, data);
            scrollChatToBottom();
          }
          if (data.tool_calls) {
            // A tool call the SERVER could not answer and handed back. This page
            // declares no tools of its own, so there is nothing here to run it — and
            // for a long time nothing here to show it either: the frame matched none
            // of the key checks and fell into the catch below, so a reply whose every
            // word was inside the reasoning block rendered as an empty bubble and the
            // chat simply stopped. Say what happened instead of nothing.
            forwardedToolCalls = forwardedToolCalls.concat(
              data.tool_calls.map(c => c && c.name).filter(Boolean));
            scrollChatToBottom();
          }
          if (data.token) {
            fullText += data.token;
            bubbleText.textContent = fullText;
            scrollChatToBottom();
          }
          if (data.replace !== undefined) {
            // DiffusionGemma live denoising preview: each frame refines the whole
            // canvas, so replace (not append) the assistant message body.
            fullText = data.replace;
            bubbleText.textContent = fullText;
            if (data.preview && data.diffusionTotal > 0) {
              statsDiv.textContent = `Denoising\u2026 step ${data.diffusionStep}/${data.diffusionTotal}`;
            }
            scrollChatToBottom();
          }
          if (data.done) {
            clearCurrentActivity(assistDiv);
            if (data.sessionId) currentSessionId = data.sessionId;
            if (data.error) {
              bubbleText.textContent = 'Error: ' + data.error;
              statsDiv.textContent = 'Inference failed';
            } else {
              // A turn that produced no answer at all must never render as a blank
              // bubble. It happens when the model spent the whole reply asking for a
              // tool nobody can run, and the silence is indistinguishable from a hang:
              // the user's only move is to retry the identical prompt and watch it
              // happen again.
              if (!fullText) {
                bubbleText.textContent = forwardedToolCalls.length > 0
                  ? 'No answer was produced: the model asked for '
                    + forwardedToolCalls.join(', ')
                    + ', which this page cannot run. Try rephrasing, or ask it to answer directly.'
                  : 'No answer was produced. Try sending the message again, or rephrasing it.';
                bubbleText.style.opacity = '0.75';
              }
              // Streaming renders plain text; once the answer is complete, any
              // artifact download links the model wrote become clickable.
              if (fullText) renderArtifactLinks(bubbleText, fullText);
              let stats = `${data.tokenCount} tokens \u00B7 ${data.elapsed.toFixed(1)}s \u00B7 ${data.tokPerSec.toFixed(1)} tok/s`;
              if (typeof data.promptTokens === 'number' && data.promptTokens > 0) {
                const reused = typeof data.kvReusedTokens === 'number' ? data.kvReusedTokens : 0;
                const pct = typeof data.kvReusePercent === 'number'
                  ? data.kvReusePercent
                  : (100 * reused / data.promptTokens);
                stats += ` \u00B7 KV ${reused}/${data.promptTokens} (${pct.toFixed(0)}%)`;
              }
              // The reply stopped because it ran out of max-tokens budget, not
              // because the model was done. Say so, otherwise an answer that
              // ends mid-word just looks like the model broke.
              if (data.truncated) stats += ' \u00B7 truncated (max tokens reached)';
              statsDiv.textContent = stats;
            }
          }
        } catch {}
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      wasAborted = true;
      statsDiv.textContent = 'Stopped by user';
    } else {
      bubbleText.textContent = 'Error: ' + e.message;
    }
  } finally {
    // Covers cancellation, network failure, malformed/early-ended SSE, and any
    // server path that could not emit the normal `finished`/`done` lifecycle.
    clearCurrentActivity(assistDiv);
    if (fullText) {
      const assistantMessage = { role: 'assistant', content: fullText };
      if (fullThinking) assistantMessage.thinking = fullThinking;
      chatHistory.push(assistantMessage);

      const assistIdx = chatHistory.length - 1;
      assistDiv.dataset.idx = assistIdx;
      const bubble = assistDiv.querySelector('.bubble');
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'msg-actions';
      actionsDiv.innerHTML = `<button class="danger" onclick="revertFrom(${assistIdx})" title="Remove this response">&#x21A9; Revert</button>`;
      bubble.appendChild(actionsDiv);
    }
    isGenerating = false;
    currentAbortController = null;
    setSendButtonState(false);
    const indicator = assistDiv.querySelector('.typing-indicator');
