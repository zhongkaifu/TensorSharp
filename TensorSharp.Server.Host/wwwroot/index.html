<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TensorSharp Chat</title>
<link rel="stylesheet" href="/mask-editor.css?v=2">
<script src="/mask-editor.js?v=2"></script>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #252525;
  --border: #333;
  --text: #e8e8e8;
  --text2: #999;
  --accent: #6c8cff;
  --accent-hover: #8da6ff;
  --user-bg: #1e2a42;
  --assist-bg: #1a1a1a;
  --danger: #e55;
  --success: #5b5;
  --radius: 12px;
  --layout-gutter: clamp(12px, 2vw, 20px);
  --chat-shell-max-width: min(1180px, calc(100vw - 32px));
  --user-avatar-size: 40px;
  --assistant-avatar-size: 72px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

header h1 {
  font-size: 18px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Colorful animated "TensorSharp" wordmark, used in place of the old banner image. */
.big-wordmark {
  font-weight: 800;
  letter-spacing: -0.02em;
  white-space: nowrap;
  background: linear-gradient(100deg, #6c8cff 0%, #b06cff 28%, #ff6cab 52%, #ff8c6c 74%, #ffd76c 100%);
  background-size: 220% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  animation: brandShimmer 7s linear infinite;
}

@keyframes brandShimmer {
  to { background-position: 220% center; }
}

@media (prefers-reduced-motion: reduce) {
  .big-wordmark,
  .brand-site-link { animation: none; }
}

/* Wordmark links to tensorsharp.ai without disturbing the gradient text. */
a.brand-home {
  text-decoration: none;
  display: inline-flex;
}

.brand-site-link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
  padding: 9px 20px;
  border-radius: 999px;
  color: #fff;
  text-decoration: none;
  white-space: nowrap;
  background: linear-gradient(100deg, #6c8cff 0%, #b06cff 45%, #ff6cab 100%);
  background-size: 200% auto;
  box-shadow: 0 4px 16px rgba(108, 140, 255, 0.38);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  animation: brandShimmer 7s linear infinite;
}

.brand-site-link:hover {
  transform: translateY(-1px) scale(1.04);
  box-shadow: 0 6px 24px rgba(176, 108, 255, 0.55);
  color: #fff;
}

.brand-site-link .link-arrow {
  font-size: 13px;
  opacity: 0.9;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: flex-end;
  margin-left: auto;
}

.status-badge {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--surface2);
  color: var(--text2);
}

.status-badge.loaded {
  background: #1a3a1a;
  color: var(--success);
}

#queue-badge.queue-active {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

#queue-badge.queue-active.processing-only {
  background: #1a3a1a;
  color: var(--success);
}

#queue-badge.queue-active.has-waiting {
  background: #3a2a1a;
  color: #fa5;
}

.queue-badge-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
  animation: pulseDot 1.2s ease-in-out infinite;
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(0.7); }
}

button {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
}

button:hover { background: #333; border-color: #444; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

button.primary:hover { background: var(--accent-hover); }

.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

#model-panel {
  padding: 16px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: none;
}

#model-panel.visible { display: block; }

.model-panel-inner {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

#model-panel select, #model-panel input {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
}

#model-panel select { min-width: 280px; }

#chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px var(--layout-gutter);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.message {
  display: flex;
  gap: 12px;
  max-width: var(--chat-shell-max-width);
  width: 100%;
  margin: 0 auto;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user { flex-direction: row-reverse; }

.avatar {
  width: var(--user-avatar-size);
  height: var(--user-avatar-size);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 2px;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

.message.user .avatar {
  background: var(--accent);
  color: #fff;
  font-weight: 600;
}

.message.assistant .avatar {
  width: var(--assistant-avatar-size);
  height: var(--assistant-avatar-size);
  margin-top: 0;
  border-radius: 20px;
  background: radial-gradient(circle at top, #2a3353 0%, #151515 72%);
  border: 1px solid rgba(140, 166, 255, 0.22);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
}

.message.assistant .avatar img {
  object-position: center;
  transform-origin: center;
  transform: scale(1);
  filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.34)) contrast(1.08) saturate(1.06);
}

.message.assistant .bubble {
  max-width: calc(100% - var(--assistant-avatar-size) - 18px);
}

.bubble {
  padding: 12px 16px;
  border-radius: var(--radius);
  line-height: 1.6;
  font-size: 14px;
  max-width: 85%;
  word-break: break-word;
}

/* The message keeps its line breaks -- not the whole bubble, whose markup is built
   from indented templates: pre-wrap there drew that indentation as blank lines above
   the reasoning, under a user's message and between the stats and the file chips. */
.bubble-text { white-space: pre-wrap; }

.message.user .bubble {
  background: var(--user-bg);
  border: 1px solid #2a3a5a;
}

.message.assistant .bubble {
  background: var(--assist-bg);
  border: 1px solid var(--border);
}

.bubble .media-preview {
  margin-bottom: 8px;
}

.bubble .media-preview img,
.bubble .media-preview video {
  max-width: 300px;
  max-height: 200px;
  border-radius: 8px;
  display: block;
}

.bubble .media-preview .audio-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  color: var(--text2);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.typing-indicator {
  display: inline-flex;
  gap: 4px;
  padding: 4px 0;
}

.typing-indicator span {
  width: 6px;
  height: 6px;
  background: var(--text2);
  border-radius: 50%;
  animation: blink 1.2s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 60%, 100% { opacity: 0.3; }
  30% { opacity: 1; }
}

.model-label {
  font-size: 10px;
  color: var(--accent);
  opacity: 0.7;
  margin-bottom: 4px;
}

.stats {
  font-size: 11px;
  color: var(--text2);
  margin-top: 6px;
}

#input-area {
  padding: 16px var(--layout-gutter);
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.input-row {
  display: flex;
  gap: 10px;
  max-width: var(--chat-shell-max-width);
  margin: 0 auto;
  align-items: flex-end;
}

.input-wrapper {
  flex: 1;
  position: relative;
}

#message-input {
  width: 100%;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 12px 16px;
  padding-right: 100px;
  border-radius: var(--radius);
  font-size: 14px;
  font-family: inherit;
  resize: none;
  min-height: 48px;
  max-height: 200px;
  line-height: 1.5;
  outline: none;
  transition: border-color 0.15s;
}

#message-input:focus { border-color: var(--accent); }

#message-input::placeholder { color: var(--text2); }

.input-actions {
  position: absolute;
  right: 8px;
  bottom: 8px;
  display: flex;
  gap: 4px;
}

.input-actions button {
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 16px;
  border: none;
  background: transparent;
  color: var(--text2);
}

.input-actions button:hover {
  background: var(--surface);
  color: var(--text);
}

.input-actions button.send-btn {
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  padding: 6px 14px;
}

.input-actions button.send-btn:hover { background: var(--accent-hover); }

.input-actions button.stop-btn {
  background: var(--danger);
  color: #fff;
  font-size: 14px;
  padding: 6px 14px;
  animation: pulseStop 1.5s ease-in-out infinite;
}

.input-actions button.stop-btn:hover { background: #f66; }

@keyframes pulseStop {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

#file-input { display: none; }

.model-switcher {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: var(--chat-shell-max-width);
  margin: 0 auto 6px auto;
  font-size: 12px;
  color: var(--text2);
  flex-wrap: wrap;
}

.model-readout {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.model-readout-label {
  white-space: nowrap;
}

.model-value {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface2);
  font-size: 12px;
  color: var(--text);
  max-width: min(420px, 100%);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.model-value.empty {
  color: var(--text2);
}

.settings-hint {
  margin-top: 10px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
}

.reasoning-toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: 8px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  user-select: none;
}

.reasoning-toggle input[type="checkbox"] { display: none; }

.reasoning-toggle .toggle-track {
  width: 32px;
  height: 18px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 9px;
  position: relative;
  transition: background 0.2s, border-color 0.2s;
}

.reasoning-toggle .toggle-track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  background: var(--text2);
  border-radius: 50%;
  transition: transform 0.2s, background 0.2s;
}

.reasoning-toggle input:checked + .toggle-track {
  background: #1e3a5a;
  border-color: var(--accent);
}

.reasoning-toggle input:checked + .toggle-track::after {
  transform: translateX(14px);
  background: var(--accent);
}

.thinking-block {
  background: #1a1a2a;
  border: 1px solid #2a2a4a;
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
}

.thinking-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
}

.thinking-header:hover { background: #222238; }

.thinking-header .arrow {
  font-size: 10px;
  transition: transform 0.2s;
}

.thinking-header .arrow.expanded { transform: rotate(90deg); }

.thinking-content {
  padding: 8px 12px 10px;
  font-size: 13px;
  color: #aaa;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  border-top: 1px solid #2a2a4a;
  display: none;
}

.thinking-content.visible { display: block; }

.attachments {
  display: flex;
  align-items: center;
  align-content: flex-start;
  max-height: 40vh;
  max-height: 40dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  gap: 8px;
  margin-bottom: 8px;
  max-width: var(--chat-shell-max-width);
  margin-left: auto;
  margin-right: auto;
  flex-wrap: wrap;
}

.attachment-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  color: var(--text2);
  max-width: 100%;
}

/* A long unbroken file name must not push the remove control off-screen. */
.attachment-chip .label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.attachment-chip img {
  width: 32px;
  height: 32px;
  border-radius: 4px;
  object-fit: cover;
}

.attachment-chip .remove {
  cursor: pointer;
  color: var(--danger);
  font-size: 14px;
  margin-left: 2px;
  padding: 0;
  border: none;
  background: none;
  font-family: inherit;
  line-height: 1;
}

.attachment-chip .remove:hover { background: none; }

/* A pending image, video or scanned PDF is shown as a thumbnail rather than a name
   chip. The name stays in the tile's tooltip and alt text. Top left, .kind marks a
   video or a PDF; bottom left, .badge is the "Picture N" order a multi-image edit
   prompt refers to, or a scanned PDF's page count. */
.image-selection-button,.image-edit-actions button {
  padding:8px 12px; min-height:40px; border:1px solid var(--border); border-radius:8px;
  color:var(--text); background:var(--surface2); cursor:pointer; font:inherit;
}
.image-selection-button:focus-visible,.image-edit-actions button:focus-visible { outline:2px solid var(--accent); }
.image-edit-attachment { display:flex; align-items:center; gap:8px; padding:6px; border:1px solid var(--border); border-radius:10px; }
.image-edit-attachment.editing-target { border-color:var(--accent); }
.image-selection-controls { display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
.image-selection-role { font-size:12px; font-weight:600; }
.image-selection-status { font-size:12px; color:var(--text2); max-width:140px; }
.image-edit-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.attachment-thumb {
  position: relative;
  flex: 0 0 auto;
  width: 64px;
  height: 64px;
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface2);
  border: 1px solid var(--border);
}

.attachment-thumb img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.attachment-thumb .remove,
.attachment-thumb .kind,
.attachment-thumb .badge {
  position: absolute;
  height: 20px;
  min-width: 20px;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.65);
  color: #fff;
  line-height: 20px;
  text-align: center;
}

.attachment-thumb .remove {
  top: 3px;
  right: 3px;
  padding: 0;
  border: none;
  font-size: 14px;
  font-family: inherit;
}

.attachment-thumb .remove:hover { background: var(--danger); }

.attachment-thumb .kind,
.attachment-thumb .badge {
  left: 3px;
  max-width: calc(100% - 6px);
  padding: 0 5px;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}

.attachment-thumb .kind { top: 3px; }

.attachment-thumb .badge { bottom: 3px; }

/* A page's heading starts at its top left; centring the crop would cut off the
   top of a portrait page and the left edge of a landscape one. */
.attachment-thumb.page img { object-position: left top; }

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text2);
  gap: 16px;
  text-align: center;
  padding: 40px;
}

.empty-state .big-wordmark {
  font-size: clamp(40px, 9vw, 76px);
  line-height: 1.05;
  padding: 0 8px;
  filter: drop-shadow(0 14px 28px rgba(108, 140, 255, 0.22));
}

.empty-state .big-wordmark.assistant-preview {
  font-size: clamp(34px, 7vw, 60px);
}

.empty-state p { font-size: 14px; max-width: 400px; line-height: 1.6; }

@media (max-width: 720px) {
  header {
    padding: 10px 14px;
  }

  header h1 {
    font-size: 16px;
    gap: 10px;
  }

  .brand-site-link {
    font-size: 14px;
    padding: 6px 14px;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
  }

  .message.assistant .avatar {
    width: 58px;
    height: 58px;
    border-radius: 18px;
  }

  .message.assistant .bubble {
    max-width: calc(100% - 58px - 14px);
  }

  .empty-state {
    padding: 28px 20px;
  }

  .empty-state .big-wordmark {
    font-size: clamp(34px, 12vw, 56px);
  }
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  align-items: center;
  justify-content: center;
}

.modal-overlay.visible { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  min-width: 400px;
  max-width: 500px;
}

.modal h2 {
  font-size: 16px;
  margin-bottom: 16px;
}

.modal .field {
  margin-bottom: 12px;
}

.modal label {
  display: block;
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 4px;
}

.modal select, .modal input[type="text"] {
  width: 100%;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
}

.modal .actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.msg-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.15s;
}

.message:hover .msg-actions { opacity: 1; }

.msg-actions button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text2);
  padding: 2px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.msg-actions button:hover {
  background: var(--surface2);
  color: var(--text);
  border-color: #444;
}

.msg-actions button.danger:hover {
  color: var(--danger);
  border-color: var(--danger);
}

.edit-textarea {
  width: 100%;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--accent);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  min-height: 60px;
  max-height: 300px;
  line-height: 1.5;
  outline: none;
}

.edit-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 8px;
}

/* ---- Agent Skills -------------------------------------------------------
   The pill reuses .model-value; the manager reuses .modal-overlay/.modal and
   only widens them, and the selected-skill chips reuse .attachment-chip. */

.skills-pill {
  cursor: pointer;
  font-family: inherit;
  gap: 6px;
}

.skills-pill:hover { background: #333; border-color: #444; }

/* An empty chip strip must not reserve its margin above the composer. */
#skill-chips:empty { display: none; }

.modal.skills-modal {
  min-width: min(640px, 92vw);
  max-width: min(640px, 92vw);
  width: 640px;
  max-height: 84vh;
  display: flex;
  flex-direction: column;
}

.skills-hint {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
}

.skills-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.skills-toolbar label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  user-select: none;
}

.skills-toolbar input[type="checkbox"] {
  accent-color: var(--accent);
  cursor: pointer;
}

.skills-notice {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
  margin: 10px 0;
  word-break: break-word;
}

.skills-errors {
  border: 1px solid var(--border);
  background: var(--surface2);
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
  max-height: 130px;
  overflow-y: auto;
}

.skills-error-title {
  color: var(--danger);
  margin-bottom: 4px;
}

.skills-error-row { word-break: break-word; }

.skills-list {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface2);
  /* Owns the gap to whatever precedes it, since the toolbar, the notice and the
     error block are each hidden when they have nothing to say. */
  margin-top: 12px;
  max-height: 46vh;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.skill-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}

.skill-row:last-child { border-bottom: none; }
.skill-row:hover { background: #333; }

.skill-row input[type="checkbox"] {
  margin-top: 3px;
  accent-color: var(--accent);
  flex-shrink: 0;
  cursor: pointer;
}

.skill-row-body { flex: 1; min-width: 0; }

.skill-name {
  display: block;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  word-break: break-word;
}

.skill-origin {
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 1px 7px;
  margin-left: 6px;
  font-size: 10px;
  color: var(--text2);
  white-space: nowrap;
}

/* Descriptions are free text from SKILL.md, so clamp them and keep the full
   text in the row's title attribute. */
.skill-desc {
  margin-top: 3px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}

.skill-meta {
  margin-top: 4px;
  font-size: 11px;
  color: var(--text2);
}

.skill-warning {
  margin-top: 3px;
  font-size: 11px;
  color: var(--text2);
  word-break: break-word;
}

.skill-delete {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text2);
  padding: 2px 9px;
  border-radius: 6px;
  font-size: 12px;
}

.skill-delete:hover {
  background: transparent;
  color: var(--danger);
  border-color: var(--danger);
}

/* One transient activity panel for the operation that is running now. It is
   removed at completion; completed tool/skill details belong in server logs. */
.current-activity {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
}

.current-activity-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  color: var(--text2);
  font-size: 12px;
}

.current-activity-spinner {
  width: 12px;
  height: 12px;
  flex: 0 0 auto;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* A bounded tail of only the current code draft, edit, file operation, or
   process output. The node and its buffers disappear when that operation ends. */
.current-activity-detail {
  margin: 0 8px 7px;
  padding: 5px 8px;
  max-height: 5.6em;
  overflow-y: auto;
  border-left: 2px solid var(--accent);
  background: var(--surface2);
  border-radius: 4px;
  color: var(--text2);
  font-size: 0.78em;
  white-space: pre-wrap;
  word-break: break-word;
}

.current-agent-details {
  margin: 0 8px 7px;
  font-size: 12px;
  white-space: normal;
}

.current-agent-details[hidden] { display: none; }

.current-agent-summary {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 8px;
  border-radius: 4px;
  color: var(--text2);
  cursor: pointer;
  list-style: none;
}

.current-agent-summary::-webkit-details-marker { display: none; }
.current-agent-summary::before { content: '\23F5'; }
.current-agent-details[open] > .current-agent-summary::before { content: '\23F7'; }
.current-agent-summary:hover { background: var(--surface); color: var(--text); }
.current-agent-summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.current-agent-list {
  max-height: min(24em, 45vh);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 8px;
}

.current-agent-card {
  padding: 9px 0;
  border-top: 1px solid var(--border);
  color: var(--text2);
  overflow-wrap: anywhere;
}

.current-agent-name { color: var(--text); font-weight: 600; }
.current-agent-state { color: var(--accent); margin: 2px 0 5px; }
.current-agent-task, .current-agent-tool, .current-agent-result, .current-agent-error {
  white-space: pre-wrap;
  margin-top: 4px;
}
.current-agent-error { color: var(--danger); }
.current-agent-empty { color: var(--text2); padding: 8px 0; }

/* Files a shell command produced: visible download chips on the reply itself,
   so getting the file never depends on the model repeating the link in prose. */
.artifact-files {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.artifact-files a {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface2);
  color: var(--accent);
  font-size: 0.85em;
  text-decoration: none;
  word-break: break-all;
}
.artifact-files a:hover { border-color: var(--accent); }
.artifact-files .artifact-size { color: var(--text2); }

/* A download link the model wrote into its answer, made clickable at render. */
.bubble-text a.artifact-link { color: var(--accent); }

/* An answer rendered from Markdown (renderMarkdown). .bubble-text's pre-wrap stays for
   plain text -- errors, denoising previews -- and a rendered answer lays itself out. */
.bubble-text.md { display: block; white-space: normal; }
.bubble-text.md > :first-child { margin-top: 0; }
.bubble-text.md > :last-child { margin-bottom: 0; }
.bubble-text.md p { margin: 0 0 0.7em; }
.bubble-text.md h1, .bubble-text.md h2, .bubble-text.md h3,
.bubble-text.md h4, .bubble-text.md h5, .bubble-text.md h6 {
  margin: 1em 0 0.45em;
  line-height: 1.3;
  font-weight: 650;
}
.bubble-text.md h1 { font-size: 1.3em; }
.bubble-text.md h2 { font-size: 1.18em; }
.bubble-text.md h3 { font-size: 1.07em; }
.bubble-text.md h4, .bubble-text.md h5, .bubble-text.md h6 { font-size: 1em; }
.bubble-text.md ul, .bubble-text.md ol { margin: 0 0 0.7em; padding-left: 1.6em; }
.bubble-text.md li { margin: 0.2em 0; }
.bubble-text.md li > ul, .bubble-text.md li > ol { margin: 0.2em 0 0; }
.bubble-text.md a { color: var(--accent); }
.bubble-text.md code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em;
  padding: 0.12em 0.38em;
  border-radius: 5px;
  background: var(--surface2);
}
.bubble-text.md pre {
  margin: 0 0 0.8em;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #121212;
  overflow-x: auto;
  white-space: pre;
}
.bubble-text.md pre code { padding: 0; background: none; font-size: 0.86em; }
.bubble-text.md blockquote {
  margin: 0 0 0.7em;
  padding: 0.1em 0 0.1em 0.9em;
  border-left: 3px solid var(--border);
  color: var(--text2);
}
.bubble-text.md hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
.bubble-text.md .md-table { overflow-x: auto; margin: 0 0 0.8em; }
.bubble-text.md table { border-collapse: collapse; }
.bubble-text.md th, .bubble-text.md td {
  padding: 6px 12px;
  border: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}
.bubble-text.md th { background: var(--surface2); font-weight: 600; }
.bubble-text.md img { display: block; max-width: 100%; margin: 0.4em 0; border-radius: 8px; }
</style>
</head>
<body>

<header>
  <h1>
    <a class="brand-site-link" href="https://tensorsharp.ai" target="_blank" rel="noopener" title="Visit TensorSharp.ai">&#x1F310; TensorSharp.ai <span class="link-arrow">&#x2197;</span></a>
  </h1>
  <div class="header-controls">
    <span id="queue-badge" class="status-badge" style="display:none" title="Live inference load: requests processing concurrently and waiting in the queue"></span>
    <span id="status-badge" class="status-badge">No model configured</span>
    <button id="btn-clear" title="New chat">&#x2795; New Chat</button>
  </div>
</header>

<div class="main-area">
  <div id="chat-container">
    <div class="empty-state" id="empty-state">
      <a class="brand-home" href="https://tensorsharp.ai" target="_blank" rel="noopener" title="Visit tensorsharp.ai"><div class="big-wordmark" aria-label="TensorSharp">TensorSharp</div></a>
      <p>Start TensorSharp.Server with <code>--model &lt;path.gguf&gt; --backend &lt;type&gt; [--mmproj &lt;path&gt;] [--max-tokens 20000]</code>, then refresh this page.</p>
    </div>
  </div>

  <div id="input-area">
    <div class="attachments" id="attachments"></div>
    <div class="attachments" id="skill-chips"></div>
    <div class="model-switcher" id="model-switcher">
      <label class="reasoning-toggle" title="Enable reasoning / chain-of-thought output">
        <input type="checkbox" id="reasoning-toggle" checked>
        <span class="toggle-track"></span>
        <span>Reasoning</span>
      </label>
      <button type="button" class="model-value skills-pill" id="skills-pill" style="display:none" onclick="openSkillsModal()" title="Agent Skills the model can use">&#x1F9E9; Skills</button>
    </div>
    <div class="input-row">
      <div class="input-wrapper">
        <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
        <div class="input-actions">
          <button onclick="document.getElementById('file-input').click()" title="Attach file">&#x1F4CE;</button>
          <button class="send-btn" id="btn-send" onclick="sendMessage()">&#x27A4;</button>
        </div>
      </div>
    </div>
    <input type="file" id="file-input" multiple accept="image/*,video/*,audio/*,.pdf,.heic,.heif,.txt,.csv,.json,.xml,.md,.log,.py,.js,.ts,.cs,.java,.cpp,.c,.h,.html,.css,.yaml,.yml,.toml,.ini,.cfg,.sh,.bat,.ps1,.rb,.go,.rs,.swift,.kt,.sql,.r,.m,.tex,.rtf" onchange="handleFileSelect(event)">
  </div>
</div>

<input type="file" id="skill-zip-input" accept=".zip" style="display:none" onchange="handleSkillZipSelect(event)">

<div class="modal-overlay" id="skills-modal" onclick="onSkillsOverlayClick(event)">
  <div class="modal skills-modal">
    <h2>&#x1F9E9; Agent Skills</h2>
    <div class="skills-hint">Selected skills are described to the model up front; it then reads their bundled files on demand.</div>
    <div class="skills-toolbar" id="skills-toolbar" style="display:none">
      <button type="button" onclick="document.getElementById('skill-zip-input').click()">&#x2B06; Install .zip</button>
      <label title="Replace a skill of the same name if it is already installed"><input type="checkbox" id="skill-overwrite"> <span class="skills-hint">Overwrite existing</span></label>
    </div>
    <div class="skills-notice" id="skills-notice" style="display:none"></div>
    <div class="skills-errors" id="skills-errors" style="display:none"></div>
    <div class="skills-list" id="skills-list"></div>
    <div class="actions">
      <button type="button" onclick="closeSkillsModal()">Cancel</button>
      <button type="button" class="primary" onclick="applySkillsModal()">Apply</button>
    </div>
  </div>
</div>

<script>
const chatContainer = document.getElementById('chat-container');
const messageInput = document.getElementById('message-input');
const statusBadge = document.getElementById('status-badge');
const attachmentsDiv = document.getElementById('attachments');
const autoScrollThreshold = 32;

let chatHistory = [];
let pendingAttachments = [];
let activeImageEditTarget = null;
let isGenerating = false;
let currentAbortController = null;
let currentLoadedModel = null;
let currentArchitecture = null;
// What the loaded model does with attached pictures, straight from /api/models.
// Null for a non-video model. The same three images are three REFERENCES on
// MiniMax-H3 Ref2VA and a refused request on FL2VA, so this decides the shape of a
// video request rather than merely labelling it.
let currentVideoCaps = null;
// Architectures whose /api/models 'architecture' id means "this model generates video".
// The id comes from GGUF metadata, so it is matched rather than renamed.
const VIDEO_ARCHITECTURES = new Set(['wan', 'wan2.1', 'wan2.2', 'minimax-h3']);
// Agent Skills capability block from /api/models, or null on a server that has no
// skills support at all. Every read is guarded, so an older server degrades to
// "no Skills control" rather than to a broken page.
let currentSkillsCaps = null;
// Skill names sent with the next chat request.
let selectedSkills = [];
// Last /api/skills payload. The modal's inline handlers address rows by index into
// skillsRoster, so no attacker-controlled name is ever spliced into an attribute.
let skillsRoster = [];
let skillsErrors = [];
let skillsInstallable = false;
// Draft selection while the manager is open: Apply commits it, Cancel drops it.
let pendingSkillSelection = null;
let needsCacheReset = false;
let shouldAutoScroll = true;
let serverDefaultMaxTokens = 20000;
// Each chat has a dedicated session on the server. The session owns its KV cache;
// starting a new chat disposes the server-side session so its KV state is freed.
const DEFAULT_SESSION_ID = '__default__';
let currentSessionId = null;
const editOriginalHtml = new Map();

function isChatNearBottom() {
  return chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight <= autoScrollThreshold;
}

function updateAutoScrollState() {
  shouldAutoScroll = isChatNearBottom();
}

function scrollChatToBottom(force = false) {
  if (force || shouldAutoScroll) {
    chatContainer.scrollTop = chatContainer.scrollHeight;
    shouldAutoScroll = true;
  }
}

chatContainer.addEventListener('scroll', updateAutoScrollState);

messageInput.addEventListener('keydown', e => {
  // Enter can confirm an IME candidate; only submit after composition has ended.
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!e.repeat) sendMessage();
  }
});

messageInput.addEventListener('input', () => {
  messageInput.style.height = 'auto';
  messageInput.style.height = Math.min(messageInput.scrollHeight, 200) + 'px';
});

document.getElementById('btn-clear').onclick = clearChat;

function renderEmptyState() {
  if (chatHistory.length > 0) {
    return;
  }

  if (!currentLoadedModel) {
    chatContainer.innerHTML = `
      <div class="empty-state" id="empty-state">
        <a class="brand-home" href="https://tensorsharp.ai" target="_blank" rel="noopener" title="Visit tensorsharp.ai"><div class="big-wordmark" aria-label="TensorSharp">TensorSharp</div></a>
        <p>Start TensorSharp.Server with <code>--model &lt;path.gguf&gt; --backend &lt;type&gt; [--mmproj &lt;path&gt;] [--max-tokens 20000]</code>, then refresh this page.</p>
      </div>`;
    return;
  }

  chatContainer.innerHTML = `
    <div class="empty-state">
      <a class="brand-home" href="https://tensorsharp.ai" target="_blank" rel="noopener" title="Visit tensorsharp.ai"><div class="big-wordmark assistant-preview" aria-label="TensorSharp">TensorSharp</div></a>
      <p>Start a conversation with the configured model. You can attach images, videos, audio, and text files for multimodal inference.</p>
    </div>`;
}

function updateStatusBadge(data) {
  currentLoadedModel = data.loaded || null;
  currentArchitecture = data.architecture || null;
  renderAttachments();
  currentVideoCaps = data.video || null;

  if (!currentLoadedModel) {
    statusBadge.textContent = 'No model configured';
    statusBadge.classList.remove('loaded');
    return;
  }

  let statusText = currentLoadedModel + ' (' + (data.architecture || '?') + ')';
  if (data.loadedBackend) {
    statusText += ' | ' + data.loadedBackend;
  }
  if (data.loadedMmProj) {
    statusText += ' + ' + data.loadedMmProj;
  }

  statusBadge.textContent = statusText;
  statusBadge.classList.add('loaded');
}

async function fetchServerState() {
  try {
    const res = await fetch('/api/models');
    const data = await res.json();
    serverDefaultMaxTokens = data.defaultMaxTokens || 20000;
    updateStatusBadge(data);
    // Nullable on purpose: a server without the feature omits the block entirely.
    currentSkillsCaps = (data && typeof data.skills === 'object' && data.skills) ? data.skills : null;
    updateSkillsControl();
    renderEmptyState();
    await createSession();
    return data;
  } catch (e) {
    console.error('Failed to fetch server state:', e);
    return null;
  }
}

window.addEventListener('beforeunload', () => {
  if (currentSessionId && currentSessionId !== DEFAULT_SESSION_ID) {
    const id = currentSessionId;
    currentSessionId = null;
    try {
      fetch('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE', keepalive: true });
    } catch {}
  }
});

async function createSession() {
  try {
    const res = await fetch('/api/sessions', { method: 'POST' });
    const data = await res.json();
    if (data && data.sessionId) {
      currentSessionId = data.sessionId;
    }
  } catch (e) {
    console.error('Failed to create chat session:', e);
    currentSessionId = null;
  }
}

async function disposeCurrentSession() {
  if (!currentSessionId) return;
  const id = currentSessionId;
  currentSessionId = null;
  if (id === DEFAULT_SESSION_ID) return;
  try {
    await fetch('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE' });
  } catch (e) {
    console.warn('Failed to dispose chat session:', e);
  }
}

async function clearChat() {
  chatHistory = [];
  pendingAttachments = [];
  activeImageEditTarget = null;
  attachmentsDiv.innerHTML = '';
  chatContainer.innerHTML = '';
  needsCacheReset = false;
  shouldAutoScroll = true;
  await disposeCurrentSession();
  await createSession();
  renderEmptyState();
}

let uploadQueue = Promise.resolve();
let pendingUploadCount = 0;

async function handleFileSelect(event) {
  const files = Array.from(event.target.files);
  if (files.length === 0) return;
  event.target.value = '';
  pendingUploadCount++;
  // Keep separate selections in pick order as well as files inside each batch.
  uploadQueue = uploadQueue.then(() => uploadFiles(files)).finally(() => { pendingUploadCount--; });
  await uploadQueue;
}

async function uploadFiles(files) {
  const formData = new FormData();
  // Multipart order defines "Picture 1", "Picture 2", ... for multi-image edits.
  files.forEach(file => formData.append('file', file, file.name));

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok || !data || !data.ok) {
      throw new Error((data && data.error) || 'Upload failed');
    }
    // A one-file response retains its original shape; batches return ordered files.
    const uploaded = Array.isArray(data.files) ? data.files : [data];
    if (uploaded.length !== files.length || uploaded.some(file => !file || !file.ok || !file.file)) {
      throw new Error('The server did not return every uploaded file. Please try again.');
    }
    pendingAttachments.push(...uploaded);
    renderAttachments();
    uploaded.forEach(file => { if (file.warning) alert(file.warning); });
  } catch (e) {
    alert('Upload error: ' + e.message);
  }
}

// The file name is the client's own and can contain markup, so these builders
// assign textContent and attributes rather than interpolating into innerHTML.
function renderAttachments() {
  // Rebuilding the strip destroys a focused remove control; a keyboard user keeps
  // their place on the control now in the same slot, or the message box.
  const focusSlot = Array.from(attachmentsDiv.querySelectorAll('.remove')).indexOf(document.activeElement);
  attachmentsDiv.innerHTML = '';
  let imageNum = 0;
  const totalImages = pendingAttachments.filter(a => a.mediaType === 'image').length;
  pendingAttachments.forEach((att, idx) => {
    const name = String(att.fileName || att.file || '');
    let icon = '\u{1F4C4}';
    let label = name;
    // What a thumbnail tile shows in place of the chip: the picture itself, a
    // clip's first extracted frame, or a scanned PDF's first page image. Audio,
    // text, a PDF with a text layer, and a scanned PDF the server could not render
    // (no vision model, or no page image recovered) have nothing to show and stay
    // chips. kind marks the tile top-left and badge bottom-left; title is also the
    // alt text, so it says everything the two marks do.
    let thumb = null;
    if (att.mediaType === 'image') {
      // With several images attached, show the "Picture N" order the edit prompt can reference.
      imageNum++;
      const order = totalImages > 1 ? imageNum : 0;
      icon = '\u{1F5BC}';
      if (order) label = `${order}⃣ ${name}`;
      thumb = { url: uploadUrlForAttachment(att), badge: order ? String(order) : '',
        title: order ? `Picture ${order}: ${name}` : name, removeTitle: 'Remove this image' };
    } else if (att.mediaType === 'video') {
      icon = '\u{1F3AC}';
      thumb = { url: (att.frameUrls && att.frameUrls[0]) || '', kind: '▶',
        title: `Video: ${name}`, removeTitle: 'Remove this video' };
    } else if (att.mediaType === 'audio') icon = '\u{1F3B5}';
    else if (att.mediaType === 'text') icon = '\u{1F4DD}';
    else if (att.mediaType === 'pdf' && att.renderedAsImages) {
      let pages = '';
      if (Number.isInteger(att.extractedPageCount) && Number.isInteger(att.pageCount)) {
        pages = `${att.extractedPageCount}/${att.pageCount}`;
        label = `${name} (${pages} pages)`;
      }
      // The bare count fits the badge up to 999/999; a "PDF " prefix would cut off
      // any two-digit count.
      thumb = { url: (att.frameUrls && att.frameUrls[0]) || '', kind: 'PDF', badge: pages,
        title: `Scanned PDF: ${label}`, removeTitle: 'Remove this PDF', page: true };
    }
    const chip = () => buildAttachmentChip(icon, label, idx, name);
    const selectableImage = att.mediaType === 'image' && isQwenImageModel();
    const attachmentHost = selectableImage ? document.createElement('div') : attachmentsDiv;
    if (selectableImage) {
      attachmentHost.className = 'image-edit-attachment' + (imageNum === 1 ? ' editing-target' : '');
      attachmentHost.dataset.file = att.file;
      attachmentHost.setAttribute('role', 'group');
      attachmentHost.setAttribute('aria-label', 'Picture ' + imageNum + ': ' + name);
      attachmentsDiv.appendChild(attachmentHost);
    }
    attachmentHost.appendChild(thumb && thumb.url && !att.thumbFailed
      ? buildAttachmentThumb(att, idx, name, thumb, chip)
      : chip());
    if (selectableImage) {
      const controls = document.createElement('div');
      controls.className = 'image-selection-controls';
      const role = document.createElement('span');
      role.className = 'image-selection-role';
      role.textContent = imageNum === 1 ? 'Editing target' : 'Reference';
      controls.appendChild(role);
      const select = document.createElement('button');
      select.type = 'button';
      select.className = 'image-selection-button';
      select.textContent = att.maskPath ? 'Edit selection' : 'Select area';
      select.title = 'Save a selection to make this photo the editing target';
      select.addEventListener('click', () => selectImageArea(att));
      controls.appendChild(select);
      if (att.maskPath) {
        const status = document.createElement('span');
        status.className = 'image-selection-status';
        status.textContent = att === activeImageEditTarget ? 'Outside selection protected' : 'Selection saved';
        controls.appendChild(status);
      }
      attachmentHost.appendChild(controls);
    }
  });
  if (focusSlot >= 0) {
    const removes = attachmentsDiv.querySelectorAll('.remove');
    (removes[Math.min(focusSlot, removes.length - 1)] || messageInput).focus();
  }
}

function buildAttachmentChip(icon, label, idx, name) {
  const chip = document.createElement('div');
  chip.className = 'attachment-chip';
  const text = document.createElement('span');
  text.className = 'label';
  text.textContent = icon + ' ' + label;
  text.title = label;
  chip.appendChild(text);
  chip.appendChild(buildAttachmentRemove(idx, name, 'Remove this attachment'));
  return chip;
}

function buildAttachmentRemove(idx, name, title) {
  const remove = document.createElement('button');
  remove.type = 'button';
  remove.className = 'remove';
  remove.textContent = '×';
  remove.title = title;
  remove.setAttribute('aria-label', 'Remove ' + name);
  remove.addEventListener('click', () => removeAttachment(idx));
  return remove;
}

// thumb is renderAttachments' { url, kind, badge, title, removeTitle, page } and
// chip builds the chip this tile stands in for.
function buildAttachmentThumb(att, idx, name, thumb, chip) {
  const tile = document.createElement('div');
  tile.className = thumb.page ? 'attachment-thumb page' : 'attachment-thumb';
  tile.title = thumb.title;
  const img = document.createElement('img');
  img.alt = thumb.title;
  // An image that does not load (a HEIC whose server-side PNG preview failed,
  // outside Safari, or a frame or page image that is gone) falls back to the name
  // chip instead of an empty tile, and is remembered so later re-renders neither
  // refetch it nor flash a tile.
  img.addEventListener('error', () => {
    att.thumbFailed = true;
    tile.replaceWith(chip());
  }, { once: true });
  img.src = thumb.url;
  tile.appendChild(img);
  // The marks repeat what the alt text already says, so they are hidden from screen readers.
  for (const [cls, text] of [['kind', thumb.kind], ['badge', thumb.badge]]) {
    if (!text) continue;
    const mark = document.createElement('span');
    mark.className = cls;
    mark.textContent = text;
    mark.setAttribute('aria-hidden', 'true');
    tile.appendChild(mark);
  }
  tile.appendChild(buildAttachmentRemove(idx, name, thumb.removeTitle));
  return tile;
}

function removeAttachment(idx) {
  if (pendingAttachments[idx] === activeImageEditTarget) activeImageEditTarget = null;
  pendingAttachments.splice(idx, 1);
  renderAttachments();
}

function isQwenImageModel() {
  return currentArchitecture === 'qwen_image' || currentArchitecture === 'qwen-image';
}

async function selectImageArea(att) {
  if (isGenerating || pendingUploadCount) return;
  pendingUploadCount++;
  try {
    if (att.editUnavailableReason) throw new Error(att.editUnavailableReason);
    if (/\.(heic|heif)$/i.test(att.file || att.fileName || '') && !att.editUrl)
      throw new Error('Reattach this photo to prepare a full-resolution image for area selection.');
    const selection = await TensorSharpMaskEditor.open({
      sourceUrl: att.editUrl || uploadUrlForAttachment(att),
      maskUrl: att.maskPath ? uploadUrlForAttachment({ file: att.maskPath }) : null,
      maskFeather: att.maskFeather || 0, maskCrop: !!att.maskCrop
    });
    if (!selection || !pendingAttachments.includes(att)) return;
    if (selection.remove) {
      delete att.maskPath; delete att.maskFeather; delete att.maskCrop;
      if (att === activeImageEditTarget) activeImageEditTarget = null;
    } else {
      const form = new FormData();
      form.append('file', selection.blob, 'selection.png');
      const response = await fetch('/api/upload', { method: 'POST', body: form });
      const uploaded = await response.json();
      if (!response.ok || !uploaded.ok || !uploaded.file) throw new Error(uploaded.error || 'Selection upload failed');
      if (!pendingAttachments.includes(att)) return;
      att.maskPath = uploaded.file;
      att.maskFeather = selection.maskFeather;
      att.maskCrop = selection.maskCrop;
      // Commit the source change only after its mask is uploaded. Other saved
      // selections stay with their photos; only the first photo's mask is sent.
      const targetIndex = pendingAttachments.indexOf(att);
      pendingAttachments.splice(targetIndex, 1);
      pendingAttachments.unshift(att);
      activeImageEditTarget = att;
    }
    renderAttachments();
    messageInput.focus();
  } catch (error) {
    alert('Selection error: ' + error.message);
  } finally {
    pendingUploadCount--;
  }
}

// ---- Agent Skills --------------------------------------------------------
// Every string below (skill name, description, file path, warning, load error)
// comes from SKILL.md frontmatter or from a filename inside an uploaded ZIP, so
// it is attacker-controlled: these renderers build nodes and assign textContent
// instead of interpolating into innerHTML.

function skillNameOf(sk) {
  if (!sk) return '';
  if (typeof sk.name === 'string' && sk.name) return sk.name;
  if (typeof sk.id === 'string' && sk.id) return sk.id;
  return '';
}

function formatSkillBytes(n) {
  if (typeof n !== 'number' || !isFinite(n) || n < 0) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

// Both error shapes the server can produce: {"error":"..."} outside /v1, and
// {"error":{"message":"..."}} under it.
function skillsRequestError(res, data) {
  if (data && typeof data.error === 'string' && data.error) return data.error;
  if (data && data.error && typeof data.error.message === 'string' && data.error.message) return data.error.message;
  return 'HTTP ' + (res ? res.status : '?');
}

function updateSkillsControl() {
  const pill = document.getElementById('skills-pill');
  if (!pill) return;
  const enabled = !!(currentSkillsCaps && currentSkillsCaps.enabled);
  if (!enabled) {
    pill.style.display = 'none';
    if (selectedSkills.length > 0) {
      // The server no longer offers skills, so a stale selection would keep
      // changing the system prompt for a feature that is gone.
      selectedSkills = [];
      needsCacheReset = true;
      renderSkillChips();
    }
    return;
  }
  pill.style.display = '';
  pill.textContent = selectedSkills.length > 0
    ? '\u{1F9E9} Skills: ' + selectedSkills.length
    : '\u{1F9E9} Skills';
  const count = typeof currentSkillsCaps.count === 'number' ? currentSkillsCaps.count : null;
  pill.title = count === null
    ? 'Agent Skills the model can use'
    : count + (count === 1 ? ' skill' : ' skills') + ' available to the model';
}

function renderSkillChips() {
  const host = document.getElementById('skill-chips');
  if (!host) return;
  host.innerHTML = '';
  selectedSkills.forEach((name, idx) => {
    const chip = document.createElement('div');
    chip.className = 'attachment-chip';
    const label = document.createElement('span');
    label.textContent = '\u{1F9E9} ' + name;
    chip.appendChild(label);
    const remove = document.createElement('span');
    remove.className = 'remove';
    remove.textContent = '×';
    remove.title = 'Remove this skill';
    remove.setAttribute('onclick', 'removeSelectedSkill(' + idx + ')');
    chip.appendChild(remove);
    host.appendChild(chip);
  });
}

function setSelectedSkills(names) {
  const unique = [];
  (Array.isArray(names) ? names : []).forEach(n => {
    const name = String(n == null ? '' : n);
    if (name && unique.indexOf(name) === -1) unique.push(name);
  });
  const changed = unique.length !== selectedSkills.length
    || unique.some((n, i) => n !== selectedSkills[i]);
  selectedSkills = unique;
  if (changed) {
    // The selection is rendered into the leading system message, so changing it
    // changes the prompt prefix: the same invalidation class as an edit or a
    // revert. Without this the server would silently reuse a mismatched KV cache.
    needsCacheReset = true;
  }
  renderSkillChips();
  updateSkillsControl();
}

function removeSelectedSkill(idx) {
  const next = selectedSkills.slice();
  next.splice(idx, 1);
  setSelectedSkills(next);
}

function openSkillsModal() {
  pendingSkillSelection = selectedSkills.slice();
  const overlay = document.getElementById('skills-modal');
  if (overlay) overlay.classList.add('visible');
  setSkillsNotice('');
  loadSkillsRoster();
}

function closeSkillsModal() {
  const overlay = document.getElementById('skills-modal');
  if (overlay) overlay.classList.remove('visible');
  pendingSkillSelection = null;
}

function onSkillsOverlayClick(event) {
  // Backdrop only: a click inside the dialog bubbles up here too.
  if (event && event.target && event.target.id === 'skills-modal') closeSkillsModal();
}

function applySkillsModal() {
  setSelectedSkills(Array.isArray(pendingSkillSelection) ? pendingSkillSelection : selectedSkills);
  closeSkillsModal();
}

function setSkillsNotice(text) {
  const el = document.getElementById('skills-notice');
  if (!el) return;
  el.textContent = text || '';
  el.style.display = text ? '' : 'none';
}

function toggleSkillSelection(idx, checked) {
  const name = skillNameOf(skillsRoster[idx]);
  if (!name) return;
  if (!Array.isArray(pendingSkillSelection)) pendingSkillSelection = selectedSkills.slice();
  const at = pendingSkillSelection.indexOf(name);
  if (checked && at === -1) pendingSkillSelection.push(name);
  else if (!checked && at !== -1) pendingSkillSelection.splice(at, 1);
}

function setSkillsListMessage(text) {
  const listEl = document.getElementById('skills-list');
  if (!listEl) return;
  listEl.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'skill-row';
  const body = document.createElement('div');
  body.className = 'skill-row-body';
  const msg = document.createElement('div');
  msg.className = 'skill-desc';
  msg.textContent = text;
  body.appendChild(msg);
  row.appendChild(body);
  listEl.appendChild(row);
}

async function loadSkillsRoster() {
  setSkillsListMessage('Loading skills…');
  try {
    const res = await fetch('/api/skills');
    let data = null;
    try { data = await res.json(); } catch {}
    if (!res.ok) {
      skillsRoster = [];
      skillsErrors = [];
      skillsInstallable = false;
      setSkillsNotice('Could not load skills: ' + skillsRequestError(res, data));
    } else {
      skillsRoster = (data && Array.isArray(data.skills)) ? data.skills : [];
      skillsErrors = (data && Array.isArray(data.errors)) ? data.errors : [];
      skillsInstallable = !!(data && data.installable);
      if (data && data.enabled === false) setSkillsNotice('Skills are disabled on this server.');
    }
  } catch (e) {
    skillsRoster = [];
    skillsErrors = [];
    skillsInstallable = false;
    setSkillsNotice('Could not load skills: ' + (e && e.message ? e.message : e));
  }
  renderSkillsModal();
}

function renderSkillsModal() {
  const toolbar = document.getElementById('skills-toolbar');
  if (toolbar) toolbar.style.display = skillsInstallable ? '' : 'none';
  renderSkillsErrors();

  const listEl = document.getElementById('skills-list');
  if (!listEl) return;
  if (skillsRoster.length === 0) {
    setSkillsListMessage(skillsInstallable
      ? 'No skills found. Install a .zip package to add one.'
      : 'No skills found. Start the server with --skills-dir <path>.');
    return;
  }

  const selected = Array.isArray(pendingSkillSelection) ? pendingSkillSelection : selectedSkills;
  listEl.innerHTML = '';
  skillsRoster.forEach((sk, idx) => listEl.appendChild(buildSkillRow(sk, idx, selected)));
}

function buildSkillRow(sk, idx, selected) {
  const name = skillNameOf(sk);
  const row = document.createElement('div');
  row.className = 'skill-row';

  const checkId = 'skill-check-' + idx;
  const check = document.createElement('input');
  check.type = 'checkbox';
  check.id = checkId;
  check.checked = !!name && selected.indexOf(name) !== -1;
  check.disabled = !name;
  check.setAttribute('onchange', 'toggleSkillSelection(' + idx + ', this.checked)');
  row.appendChild(check);

  const body = document.createElement('div');
  body.className = 'skill-row-body';

  const label = document.createElement('label');
  label.className = 'skill-name';
  label.htmlFor = checkId;
  label.textContent = name || '(unnamed skill)';
  const origin = typeof (sk && sk.origin) === 'string' ? sk.origin : '';
  if (origin) {
    const badge = document.createElement('span');
    badge.className = 'skill-origin';
    badge.textContent = origin;
    label.appendChild(badge);
  }
  body.appendChild(label);

  const description = (sk && typeof sk.description === 'string') ? sk.description : '';
  if (description) {
    const desc = document.createElement('div');
    desc.className = 'skill-desc';
    desc.textContent = description;
    desc.title = description;   // clamped to two lines, so keep the full text here
    body.appendChild(desc);
  }

  const metaParts = [];
  const fileCount = (sk && Array.isArray(sk.files)) ? sk.files.length : 0;
  metaParts.push(fileCount + (fileCount === 1 ? ' file' : ' files'));
  const size = formatSkillBytes(sk && sk.bytes);
  if (size) metaParts.push(size);
  if (sk && typeof sk.compatibility === 'string' && sk.compatibility) metaParts.push(sk.compatibility);
  if (sk && typeof sk.license === 'string' && sk.license) metaParts.push(sk.license);
  const meta = document.createElement('div');
  meta.className = 'skill-meta';
  meta.textContent = metaParts.join(' · ');
  body.appendChild(meta);

  const warnings = (sk && Array.isArray(sk.warnings)) ? sk.warnings : [];
  warnings.forEach(w => {
    const warn = document.createElement('div');
    warn.className = 'skill-warning';
    warn.textContent = '⚠ ' + String(w == null ? '' : w);
    body.appendChild(warn);
  });

  row.appendChild(body);

  if (origin === 'installed' && name) {
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'skill-delete';
    del.textContent = '×';
    del.title = 'Delete this installed skill';
    del.setAttribute('onclick', 'deleteSkill(' + idx + ')');
    row.appendChild(del);
  }

  return row;
}

function renderSkillsErrors() {
  const box = document.getElementById('skills-errors');
  if (!box) return;
  box.innerHTML = '';
  if (skillsErrors.length === 0) {
    box.style.display = 'none';
    return;
  }
  const title = document.createElement('div');
  title.className = 'skills-error-title';
  title.textContent = skillsErrors.length + (skillsErrors.length === 1
    ? ' skill failed to load'
    : ' skills failed to load');
  box.appendChild(title);
  skillsErrors.forEach(err => {
    const line = document.createElement('div');
    line.className = 'skills-error-row';
    const path = String((err && err.path) || '');
    const message = String((err && err.message) || '');
    line.textContent = path ? path + ': ' + message : message;
    box.appendChild(line);
  });
  box.style.display = '';
}

function handleSkillZipSelect(event) {
  const input = event && event.target;
  if (!input) return;
  const files = Array.from(input.files || []);
  input.value = '';
  if (files.length > 0) uploadSkillZip(files[0]);
}

async function uploadSkillZip(file) {
  setSkillsNotice('Installing ' + file.name + '…');
  const formData = new FormData();
  formData.append('file', file);
  const overwrite = document.getElementById('skill-overwrite');
  if (overwrite && overwrite.checked) formData.append('overwrite', 'true');

  try {
    const res = await fetch('/api/skills', { method: 'POST', body: formData });
    let data = null;
    try { data = await res.json(); } catch {}
    if (!res.ok) setSkillsNotice('Install failed: ' + skillsRequestError(res, data));
    else setSkillsNotice('Installed ' + (skillNameOf(data) || file.name) + '.');
  } catch (e) {
    setSkillsNotice('Install failed: ' + (e && e.message ? e.message : e));
  }
  await loadSkillsRoster();
}

async function deleteSkill(idx) {
  const name = skillNameOf(skillsRoster[idx]);
  if (!name) return;
  if (!confirm('Delete the installed skill "' + name + '"? Its files are removed from the server.')) return;

  try {
    const res = await fetch('/api/skills/' + encodeURIComponent(name), { method: 'DELETE' });
    let data = null;
    try { data = await res.json(); } catch {}
    if (!res.ok) {
      setSkillsNotice('Delete failed: ' + skillsRequestError(res, data));
    } else {
      setSkillsNotice('Deleted ' + name + '.');
      if (Array.isArray(pendingSkillSelection)) {
        pendingSkillSelection = pendingSkillSelection.filter(n => n !== name);
      }
      if (selectedSkills.indexOf(name) !== -1) {
        setSelectedSkills(selectedSkills.filter(n => n !== name));
      }
    }
  } catch (e) {
    setSkillsNotice('Delete failed: ' + (e && e.message ? e.message : e));
  }
  await loadSkillsRoster();
}

// The WebUX intentionally has no completed-operation transcript. It owns one
// replace-in-place panel for the operation running now, then removes the panel
// on `finished`, `done`, cancellation, failure, or a closed stream. While waiting,
// the user can expand a live snapshot of the request's sub-agents.
function ensureCurrentActivity(assistDiv) {
  let block = assistDiv.querySelector('.current-activity');
  if (block) return block;

  const bubbleText = assistDiv.querySelector('.bubble-text');
  const bubble = assistDiv.querySelector('.bubble');
  if (!bubbleText && !bubble) return null;

  block = document.createElement('div');
  block.className = 'current-activity';

  const header = document.createElement('div');
  header.className = 'current-activity-header';
  const spinner = document.createElement('span');
  spinner.className = 'current-activity-spinner';
  const status = document.createElement('span');
  status.className = 'current-activity-status';
  header.appendChild(spinner);
  header.appendChild(status);

  const detail = document.createElement('pre');
  detail.className = 'current-activity-detail';
  block.appendChild(header);
  block.appendChild(detail);

  const agents = document.createElement('details');
  agents.className = 'current-agent-details';
  agents.hidden = true;
  agents.open = !!assistDiv._agentDetailsOpen;
  agents.addEventListener('toggle', () => {
    // Remember the user's choice across consecutive waits within this reply.
    if (agents.isConnected) assistDiv._agentDetailsOpen = agents.open;
  });
  const summary = document.createElement('summary');
  summary.className = 'current-agent-summary';
  const list = document.createElement('div');
  list.className = 'current-agent-list';
  list.setAttribute('role', 'list');
  agents.appendChild(summary);
  agents.appendChild(list);
  block.appendChild(agents);

  // Before the reply text, i.e. after any reasoning block already sitting there.
  if (bubbleText && bubbleText.parentNode) bubbleText.parentNode.insertBefore(block, bubbleText);
  else bubble.appendChild(block);
  return block;
}

function clearCurrentActivity(assistDiv) {
  const block = assistDiv && assistDiv.querySelector('.current-activity');
  if (block) {
    // Native toggle events are queued; a finished frame can arrive first.
    assistDiv._agentDetailsOpen = block.querySelector('.current-agent-details').open;
    block.remove();
  }
}

function activityLabel(tool, phase) {
  const writing = phase === 'writing';
  switch (tool) {
    case 'shell':       return writing ? 'Generating code…' : 'Running code…';
    case 'apply_patch': return writing ? 'Generating patch…' : 'Applying patch…';
    case 'read_file':   return writing ? 'Preparing file read…' : 'Reading file…';
    case 'edit_file':   return writing ? 'Preparing file edit…' : 'Editing file…';
    case 'write_file':  return writing ? 'Generating file…' : 'Writing file…';
    case 'skills_list': return writing ? 'Preparing skill lookup…' : 'Checking skills…';
    case 'skills_read': return writing ? 'Preparing skill read…' : 'Reading skill file…';
    case 'skills_run':  return writing ? 'Preparing skill run…' : 'Running skill…';
    case 'wait_agent':  return writing ? 'Preparing to wait for sub-agents…' : 'Waiting for sub-agents…';
    default: {
      const name = tool ? String(tool).replace(/_/g, ' ') : 'operation';
      return (writing ? 'Preparing ' : 'Running ') + name + '…';
    }
  }
}

// Make a tool-call draft readable: Gemma frames string arguments with <|"|>,
// and a JSON-shaped body (Qwen) carries the program with escaped newlines.
// Display-only cleanup — nothing here is ever parsed or sent back.
function cleanToolDraft(raw) {
  let text = raw.replace(/<\|"\|>/g, '"');
  if (text.trimStart().startsWith('{'))
    text = text.replace(/\\n/g, '\n').replace(/\\t/g, '\t').replace(/\\"/g, '"');
  return text;
}

// Update the existing disclosure and cards in place so streaming frames preserve
// keyboard focus, expansion, text selection, and the user's scroll position.
function updateAgentProgress(block, agents) {
  const disclosure = block.querySelector('.current-agent-details');
  const summary = disclosure.querySelector('.current-agent-summary');
  const list = disclosure.querySelector('.current-agent-list');
  const snapshot = Array.isArray(agents) ? agents.slice(0, 128) : [];
  const cards = block._agentCards || (block._agentCards = new Map());
  const seen = new Set();
  const scrollTop = list.scrollTop;
  const setText = (node, value) => {
    if (node.textContent !== value) node.textContent = value;
  };
  const bounded = (value, limit) => {
    const text = value == null ? '' : String(value);
    return text.length > limit ? text.slice(0, limit) + '…' : text;
  };

  for (const agent of snapshot) {
    if (!agent || typeof agent.agent_id !== 'string' || seen.has(agent.agent_id)) continue;
    seen.add(agent.agent_id);
    let card = cards.get(agent.agent_id);
    if (!card) {
      card = document.createElement('div');
      card.className = 'current-agent-card';
      card.setAttribute('role', 'listitem');
      card._fields = {};
      for (const field of ['name', 'state', 'task', 'tool', 'result', 'error']) {
        const node = document.createElement('div');
        node.className = 'current-agent-' + field;
        card._fields[field] = node;
        card.appendChild(node);
      }
      cards.set(agent.agent_id, card);
      list.appendChild(card);
    }
    const fields = card._fields;
    setText(fields.name, bounded(agent.agent_id, 300));
    const status = bounded(agent.status || 'unknown', 40).replace(/_/g, ' ');
    setText(fields.state, [bounded(agent.agent_type, 40), status].filter(Boolean).join(' · '));
    setText(fields.task, agent.task ? 'Task: ' + bounded(agent.task, 4000) : '');
    const toolStatus = agent.tool_status ? ' (' + bounded(agent.tool_status, 40).replace(/_/g, ' ') + ')' : '';
    setText(fields.tool, agent.tool
      ? 'Tool: ' + bounded(agent.tool, 100) + toolStatus + (agent.detail ? '\n' + bounded(agent.detail, 1000) : '')
      : (status === 'running' ? 'Working on the task…' : ''));
    setText(fields.result, agent.result ? 'Result: ' + bounded(agent.result, 4000) : '');
    setText(fields.error, agent.error ? 'Error: ' + bounded(agent.error, 1000) : '');
    for (const node of Object.values(fields)) node.hidden = !node.textContent;
  }
  for (const [id, card] of cards) {
    if (!seen.has(id)) {
      card.remove();
      cards.delete(id);
    }
  }
  let empty = disclosure.querySelector('.current-agent-empty');
  if (cards.size === 0) {
    if (!empty) {
      empty = document.createElement('div');
      empty.className = 'current-agent-empty';
      disclosure.appendChild(empty);
    }
    setText(empty, Array.isArray(agents)
      ? 'No sub-agents to show yet.'
      : 'Sub-agent details are not available from this server.');
  } else if (empty) empty.remove();
  setText(summary, 'wait_agent · ' + cards.size + (cards.size === 1 ? ' sub-agent' : ' sub-agents'));
  list.scrollTop = scrollTop;
}

// Live progress while the model writes a tool call and while the host runs it.
// Only a bounded tail for the CURRENT phase is retained. Moving from generation
// to execution replaces the draft with current runtime output; finishing removes
// all activity UI instead of turning it into a historical trace.
function updateToolProgress(assistDiv, data) {
  const phase = String(data.tool_progress || '');
  if (phase === 'finished') {
    clearCurrentActivity(assistDiv);
    return;
  }
  if (phase !== 'writing' && phase !== 'running') return;

  const block = ensureCurrentActivity(assistDiv);
  if (!block) return;
  const status = block.querySelector('.current-activity-status');
  const detail = block.querySelector('.current-activity-detail');
  const incomingTool = data.tool ? String(data.tool) : '';
  const tool = incomingTool || block._tool || '';
  const changedTool = !!(incomingTool && block._tool && incomingTool !== block._tool);
  const changedPhase = block._phase !== phase;

  if (changedTool || changedPhase) {
    block._rawDraft = '';
    block._runOutput = '';
    detail.textContent = '';
  }
  block._phase = phase;
  block._tool = tool;
  const waitingForAgents = phase === 'running' && tool === 'wait_agent';
  block.querySelector('.current-agent-details').hidden = !waitingForAgents;

  if (phase === 'writing') {
    // This short-lived buffer exists only to turn escaped JSON/code deltas into
    // a readable tail. Bound it, and discard it at the next phase transition.
    block._rawDraft = ((block._rawDraft || '') + (data.text ? String(data.text) : '')).slice(-8000);
    const cleaned = cleanToolDraft(block._rawDraft);

    // Follow the last few lines being generated, like a small tail -f.
    let tail = cleaned.slice(-400);
    const firstBreak = tail.indexOf('\n');
    if (firstBreak > 0 && firstBreak < tail.length - 1) tail = tail.slice(firstBreak + 1);
    detail.textContent = tail;
    detail.style.display = tail ? '' : 'none';
    detail.scrollTop = detail.scrollHeight;
    if (status) {
      const size = formatArtifactBytes(block._rawDraft.length);
      status.textContent = activityLabel(tool, phase) + (size ? ' ' + size : '');
    }
  } else {
    const secs = Math.round(Number(data.seconds) || 0);
    const what = data.detail ? String(data.detail) : (tool || 'operation');
    if (status) status.textContent = activityLabel(tool, phase) + (secs > 0 ? ' ' + secs + 's' : '');

    if (waitingForAgents) {
      detail.style.display = 'none';
      updateAgentProgress(block, data.agents);
      return;
    }

    // Show only the current operation's short stdout/stderr tail. Long-lived
    // diagnostic history is intentionally not kept in the browser.
    if (data.text) {
      block._runOutput = ((block._runOutput || '') + String(data.text)).slice(-4000);
    }
    const outTail = (block._runOutput || '').split('\n').slice(-6).join('\n').trimEnd();
    detail.textContent = '⏵ ' + what
      + (outTail ? '\n' + outTail : '');
    detail.style.display = '';
    detail.scrollTop = detail.scrollHeight;
  }
}

// Only this server's own artifact routes become hrefs; anything else in a frame
// or in model prose stays inert text.
const ARTIFACT_URL_PREFIX = '/api/code/artifacts/';

function formatArtifactBytes(bytes) {
  if (typeof bytes !== 'number' || !isFinite(bytes) || bytes < 0) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// Download chips for the files a shell command produced. Deliberately fed by the
// skill_step SSE frame, not by the model's answer: the file must be reachable
// even when the model forgets (or garbles) the link.
function appendArtifactFiles(assistDiv, files) {
  const bubble = assistDiv.querySelector('.bubble');
  if (!bubble) return;
  let box = assistDiv.querySelector('.artifact-files');
  if (!box) {
    box = document.createElement('div');
    box.className = 'artifact-files';
    bubble.appendChild(box);
  }
  files.forEach(f => {
    const url = String((f && f.url) || '');
    if (!url.startsWith(ARTIFACT_URL_PREFIX)) return;
    // One chip per file NAME. Every run publishes under its own URL, so a program the
    // model ran three times used to leave three chips for one file; the latest run's
    // copy is the one to offer.
    const name = String((f && f.name) || url.split('/').pop());
    let a = Array.from(box.querySelectorAll('a')).find(x => x.dataset.name === name);
    if (!a) {
      a = document.createElement('a');
      a.dataset.name = name;
      a.setAttribute('download', '');
      box.appendChild(a);
    }
    a.href = url;
    a.textContent = '⭳ ' + name;
    const size = formatArtifactBytes(f && f.bytes);
    if (size) {
      const span = document.createElement('span');
      span.className = 'artifact-size';
      span.textContent = size;
      a.appendChild(span);
    }
  });
}

// ---- Markdown ---------------------------------------------------------------
// Models answer in Markdown, and this page used to print it raw: a table arrived as
// rows of pipes, a heading with its hashes. renderMarkdown draws the subset chat
// answers use -- fenced and inline code, headings, bold, italic, strikethrough,
// links, bullet and numbered lists (nested by indentation), block quotes, rules and
// GitHub-style tables. It builds DOM nodes and never uses innerHTML: every character
// the model wrote reaches the page in a text node, so a reply that contains HTML
// shows that HTML as text. A link keeps its href only when that is http(s), mailto
// or this server's artifact route, and only an artifact becomes an <img>: an image
// from anywhere else would be fetched the moment the answer rendered.
const MD_FENCE = /^ {0,3}(`{3,}|~{3,})[ \t]*([\w+#.-]*)/;
const MD_HEADING = /^ {0,3}(#{1,6})[ \t]+(.*?)(?:[ \t]+#+)?[ \t]*$/;
const MD_RULE = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
const MD_QUOTE = /^ {0,3}>[ ]?(.*)$/;
const MD_ITEM = /^([ \t]*)([-*+]|\d{1,9}[.)])[ \t]+(.*)$/;
const MD_TABLE_RULE = /^[ \t]*\|?[ \t]*:?-+:?[ \t]*(\|[ \t]*:?-+:?[ \t]*)*\|?[ \t]*$/;
const MD_LINK_OK = /^(https?:\/\/|mailto:)/i;
const MD_IMAGE_FILE = /\.(png|jpe?g|gif|webp|svg)$/i;

function renderMarkdown(el, text) {
  const root = document.createDocumentFragment();
  mdBlocks(String(text == null ? '' : text).replace(/\r\n?/g, '\n').split('\n'), root);
  el.replaceChildren(root);
  el.classList.add('md');
}

function mdNode(tag, parent) {
  const node = document.createElement(tag);
  parent.appendChild(node);
  return node;
}

function mdBlocks(lines, parent) {
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if (!line.trim()) {
      i++;
    } else if ((m = MD_FENCE.exec(line))) {
      i = mdFence(lines, i, m, parent, 0);
    } else if ((m = MD_HEADING.exec(line))) {
      mdInline(m[2], mdNode('h' + m[1].length, parent));
      i++;
    } else if (MD_RULE.test(line)) {
      mdNode('hr', parent);
      i++;
    } else if (MD_QUOTE.test(line)) {
      const quoted = [];
      while (i < lines.length && (m = MD_QUOTE.exec(lines[i]))) { quoted.push(m[1]); i++; }
      mdBlocks(quoted, mdNode('blockquote', parent));
    } else if (MD_ITEM.test(line)) {
      i = mdList(lines, i, parent);
    } else if (mdTableAt(lines, i)) {
      i = mdTable(lines, i, parent);
    } else {
      // A paragraph: its lines keep their breaks, and it ends where another block starts.
      const p = mdNode('p', parent);
      mdInline(line.trim(), p);
      for (i++; i < lines.length && lines[i].trim() && !mdStartsBlock(lines, i); i++) {
        mdNode('br', p);
        mdInline(lines[i].trim(), p);
      }
    }
  }
}

function mdStartsBlock(lines, i) {
  const line = lines[i];
  return MD_FENCE.test(line) || MD_HEADING.test(line) || MD_RULE.test(line)
    || MD_QUOTE.test(line) || MD_ITEM.test(line) || mdTableAt(lines, i);
}

// Up to the closing fence, or to the end while a reply is still streaming. `indent`
// is how far a fence inside a list item is indented; its lines lose that much.
function mdFence(lines, i, m, parent, indent) {
  const close = new RegExp('^[ \\t]*' + (m[1][0] === '`' ? '`' : '~') + '{' + m[1].length + ',}[ \\t]*$');
  const body = [];
  for (i++; i < lines.length && !close.test(lines[i]); i++) {
    const line = lines[i];
    body.push(line.slice(Math.min(indent, line.length - line.trimStart().length)));
  }
  const code = mdNode('code', mdNode('pre', parent));
  if (m[2]) code.className = 'language-' + m[2];
  code.textContent = body.join('\n');
  return i + 1;
}

// A GitHub table needs a header row and a delimiter row with the same cell count.
function mdTableAt(lines, i) {
  if (i + 1 >= lines.length || !lines[i].includes('|')) return false;
  const rule = lines[i + 1];
  return rule.includes('-') && MD_TABLE_RULE.test(rule)
    && mdCells(lines[i]).length === mdCells(rule).length;
}

function mdCells(row) {
  let s = row.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
  const cells = [];
  let cell = '', inCode = false;
  for (let k = 0; k < s.length; k++) {
    const ch = s[k];
    if (ch === '\\' && s[k + 1] === '|') { cell += '|'; k++; continue; }
    if (ch === '`') inCode = !inCode;
    if (ch === '|' && !inCode) { cells.push(cell.trim()); cell = ''; continue; }
    cell += ch;
  }
  cells.push(cell.trim());
  return cells;
}

function mdTable(lines, i, parent) {
  const head = mdCells(lines[i]);
  const align = mdCells(lines[i + 1]).map(c =>
    /^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : /^:-/.test(c) ? 'left' : '');
  const wrap = mdNode('div', parent);
  wrap.className = 'md-table';
  const table = mdNode('table', wrap);
  const row = (cells, tag, section) => {
    const tr = mdNode('tr', section);
    head.forEach((_, k) => {
      const cell = mdNode(tag, tr);
      if (align[k]) cell.style.textAlign = align[k];
      mdInline(cells[k] || '', cell);
    });
  };
  row(head, 'th', mdNode('thead', table));
  const body = mdNode('tbody', table);
  for (i += 2; i < lines.length && lines[i].trim() && lines[i].includes('|'); i++)
    row(mdCells(lines[i]), 'td', body);
  return i;
}

// Nesting follows indentation. A blank line does not end a list when the next line
// continues it, and an indented line adds to the deepest open item.
function mdList(lines, i, parent) {
  const stack = [];   // { indent, ordered, list, li }, deepest last
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) {
      let j = i + 1;
      while (j < lines.length && !lines[j].trim()) j++;
      if (j < lines.length && (MD_ITEM.test(lines[j]) || /^[ \t]{2,}\S/.test(lines[j]))) { i = j; continue; }
      break;
    }
    const m = MD_ITEM.exec(line);
    if (m && !MD_RULE.test(line)) {
      const indent = m[1].replace(/\t/g, '    ').length;
      const ordered = /\d/.test(m[2]);
      while (stack.length && indent < stack[stack.length - 1].indent) stack.pop();
      let top = stack[stack.length - 1];
      if (!top || indent > top.indent || top.ordered !== ordered) {
        if (top && indent === top.indent) stack.pop();   // same depth, other kind: a new list
        const host = stack.length ? stack[stack.length - 1].li : parent;
        const list = mdNode(ordered ? 'ol' : 'ul', host);
        const start = parseInt(m[2], 10);
        if (ordered && start !== 1) list.start = start;
        top = { indent, ordered, list, li: null };
        stack.push(top);
      }
      top.li = mdNode('li', top.list);
      mdInline(m[3], top.li);
      i++;
      continue;
    }
    if (!stack.length || !/^[ \t]+\S/.test(line)) break;   // an unindented line ends the list
    const li = stack[stack.length - 1].li;
    const fence = MD_FENCE.exec(line.trimStart());
    if (fence) {
      i = mdFence(lines, i, fence, li, line.length - line.trimStart().length);
    } else {
      mdNode('br', li);
      mdInline(line.trim(), li);
      i++;
    }
  }
  return i;
}

// A bare URL at the end of a sentence drags its punctuation along. Returns how much
// of the match the URL really is.
function mdUrlLength(url) {
  let end = url.replace(/[.,;:!?'"]+$/, '').length;
