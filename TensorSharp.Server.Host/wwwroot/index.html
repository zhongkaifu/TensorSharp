  if (url[end - 1] === ')' && (url.slice(0, end).match(/\(/g) || []).length
      < (url.slice(0, end).match(/\)/g) || []).length) end--;
  return end;
}

function mdArtifact(host, url, label) {
  const a = mdNode('a', host);
  a.className = 'artifact-link';
  a.href = url;
  a.setAttribute('download', '');
  a.textContent = label || url.split('/').pop();
}

function mdLink(host, url, label, isImage, raw) {
  if (url.startsWith(ARTIFACT_URL_PREFIX)) {
    if (isImage && MD_IMAGE_FILE.test(url)) {
      const a = mdNode('a', host);
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
      const img = mdNode('img', a);
      img.src = url;
      img.alt = label;
      img.loading = 'lazy';
    } else {
      mdArtifact(host, url, label);
    }
  } else if (MD_LINK_OK.test(url)) {
    const a = mdNode('a', host);
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    mdInline(label, a);
  } else {
    host.appendChild(document.createTextNode(raw));
  }
}

// [pattern, build]; the earliest match wins, and on a tie the rule listed first.
// A build may return how much of its match it used.
const MD_INLINE = [
  [/(`+)(?!`)([\s\S]*?[^`])\1(?!`)/, (m, host) => {
    // A backticked artifact path is still a download link.
    const body = m[2].trim();
    if (body.startsWith(ARTIFACT_URL_PREFIX) && !/\s/.test(body)) mdArtifact(host, body, '');
    else mdNode('code', host).textContent = m[2];
  }],
  [/\\([\\`*_{}\[\]()#+\-.!|~<>$])/, (m, host) => { host.appendChild(document.createTextNode(m[1])); }],
  [/(!?)\[([^\]\n]{1,300})\]\([ \t]*<?((?:[^\s()<>]|\([^\s()<>]*\))+)>?(?:[ \t]+"[^"\n]*")?[ \t]*\)/,
    (m, host) => mdLink(host, m[3], m[2], m[1] === '!', m[0])],
  [/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/, (m, host) => mdInline(m[1], mdNode('em', mdNode('strong', host)))],
  [/\*\*(?=\S)([\s\S]*?\S)\*\*/, (m, host) => mdInline(m[1], mdNode('strong', host))],
  [/(?<![\w\\])__(?=\S)([\s\S]*?\S)__(?!\w)/, (m, host) => mdInline(m[1], mdNode('strong', host))],
  [/~~(?=\S)([\s\S]*?\S)~~/, (m, host) => mdInline(m[1], mdNode('del', host))],
  [/(?<![\w*\\])\*(?=[^\s*])([^*\n]*?[^\s*\\])\*(?!\*)/, (m, host) => mdInline(m[1], mdNode('em', host))],
  [/(?<![\w\\])_(?=[^\s_])([^_\n]*?[^\s_\\])_(?!\w)/, (m, host) => mdInline(m[1], mdNode('em', host))],
  [/\/api\/code\/artifacts\/[^\s`"'<>()\[\]]+/, (m, host) => {
    const n = mdUrlLength(m[0]);
    mdArtifact(host, m[0].slice(0, n), '');
    return n;
  }],
  [/https?:\/\/[^\s<>"'`]+/, (m, host) => {
    const n = mdUrlLength(m[0]);
    const a = mdNode('a', host);
    a.href = m[0].slice(0, n);
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = m[0].slice(0, n);
    return n;
  }],
];

function mdInline(text, host) {
  let rest = text;
  while (rest) {
    let best = null, build = null;
    for (const [re, fn] of MD_INLINE) {
      const m = re.exec(rest);
      if (m && (!best || m.index < best.index)) {
        best = m;
        build = fn;
        if (m.index === 0) break;
      }
    }
    if (!best) {
      host.appendChild(document.createTextNode(rest));
      return;
    }
    if (best.index > 0) host.appendChild(document.createTextNode(rest.slice(0, best.index)));
    const used = build(best, host);
    rest = rest.slice(best.index + (typeof used === 'number' ? used : best[0].length));
  }
}

async function sendMessage() {
  if (isGenerating) return;
  if (pendingUploadCount) {
    alert('Please wait for file uploads to finish, then send again.');
    return;
  }
  const text = messageInput.value.trim();
  if (!text && pendingAttachments.length === 0) return;
  if (!currentLoadedModel) {
    alert('No model is configured. Restart TensorSharp.Server with --model <path.gguf> --backend <type>.');
    return;
  }

  const userContent = text || describeAttachments();
  const msg = { role: 'user', content: userContent };

  const imagePaths = [];
  const stillImagePaths = [];
  const videoFilePaths = [];
  const audioPaths = [];
  const textFilePaths = [];
  const textFileNames = [];
  let isVideo = false;
  const textParts = [];
  const attachmentsCopy = [...pendingAttachments];

  attachmentsCopy.forEach(att => {
    if (att.mediaType === 'image') {
      imagePaths.push(att.file);
      stillImagePaths.push(att.file);
    } else if (att.mediaType === 'video') {
      isVideo = true;
      if (att.file) videoFilePaths.push(att.file);
      if (att.frames) att.frames.forEach(f => imagePaths.push(f));
    } else if (att.mediaType === 'audio') {
      audioPaths.push(att.file);
    } else if (att.mediaType === 'text' && att.fileBacked === true) {
      // CSV rows stay in the uploaded file. The server uses these two fields to
      // stage the complete table under the name the user sees; no rows belong in
      // this message's prompt content.
      if (att.file) { textFilePaths.push(att.file); textFileNames.push(att.fileName || att.file); }
    } else if (att.mediaType === 'text' && att.textContent) {
      textParts.push(`[File: ${att.fileName}]\n${att.textContent}\n[End of file]`);
      // The display name rides along with the stored name (same order) so
      // the shell tool can stage the file under the name the model sees here.
      if (att.file) { textFilePaths.push(att.file); textFileNames.push(att.fileName || att.file); }
    } else if (att.mediaType === 'pdf') {
      if (att.textContent) {
        // Born-digital PDF: inline the extracted text.
        textParts.push(`[File: ${att.fileName}]\n${att.textContent}\n[End of file]`);
        if (att.file) { textFilePaths.push(att.file); textFileNames.push(att.fileName || att.file); }
      } else if (att.frames && att.frames.length) {
        // Scanned / image-only PDF: send its page images to the vision model.
        // Keep the original PDF file as document provenance too, so the server
        // never silently trims pages if the expanded vision prompt is too large.
        if (att.file) { textFilePaths.push(att.file); textFileNames.push(att.fileName || att.file); }
        att.frames.forEach(f => imagePaths.push(f));
      }
    }
  });

  if (textParts.length > 0) {
    const fileContext = textParts.join('\n\n');
    msg.content = fileContext + '\n\n' + msg.content;
  }

  if (imagePaths.length > 0) msg.imagePaths = imagePaths;
  if (stillImagePaths.length > 0) msg.stillImagePaths = stillImagePaths;
  const editSource = attachmentsCopy.find(att => att.mediaType === 'image');
  if (editSource && editSource === activeImageEditTarget && editSource.maskPath && isQwenImageModel()) {
    msg.maskPath = editSource.maskPath;
    msg.maskMode = 'grayscale';
    msg.maskFeather = editSource.maskFeather || 0;
    msg.maskCrop = !!editSource.maskCrop;
  }
  if (videoFilePaths.length > 0) msg.videoFilePaths = videoFilePaths;
  if (audioPaths.length > 0) msg.audioPaths = audioPaths;
  if (textFilePaths.length > 0) msg.textFilePaths = textFilePaths;
  if (textFileNames.length > 0) msg.textFileNames = textFileNames;
  if (isVideo) msg.isVideo = true;
  if (attachmentsCopy.length > 0) {
    // Only durable attachment metadata belongs in history. In particular, never
    // smuggle an inline textContent copy back into every follow-up request.
    msg.attachments = attachmentsCopy.map(att => {
      const stored = {
        file: att.file,
        fileName: att.fileName || att.file,
        mediaType: att.mediaType || 'text'
      };
      if (att.frames && att.frames.length) stored.frames = [...att.frames];
      if (att.fileBacked === true) stored.fileBacked = true;
      if (att.previewUrl) stored.previewUrl = att.previewUrl;
      if (att.editUrl) stored.editUrl = att.editUrl;
      if (att.editUnavailableReason) stored.editUnavailableReason = att.editUnavailableReason;
      if (att.maskPath) {
        stored.maskPath = att.maskPath;
        stored.maskFeather = att.maskFeather || 0;
        stored.maskCrop = !!att.maskCrop;
      }
      return stored;
    });
  }

  chatHistory.push(msg);
  addUserBubble(userContent, attachmentsCopy, chatHistory.length - 1);
  messageInput.value = '';
  messageInput.style.height = 'auto';
  pendingAttachments = [];
  activeImageEditTarget = null;
  attachmentsDiv.innerHTML = '';

  const empt = chatContainer.querySelector('.empty-state');
  if (empt) empt.remove();

  await requestAssistantResponse();
}

async function runImageEdit(userMsg, bubbleText, statsDiv) {
  const editImages = userMsg.stillImagePaths || userMsg.imagePaths || [];
  const editing = editImages.length > 0;
  const action = editing ? 'Image edit' : 'Image generation';
  bubbleText.textContent = editing ? 'Starting edit…' : 'Generating image…';
  statsDiv.textContent = action;
  const t0 = performance.now();

  // The image element is created lazily on the first frame, then refreshed in place as the
  // denoise progresses so the user sees the picture forming (rather than a frozen "generating…").
  let img = null;
  function ensureImg() {
    if (img) return img;
    bubbleText.innerHTML = '';
    img = document.createElement('img');
    img.alt = 'image (denoising…)';
    img.style.maxWidth = '512px';
    img.style.maxHeight = '512px';
    img.style.borderRadius = '8px';
    img.style.display = 'block';
    img.style.imageRendering = 'auto';
    bubbleText.appendChild(img);
    return img;
  }

  try {
    const res = await fetch(editing ? '/api/image-edit/stream' : '/api/image-generate/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // An edit comes back at its source picture's own size, as a selection edit always
      // did; sized from the area alone, an edit of an edit could come back smaller.
      body: JSON.stringify({ imagePaths: editImages,
        prompt: userMsg.content || '', keepSourceSize: editing || undefined,
        maskPath: userMsg.maskPath, maskMode: userMsg.maskMode,
        maskFeather: userMsg.maskFeather, maskCrop: userMsg.maskCrop }),
      signal: currentAbortController.signal
    });
    if (!res.ok) {
      let err = 'HTTP ' + res.status;
      try { const j = await res.json(); if (j && j.error) err = j.error; } catch {}
      bubbleText.textContent = action + ' failed: ' + err;
      statsDiv.textContent = 'Failed';
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch { continue; }

        if (data.imageEdit || data.imageGenerate) {
          if (data.image) { ensureImg().src = data.image; }
          if (data.total > 0) statsDiv.textContent = `Denoising… step ${data.step}/${data.total}`;
          scrollChatToBottom();
        } else if (data.done) {
          if (data.error) {
            bubbleText.textContent = action + ' failed: ' + data.error;
            statsDiv.textContent = 'Failed';
          } else {
            ensureImg().src = data.url + '?t=' + Date.now();  // final full-resolution result
            img.alt = editing ? 'edited image' : 'generated image';
            const dl = document.createElement('a');
            dl.href = data.url;
            dl.setAttribute('download', '');
            dl.textContent = '⬇ Download image';
            dl.style.cssText = 'display:inline-block;margin-top:8px;color:var(--accent);';
            bubbleText.appendChild(dl);
            if (editing) addImageEditActions(bubbleText, img, userMsg, data.url);
            statsDiv.textContent = `${editing ? "Edited" : "Generated"} ${data.width}×${data.height} · ${((performance.now() - t0) / 1000).toFixed(1)}s`;
          }
          scrollChatToBottom();
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') { if (!img) bubbleText.textContent = action + ' cancelled.'; statsDiv.textContent = 'Stopped by user'; }
    else { bubbleText.textContent = action + ' error: ' + e.message; statsDiv.textContent = 'Failed'; }
  }
}

function addImageEditActions(host, img, userMsg, resultUrl) {
  const actions = document.createElement('div');
  actions.className = 'image-edit-actions';
  const source = (userMsg.attachments || []).find(att => att.mediaType === 'image') ||
    { file: (userMsg.stillImagePaths || userMsg.imagePaths)[0], mediaType: 'image' };
  const compare = document.createElement('button');
  compare.type = 'button';
  compare.textContent = 'Show original';
  compare.setAttribute('aria-pressed', 'false');
  compare.addEventListener('click', () => {
    const original = compare.getAttribute('aria-pressed') !== 'true';
    img.src = original ? (source.editUrl || uploadUrlForAttachment(source)) : resultUrl;
    img.alt = original ? 'original image' : 'edited image';
    compare.textContent = original ? 'Show edited' : 'Show original';
    compare.setAttribute('aria-pressed', String(original));
  });
  const again = document.createElement('button');
  again.type = 'button';
  again.textContent = 'Edit again';
  again.addEventListener('click', () => {
    if (isGenerating || pendingUploadCount) return;
    // Keep the original canvas and its selection together for reproducible retries.
    const attachments = (userMsg.attachments || [source]).filter(att => att.mediaType === 'image')
      .map(att => ({ ...att }));
    if (userMsg.maskPath && attachments.length) Object.assign(attachments[0], {
      maskPath: userMsg.maskPath, maskFeather: userMsg.maskFeather, maskCrop: userMsg.maskCrop
    });
    pendingAttachments = attachments;
    activeImageEditTarget = userMsg.maskPath ? attachments[0] : null;
    messageInput.value = userMsg.content || '';
    renderAttachments();
    messageInput.focus();
  });
  actions.append(compare, again);
  host.appendChild(actions);
}

// "1h 04m" / "7m 12s" / "43s"; '' when the value is missing or not yet known.
function fmtDuration(s) {
  if (typeof s !== 'number' || !(s > 0)) return '';
  if (s >= 3600) return `${Math.floor(s / 3600)}h ${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}m`;
  if (s >= 60) return `${Math.floor(s / 60)}m ${String(Math.floor(s % 60)).padStart(2, '0')}s`;
  return `${Math.round(s)}s`;
}

async function runVideoGenerate(userMsg, bubbleText, statsDiv) {
  bubbleText.textContent = 'Starting video generation… (this takes a few minutes)';
  // What attached media MEANS depends on the checkpoint, and only the server knows
  // which one is loaded. A reference model (MiniMax-H3 Ref2VA) takes stills, clips
  // and soundtracks as identity and appearance references for a brand-new scene and
  // accepts several at once; a keyframe model takes the first still as the opening
  // frame and, where it does first-and-last, a second as the closing one. Sending the
  // attachments down the wrong one of those is not a degraded clip, it is a refused
  // request, so the payload is shaped from /api/models rather than guessed here.
  // With no capability block (an older server, or a model that reports none) this
  // falls through to exactly the single-image request the UI has always sent.
  const caps = currentVideoCaps || {};
  // Stills only: imagePaths flattens an attached clip into its frames, and nine of
  // those are nine unrelated reference pictures rather than the one clip meant.
  const stills = userMsg.stillImagePaths || userMsg.imagePaths || [];
  const clips = userMsg.videoFilePaths || [];
  const sounds = userMsg.audioPaths || [];
  const payload = { prompt: userMsg.content || '' };
  let mode = 'Text-to-Video';
  let unused = 0;

  if (caps.supportsReferenceConditioning) {
    const cap = caps.maxReferenceImages > 0 ? caps.maxReferenceImages : stills.length;
    const refs = stills.slice(0, cap);
    unused = stills.length - refs.length;
    if (refs.length) payload.referenceImages = refs;
    if (clips.length) payload.referenceVideos = clips;
    if (sounds.length) payload.referenceAudios = sounds;
    const parts = [];
    if (refs.length) parts.push(refs.length + (refs.length === 1 ? ' image' : ' images'));
    if (clips.length) parts.push(clips.length + (clips.length === 1 ? ' clip' : ' clips'));
    if (sounds.length) parts.push(sounds.length + (sounds.length === 1 ? ' soundtrack' : ' soundtracks'));
    mode = parts.length ? 'Reference-to-Video \u00b7 ' + parts.join(' + ') : 'Text-to-Video';
  } else if (stills.length > 0) {
    payload.imagePath = stills[0];
    mode = 'Image-to-Video';
    if (stills.length > 1 && caps.supportsEndImageConditioning) {
      payload.endImage = stills[1];
      mode = 'First-and-last-frame';
    }
    unused = stills.length - (payload.endImage ? 2 : 1);
  }
  statsDiv.textContent = mode +
    (unused > 0 ? ' (' + unused + (unused === 1 ? ' image' : ' images') + ' not used)' : '');
  const t0 = performance.now();

  try {
    const res = await fetch('/api/video-generate/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: currentAbortController.signal
    });
    if (!res.ok) {
      let err = 'HTTP ' + res.status;
      try { const j = await res.json(); if (j && j.error) err = j.error; } catch {}
      bubbleText.textContent = 'Video generation failed: ' + err;
      statsDiv.textContent = 'Failed';
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch { continue; }

        if (data.videoGen) {
          // A single denoising pass at 720p/121 frames runs for minutes, so the
          // server also sends heartbeats carrying the phase and a running ETA.
          // Show those, otherwise the UI looks frozen between steps.
          const eta = fmtDuration(data.etaSeconds);
          const el = fmtDuration(data.elapsedSeconds);
          if (data.phase && data.phase !== 'denoise') {
            const label = data.phase === 'text-encode' ? 'Encoding prompt'
                        : data.phase === 'image-encode' ? 'Encoding the input image'
                        : data.phase === 'vae-decode' ? 'Decoding frames'
                        : data.phase === 'done' ? 'Finishing' : data.phase;
            statsDiv.textContent = `${label}… ${el}`;
            bubbleText.textContent = `${label}${data.detail ? ' (' + data.detail + ')' : ''}…`;
          } else if (data.total > 0) {
            statsDiv.textContent = `Denoising… step ${data.step}/${data.total}` + (eta ? ` · ${eta} left` : '');
            bubbleText.textContent = `Generating video… step ${data.step} of ${data.total}`
              + (data.detail ? ` — ${data.detail}` : '')
              + (eta ? ` · about ${eta} left` : '')
              + (el ? ` · ${el} elapsed` : '');
          }
        } else if (data.done) {
          if (data.error) {
            bubbleText.textContent = 'Video generation failed: ' + data.error;
            statsDiv.textContent = 'Failed';
          } else {
            bubbleText.innerHTML = '';
            const vid = document.createElement('video');
            vid.src = data.url;
            vid.controls = true;
            vid.autoplay = true;
            vid.loop = true;
            vid.muted = true;
            vid.playsInline = true;
            vid.style.maxWidth = '640px';
            vid.style.maxHeight = '480px';
            vid.style.borderRadius = '8px';
            vid.style.display = 'block';
            bubbleText.appendChild(vid);
            const dl = document.createElement('a');
            dl.href = data.url;
            dl.setAttribute('download', '');
            dl.textContent = '⬇ Download video';
            dl.style.cssText = 'display:inline-block;margin-top:8px;color:var(--accent);';
            bubbleText.appendChild(dl);
            statsDiv.textContent = `${data.width}×${data.height} · ${data.frames} frames @ ${data.fps} fps · seed ${data.seed} · ${((performance.now() - t0) / 1000).toFixed(1)}s`;
          }
          scrollChatToBottom();
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') { bubbleText.textContent = 'Video generation cancelled.'; statsDiv.textContent = 'Stopped by user'; }
    else { bubbleText.textContent = 'Video generation error: ' + e.message; statsDiv.textContent = 'Failed'; }
  }
}

async function requestAssistantResponse() {
  if (isGenerating) return;
  if (!currentLoadedModel) return;

  isGenerating = true;
  currentAbortController = new AbortController();
  setSendButtonState(true);

  const assistDiv = addAssistantBubble();
  const bubbleText = assistDiv.querySelector('.bubble-text');
  const statsDiv = assistDiv.querySelector('.stats');

  let fullText = '';
  let fullThinking = '';
  let wasAborted = false;
  // Tokens arrive faster than frames, so the answer is re-rendered at most once a
  // frame. Anything that writes the bubble another way cancels a pending render first.
  let answerFrame = 0;
  const renderLiveAnswer = () => {
    if (answerFrame) return;
    answerFrame = requestAnimationFrame(() => {
      answerFrame = 0;
      renderMarkdown(bubbleText, fullText);
      scrollChatToBottom();
    });
  };
  const cancelLiveAnswer = () => {
    if (answerFrame) cancelAnimationFrame(answerFrame);
    answerFrame = 0;
  };
  // Names of tool calls the server handed back because nothing in process answered
  // them. This page has no tool implementations, so they are reported, never run.
  let forwardedToolCalls = [];

  try {
    if (!currentSessionId) {
      await createSession();
    }

    // Qwen image models use the diffusion endpoints; an attachment selects editing.
    const _lastUser = chatHistory[chatHistory.length - 1];
    if ((currentArchitecture === 'qwen_image' || currentArchitecture === 'qwen-image') && _lastUser) {
      await runImageEdit(_lastUser, bubbleText, statsDiv);
      return;
    }

    // Video generation: the prompt (plus an optional attached image as the first
    // frame) produces a video, not chat text. Every video architecture routes here.
    if (VIDEO_ARCHITECTURES.has(currentArchitecture) && _lastUser) {
      await runVideoGenerate(_lastUser, bubbleText, statsDiv);
      return;
    }

    const reasoningOn = document.getElementById('reasoning-toggle').checked;
    const chatPayload = { messages: chatHistory, maxTokens: serverDefaultMaxTokens, think: reasoningOn };
    if (currentSessionId) {
      chatPayload.sessionId = currentSessionId;
    }
    if (selectedSkills.length > 0) {
      chatPayload.skills = selectedSkills.slice();
    }
    if (needsCacheReset) {
      chatPayload.newChat = true;
      needsCacheReset = false;
    }

    let res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(chatPayload),
      signal: currentAbortController.signal
    });

    if (res.status === 404 && chatPayload.sessionId) {
      // Session vanished on the server (e.g. restart); recreate and retry once.
      currentSessionId = null;
      await createSession();
      if (currentSessionId) {
        chatPayload.sessionId = currentSessionId;
        chatPayload.newChat = true;
        res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(chatPayload),
          signal: currentAbortController.signal
        });
      }
    }

    if (!res.ok) {
      let detail = `HTTP ${res.status}`;
      try {
        const errorText = await res.text();
        if (errorText) {
          try {
            const errorBody = JSON.parse(errorText);
            detail = errorBody.error || errorBody.detail || errorBody.message || errorText;
          } catch {
            detail = errorText;
          }
        }
      } catch {}
      throw new Error(detail);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.thinking) {
            fullThinking += data.thinking;
            let thinkBlock = assistDiv.querySelector('.thinking-block');
            if (!thinkBlock) {
              thinkBlock = document.createElement('div');
              thinkBlock.className = 'thinking-block';
              const expanded = reasoningOn ? ' expanded' : '';
              const visible = reasoningOn ? ' visible' : '';
              const display = reasoningOn ? '' : ' style="display:none"';
              thinkBlock.innerHTML = `<div class="thinking-header" onclick="toggleThinking(this)"${display}><span class="arrow${expanded}">&#x25B6;</span> Reasoning</div><div class="thinking-content${visible}"></div>`;
              bubbleText.parentNode.insertBefore(thinkBlock, bubbleText);
            }
            const tc = thinkBlock.querySelector('.thinking-content');
            tc.textContent += data.thinking;
            if (reasoningOn) scrollChatToBottom();
          }
          if (data.skill_step) {
            // Completion metadata is intentionally not rendered as a history.
            // Keep only user-facing output files; call execution is logged
            // by the server and the matching `finished` event clears live activity.
            if (Array.isArray(data.files) && data.files.length) {
              appendArtifactFiles(assistDiv, data.files);
              scrollChatToBottom();
            }
          }
          if (data.tool_progress) {
            // Live "writing code… / running…" state for an in-process tool call.
            updateToolProgress(assistDiv, data);
            scrollChatToBottom();
          }
          if (data.tool_calls) {
            // A tool call the SERVER could not answer and handed back. This page
            // declares no tools of its own, so there is nothing here to run it — and
            // for a long time nothing here to show it either: the frame matched none
            // of the key checks and fell into the catch below, so a reply whose every
            // word was inside the reasoning block rendered as an empty bubble and the
            // chat simply stopped. Say what happened instead of nothing.
            forwardedToolCalls = forwardedToolCalls.concat(
              data.tool_calls.map(c => c && c.name).filter(Boolean));
            scrollChatToBottom();
          }
          if (data.token) {
            fullText += data.token;
            renderLiveAnswer();
          }
          if (data.replace !== undefined) {
            // DiffusionGemma live denoising preview: each frame refines the whole
            // canvas, so replace (not append) the assistant message body.
            fullText = data.replace;
            bubbleText.textContent = fullText;
            if (data.preview && data.diffusionTotal > 0) {
              statsDiv.textContent = `Denoising\u2026 step ${data.diffusionStep}/${data.diffusionTotal}`;
            }
            scrollChatToBottom();
          }
          if (data.done) {
            cancelLiveAnswer();
            clearCurrentActivity(assistDiv);
            if (data.sessionId) currentSessionId = data.sessionId;
            if (data.error) {
              bubbleText.textContent = 'Error: ' + data.error;
              statsDiv.textContent = 'Inference failed';
            } else {
              // A turn that produced no answer at all must never render as a blank
              // bubble. It happens when the model spent the whole reply asking for a
              // tool nobody can run, and the silence is indistinguishable from a hang:
              // the user's only move is to retry the identical prompt and watch it
              // happen again.
              if (!fullText) {
                bubbleText.textContent = forwardedToolCalls.length > 0
                  ? 'No answer was produced: the model asked for '
                    + forwardedToolCalls.join(', ')
                    + ', which this page cannot run. Try rephrasing, or ask it to answer directly.'
                  : 'No answer was produced. Try sending the message again, or rephrasing it.';
                bubbleText.style.opacity = '0.75';
              }
              // The finished answer, rendered once more in full: the last frame may
              // not have drawn the final tokens yet.
              if (fullText) renderMarkdown(bubbleText, fullText);
              let stats = `${data.tokenCount} tokens \u00B7 ${data.elapsed.toFixed(1)}s \u00B7 ${data.tokPerSec.toFixed(1)} tok/s`;
              if (typeof data.promptTokens === 'number' && data.promptTokens > 0) {
                const reused = typeof data.kvReusedTokens === 'number' ? data.kvReusedTokens : 0;
                const pct = typeof data.kvReusePercent === 'number'
                  ? data.kvReusePercent
                  : (100 * reused / data.promptTokens);
                stats += ` \u00B7 KV ${reused}/${data.promptTokens} (${pct.toFixed(0)}%)`;
              }
              // The reply stopped because it ran out of max-tokens budget, not
              // because the model was done. Say so, otherwise an answer that
              // ends mid-word just looks like the model broke.
              if (data.truncated) stats += ' \u00B7 truncated (max tokens reached)';
              statsDiv.textContent = stats;
            }
          }
        } catch {}
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      wasAborted = true;
      statsDiv.textContent = 'Stopped by user';
    } else {
      cancelLiveAnswer();
      bubbleText.textContent = 'Error: ' + e.message;
    }
  } finally {
    // Covers cancellation, network failure, malformed/early-ended SSE, and any
    // server path that could not emit the normal `finished`/`done` lifecycle.
    clearCurrentActivity(assistDiv);
    if (fullText) {
      const assistantMessage = { role: 'assistant', content: fullText };
      if (fullThinking) assistantMessage.thinking = fullThinking;
      chatHistory.push(assistantMessage);

      const assistIdx = chatHistory.length - 1;
      assistDiv.dataset.idx = assistIdx;
      const bubble = assistDiv.querySelector('.bubble');
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'msg-actions';
      actionsDiv.innerHTML = `<button class="danger" onclick="revertFrom(${assistIdx})" title="Remove this response">&#x21A9; Revert</button>`;
      bubble.appendChild(actionsDiv);
    }
    isGenerating = false;
    currentAbortController = null;
    setSendButtonState(false);
    const indicator = assistDiv.querySelector('.typing-indicator');
    if (indicator) indicator.remove();
  }
}

function revertFrom(historyIdx) {
  if (isGenerating) return;

  chatHistory.splice(historyIdx);

  chatContainer.querySelectorAll('.message').forEach(el => {
    if (parseInt(el.dataset.idx) >= historyIdx) el.remove();
  });

  needsCacheReset = true;
  if (chatHistory.length === 0) {
    renderEmptyState();
  }
}

function startEdit(historyIdx) {
  if (isGenerating) return;

  const msgEl = chatContainer.querySelector(`.message[data-idx="${historyIdx}"]`);
  if (!msgEl) return;

  const bubble = msgEl.querySelector('.bubble');
  const originalText = chatHistory[historyIdx].content;

  editOriginalHtml.set(historyIdx, bubble.innerHTML);

  const mediaPreviews = bubble.querySelectorAll('.media-preview');
  let mediaHtml = '';
  mediaPreviews.forEach(mp => { mediaHtml += mp.outerHTML; });

  bubble.innerHTML = `${mediaHtml}<textarea class="edit-textarea">${escapeHtml(originalText)}</textarea>
    <div class="edit-actions">
      <button onclick="cancelEdit(${historyIdx})">Cancel</button>
      <button class="primary" onclick="submitEdit(${historyIdx})">Save &amp; Send</button>
    </div>`;

  const textarea = bubble.querySelector('.edit-textarea');
  textarea.focus();
  textarea.setSelectionRange(textarea.value.length, textarea.value.length);
}

function cancelEdit(historyIdx) {
  const msgEl = chatContainer.querySelector(`.message[data-idx="${historyIdx}"]`);
  if (!msgEl) return;

  const bubble = msgEl.querySelector('.bubble');
  const original = editOriginalHtml.get(historyIdx);
  if (original) {
    bubble.innerHTML = original;
    editOriginalHtml.delete(historyIdx);
  }
}

async function submitEdit(historyIdx) {
  const msgEl = chatContainer.querySelector(`.message[data-idx="${historyIdx}"]`);
  if (!msgEl) return;

  const bubble = msgEl.querySelector('.bubble');
  const textarea = bubble.querySelector('.edit-textarea');
  const newText = textarea.value.trim();
  if (!newText) return;

  editOriginalHtml.delete(historyIdx);

  chatHistory[historyIdx].content = newText;
  chatHistory.splice(historyIdx + 1);

  chatContainer.querySelectorAll('.message').forEach(el => {
    if (parseInt(el.dataset.idx) > historyIdx) el.remove();
  });

  const mediaPreviews = bubble.querySelectorAll('.media-preview');
  let mediaHtml = '';
  mediaPreviews.forEach(mp => { mediaHtml += mp.outerHTML; });

  bubble.innerHTML = `${mediaHtml}<span class="bubble-text">${escapeHtml(newText)}</span>
    <div class="msg-actions">
      <button onclick="startEdit(${historyIdx})" title="Edit this message">&#x270E; Edit</button>
      <button class="danger" onclick="revertFrom(${historyIdx})" title="Revert from here">&#x21A9; Revert</button>
    </div>`;

  needsCacheReset = true;
  await requestAssistantResponse();
}

function abortGeneration() {
  if (currentAbortController) {
    currentAbortController.abort();
  }
}

function setSendButtonState(generating) {
  const btn = document.getElementById('btn-send');
  if (generating) {
    btn.className = 'stop-btn';
    btn.innerHTML = '&#x25A0;';
    btn.setAttribute('onclick', 'abortGeneration()');
    btn.title = 'Stop generating';
  } else {
    btn.className = 'send-btn';
    btn.innerHTML = '&#x27A4;';
    btn.setAttribute('onclick', 'sendMessage()');
    btn.title = 'Send message';
  }
}

function describeAttachments() {
  const types = pendingAttachments.map(a => a.mediaType);
  if (types.includes('video')) return 'What is happening in this video?';
  if (types.includes('audio')) return 'Listen to this audio and describe what you hear.';
  if (types.includes('image')) return 'What is in this image?';
  if (types.includes('pdf')) return 'Please analyze the attached PDF document and summarize its content.';
  if (types.includes('text')) return 'Please analyze the attached text file and summarize its content.';
  return 'Describe the attached file.';
}

function addUserBubble(text, attachments, historyIdx) {
  const div = document.createElement('div');
  div.className = 'message user';
  div.dataset.idx = historyIdx;

  let mediaHtml = '';
  attachments.forEach(att => {
    if (att.mediaType === 'image') {
      mediaHtml += `<div class="media-preview"><img src="${escapeHtml(uploadUrlForAttachment(att))}" alt="uploaded"></div>`;
    } else if (att.mediaType === 'video') {
      mediaHtml += `<div class="media-preview"><div class="audio-label">&#x1F3AC; ${escapeHtml(att.fileName || '')}</div></div>`;
    } else if (att.mediaType === 'audio') {
      mediaHtml += `<div class="media-preview"><div class="audio-label">&#x1F3B5; ${escapeHtml(att.fileName || '')}</div></div>`;
    } else if (att.mediaType === 'text') {
      mediaHtml += `<div class="media-preview"><div class="audio-label">&#x1F4DD; ${escapeHtml(att.fileName || '')}</div></div>`;
    } else if (att.mediaType === 'pdf') {
      if (att.renderedAsImages && att.frameUrls && att.frameUrls.length) {
        const n = att.frameUrls.length;
        const pageStatus = Number.isInteger(att.extractedPageCount) && Number.isInteger(att.pageCount)
          ? `${att.extractedPageCount}/${att.pageCount} pages`
          : `${n} page image${n > 1 ? 's' : ''}`;
        mediaHtml += `<div class="media-preview"><img src="${escapeHtml(att.frameUrls[0])}" alt="pdf page"></div>`;
        mediaHtml += `<div class="audio-label">&#x1F4C4; ${escapeHtml(att.fileName || '')} (${pageStatus})</div>`;
      } else {
        mediaHtml += `<div class="media-preview"><div class="audio-label">&#x1F4C4; ${escapeHtml(att.fileName || '')}</div></div>`;
      }
    }
  });

  div.innerHTML = `
    <div class="avatar">U</div>
    <div class="bubble">${mediaHtml}<span class="bubble-text">${escapeHtml(text)}</span>
      <div class="msg-actions">
        <button onclick="startEdit(${historyIdx})" title="Edit this message">&#x270E; Edit</button>
        <button class="danger" onclick="revertFrom(${historyIdx})" title="Revert from here">&#x21A9; Revert</button>
      </div>
    </div>`;
  chatContainer.appendChild(div);
  scrollChatToBottom();
}

function addAssistantBubble() {
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.innerHTML = `
    <div class="avatar"><img src="/images/assistant_logo.png" alt=""></div>
    <div class="bubble">
      <div class="bubble-text"></div>
      <div class="typing-indicator"><span></span><span></span><span></span></div>
      <div class="stats"></div>
    </div>`;
  chatContainer.appendChild(div);
  scrollChatToBottom();
  return div;
}

function toggleThinking(header) {
  const arrow = header.querySelector('.arrow');
  const content = header.nextElementSibling;
  arrow.classList.toggle('expanded');
  content.classList.toggle('visible');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function uploadUrlForAttachment(att) {
  // Formats the browser can't render (HEIC/HEIF) get a server-generated PNG preview.
  if (att && att.previewUrl) return att.previewUrl;
  if (att && att.url) return att.url;
  const raw = String((att && (att.file || att.fileName)) || '');
  if (!raw) return '';
  const normalized = raw.replace(/\\/g, '/');
  const fileName = normalized.split('/').filter(Boolean).pop() || raw;
  return '/uploads/' + encodeURIComponent(fileName);
}

fetchServerState();

const queueBadge = document.getElementById('queue-badge');

function pluralReq(n) {
  return n === 1 ? '1 request' : `${n} requests`;
}

function renderQueueBadge(processing, waiting) {
  // Reset to a known-idle state, then re-apply the active classes if needed so
  // the badge color/layout always matches the current counts.
  queueBadge.classList.remove('queue-active', 'processing-only', 'has-waiting');
  queueBadge.style.removeProperty('background');
  queueBadge.style.removeProperty('color');

  if (processing <= 0 && waiting <= 0) {
    queueBadge.style.display = 'none';
    queueBadge.innerHTML = '';
    return;
  }

  const segments = [`${pluralReq(processing)} processing`];
  if (waiting > 0) segments.push(`${pluralReq(waiting)} queued`);

  queueBadge.innerHTML = '<span class="queue-badge-dot"></span><span>' + segments.join(' · ') + '</span>';
  queueBadge.classList.add('queue-active', waiting > 0 ? 'has-waiting' : 'processing-only');
  queueBadge.title = `Live inference load: ${processing} processing concurrently, ${waiting} waiting in queue`;
  queueBadge.style.display = '';
}

async function pollQueueStatus() {
  try {
    const res = await fetch('/api/queue/status');
    const data = await res.json();
    // `processing` is the count of requests being generated concurrently; older
    // servers only sent the boolean `busy`, so fall back to that.
    const processing = typeof data.processing === 'number'
      ? data.processing
      : (data.busy ? 1 : 0);
    const waiting = typeof data.pending_requests === 'number' ? data.pending_requests : 0;
    renderQueueBadge(processing, waiting);
  } catch {}
}

pollQueueStatus();
setInterval(pollQueueStatus, 1000);
</script>
